    function createDefaultBackupCfg() {
      return {
        frequency: "realtime", // realtime | daily | weekly | manual
        lastLocalBackupAt: new Date().toISOString(),
        lastCloudBackupAt: null,
        lastBackupSizeBytes: 0,
        lastBackupFileName: "labkom_backup.json",
        backupCount: 0
      };
    }

    // ========================================================================
    // 4. PERSISTENSI LOCALSTORAGE & PENJAGAAN SESI (ANTI RANDOM LOGOUT)
    // ========================================================================
    function loadAllFromStorage() {
      try {
        gasUrl = (localStorage.getItem(GAS_URL_KEY) || "").trim();
      } catch {
        gasUrl = "";
      }

      try {
        const rawState = localStorage.getItem(STATE_KEY);
        db = rawState ? JSON.parse(rawState) : createSeedState();
        if (!rawState) persistState(false);
      } catch {
        db = createSeedState();
        persistState(false);
      }

      try {
        const rawCfg = localStorage.getItem(BACKUP_CFG_KEY);
        backupCfg = rawCfg ? Object.assign(createDefaultBackupCfg(), JSON.parse(rawCfg)) : createDefaultBackupCfg();
      } catch {
        backupCfg = createDefaultBackupCfg();
      }
      backupCfg.lastBackupSizeBytes = getSerializedStateSize();
      persistBackupCfg();

      try {
        const rawSess = localStorage.getItem(SESSION_KEY);
        if (rawSess) {
          const parsed = JSON.parse(rawSess);
          if (parsed && parsed.user && parsed.user.id) {
            session = parsed;
            // Pastikan user objek sinkron dengan cache lokal bila mode lokal
            if (session.mode === "local") {
              const latest = db.users.find((u) => u.id === session.user.id);
              if (latest) session.user = sanitizeUserObj(latest);
            }
          }
        }
      } catch {
        session = null;
      }

      updateSyncIndicator();
    }

    function getSerializedStateSize() {
      try {
        const str = JSON.stringify(db || {});
        return new Blob([str]).size;
      } catch {
        return 0;
      }
    }

    function persistState(triggerAutoBackup = true) {
      try {
        const serialized = JSON.stringify(db);
        localStorage.setItem(STATE_KEY, serialized);
        if (backupCfg) {
          backupCfg.lastLocalBackupAt = new Date().toISOString();
          backupCfg.lastBackupSizeBytes = new Blob([serialized]).size;
          persistBackupCfg();
        }
        if (triggerAutoBackup) {
          scheduleRealtimeAutoBackup("auto_mutation");
        }
      } catch {
        showToast("Penyimpanan lokal penuh. Hapus sebagian file besar atau ekspor cadangan.", "error");
      }
    }

    function persistSession(newSession) {
      session = newSession;
      try {
        if (newSession) {
          localStorage.setItem(SESSION_KEY, JSON.stringify(newSession));
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch {
        // ignore storage quota errors on session write
      }
    }

    function persistBackupCfg() {
      try {
        localStorage.setItem(BACKUP_CFG_KEY, JSON.stringify(backupCfg));
      } catch {}
    }

    function persistGasUrl(url) {
      gasUrl = (url || "").trim();
      try {
        if (gasUrl) localStorage.setItem(GAS_URL_KEY, gasUrl);
        else localStorage.removeItem(GAS_URL_KEY);
      } catch {}
      updateSyncIndicator();
    }

    function isCloudConfigured() {
      return Boolean(gasUrl && /^https?:\/\//i.test(gasUrl));
    }

    function isCloudSession() {
      return Boolean(isCloudConfigured() && session && session.mode === "cloud");
    }

    function updateSyncIndicator(customStatus) {
      if (customStatus) {
        ui.syncStatus = customStatus;
        return;
      }
      if (ui.isOffline) {
        ui.syncStatus = isCloudConfigured() ? "offline" : "local";
      } else if (isCloudConfigured()) {
        ui.syncStatus = isCloudSession() ? "synced" : "pending";
      } else {
        ui.syncStatus = "local";
      }
    }

    // ========================================================================
    // 5. DUAL-ENGINE API CLIENT (GOOGLE APPS SCRIPT + LOCAL FALLBACK)
    // ========================================================================
    async function callGas(action, payload = {}, overrideUrl = null) {
      const targetUrl = (overrideUrl || gasUrl || "").trim();
      if (!targetUrl) {
        return { ok: false, error: "URL Google Apps Script belum diatur.", isNetworkError: false };
      }
      if (!navigator.onLine) {
        ui.isOffline = true;
        updateSyncIndicator("offline");
        return { ok: false, error: "Koneksi internet terputus. Perubahan tetap aman di penyimpanan lokal.", isNetworkError: true };
      }

      try {
        const res = await fetch(targetUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action,
            token: session?.token || "",
            payload: payload || {}
          })
        });

        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          return {
            ok: false,
            error: "Respons server Google Apps Script tidak valid (pastikan Web App di-deploy untuk 'Anyone').",
            isNetworkError: false
          };
        }

        if (typeof json.ok !== "boolean") {
          return { ok: false, error: "Format respons API tidak dikenali.", isNetworkError: false };
        }
        return json;
      } catch (err) {
        return {
          ok: false,
          error: "Gagal terhubung ke server Google Drive (Apps Script). Periksa URL atau jaringan internet Anda.",
          isNetworkError: true
        };
      }
    }

    /**
     * Sinkronisasi data terbaru dari Google Drive (Cloud Mode)
     * Tidak pernah me-logout pengguna ketika jaringan bermasalah!
     */
    async function syncFromCloud(silent = true) {
      if (!isCloudSession()) return false;
      if (!navigator.onLine) {
        ui.isOffline = true;
        updateSyncIndicator("offline");
        return false;
      }

      updateSyncIndicator("syncing");
      renderSyncDotOnly();

      const res = await callGas("sync", {});
      if (res.ok && res.data) {
        mergeCloudState(res.data);
        updateSyncIndicator("synced");
        if (!silent) showToast("Data berhasil disinkronkan dari Google Drive.", "success");
        render();
        return true;
      } else {
        updateSyncIndicator(res.isNetworkError ? "offline" : "pending");
        renderSyncDotOnly();
        if (!silent && res.error) showToast(res.error, "error");
        return false;
      }
    }

    function mergeCloudState(cloudData) {
      const keys = ["classes", "users", "class_assistants", "enrollments", "articles", "likes", "comments", "announcements", "assignments", "submissions", "grades"];
      keys.forEach((k) => {
        if (Array.isArray(cloudData[k])) {
          db[k] = cloudData[k];
        }
      });
      // Keamanan mutlak: pastikan praktikan tidak pernah menyimpan array grades di state lokal
      if (session?.user?.role === "praktikan") {
        db.grades = [];
      }
      if (cloudData.user && session) {
        session.user = sanitizeUserObj(cloudData.user);
        persistSession(session);
      }
      if (cloudData.backupInfo) {
        if (cloudData.backupInfo.lastCloudBackupAt) backupCfg.lastCloudBackupAt = cloudData.backupInfo.lastCloudBackupAt;
        if (cloudData.backupInfo.lastBackupFileName) backupCfg.lastBackupFileName = cloudData.backupInfo.lastBackupFileName;
        if (typeof cloudData.backupInfo.backupCount === "number") backupCfg.backupCount = cloudData.backupInfo.backupCount;
        persistBackupCfg();
      }
      persistState(false);
    }

    // ========================================================================
    // 6. AUTO-BACKUP ENGINE ALA WHATSAPP (REALTIME / DAILY / WEEKLY / MANUAL)
    // ========================================================================
    function scheduleRealtimeAutoBackup(reason = "realtime") {
      if (!backupCfg || backupCfg.frequency !== "realtime") return;
      clearTimeout(autoBackupDebounceTimer);
      autoBackupDebounceTimer = setTimeout(() => {
        performBackup({ reason, silent: true });
      }, 4000);
    }

    function checkScheduledBackupOnStartup() {
      if (!backupCfg || !session) return;
      const freq = backupCfg.frequency;
      if (freq !== "daily" && freq !== "weekly") return;

      const lastIso = isCloudSession() ? backupCfg.lastCloudBackupAt : backupCfg.lastLocalBackupAt;
      const intervalMs = freq === "daily" ? 24 * 3600 * 1000 : 7 * 24 * 3600 * 1000;
      const elapsed = lastIso ? Date.now() - new Date(lastIso).getTime() : Infinity;

      if (elapsed >= intervalMs) {
        performBackup({ reason: `scheduled_${freq}`, silent: true });
      }
    }

    async function performBackup({ reason = "manual", silent = false } = {}) {
      if (ui.isBackingUp) return;
      ui.isBackingUp = true;
      ui.backupProgressText = isCloudSession() ? "Mengunggah snapshot ke Google Drive..." : "Menyimpan snapshot lokal...";
      if (ui.activeTab === "profil") render();

      const nowIso = new Date().toISOString();
      const snapshotPayload = {
        app: "Laboratorium Komputer (Labkom)",
        version: 2,
        backedUpAt: nowIso,
        reason,
        state: db
      };
      const serialized = JSON.stringify(snapshotPayload);
      const sizeBytes = new Blob([serialized]).size;

      // Selalu simpan snapshot lokal terlebih dahulu (Local-First)
      try {
        localStorage.setItem(LOCAL_SNAPSHOT_KEY, serialized);
      } catch {}

      backupCfg.lastLocalBackupAt = nowIso;
      backupCfg.lastBackupSizeBytes = sizeBytes;

      if (isCloudSession() && navigator.onLine) {
        const res = await callGas("backupNow", { reason });
        if (res.ok) {
          backupCfg.lastCloudBackupAt = res.data?.backedUpAt || nowIso;
          backupCfg.lastBackupFileName = res.data?.fileName || "labkom_backup.json";
          backupCfg.lastBackupSizeBytes = res.data?.sizeBytes || sizeBytes;
          backupCfg.backupCount = (backupCfg.backupCount || 0) + 1;
          updateSyncIndicator("synced");
          if (!silent) showToast("Cadangan berhasil disimpan ke Google Drive!", "success");
        } else {
          updateSyncIndicator(res.isNetworkError ? "offline" : "pending");
          if (!silent) showToast(res.error || "Cadangan lokal tersimpan, tetapi gagal unggah ke Drive.", "error");
        }
      } else {
        backupCfg.backupCount = (backupCfg.backupCount || 0) + 1;
        backupCfg.lastBackupFileName = "labkom_local_snapshot.json";
        if (!silent) {
          showToast(
            isCloudConfigured()
              ? "Offline: cadangan tersimpan di perangkat, menunggu jaringan ke Google Drive."
              : "Snapshot lokal berhasil dicadangkan!",
            "success"
          );
        }
      }

      persistBackupCfg();
      ui.isBackingUp = false;
      ui.backupProgressText = "";
      if (ui.activeTab === "profil") render();
      else renderSyncDotOnly();
    }

    async function performRestoreFromDrive() {
      if (isCloudSession()) {
        if (!navigator.onLine) {
          showToast("Tidak dapat memulihkan dari Google Drive saat offline.", "error");
          return;
        }
        showToast("Mengambil cadangan terbaru dari Google Drive...", "info");
        const res = await callGas("restoreBackup", { restoreSnapshot: true });
        if (res.ok && res.data) {
          const stateData = res.data.state || res.data;
          mergeCloudState(stateData);
          showToast("Data berhasil dipulihkan dari Google Drive!", "success");
          render();
          return;
        }
        showToast(res.error || "Gagal memulihkan cadangan dari Google Drive.", "error");
        return;
      }

      // Mode Lokal: pulihkan dari snapshot lokal terakhir
      try {
        const raw = localStorage.getItem(LOCAL_SNAPSHOT_KEY);
        if (!raw) {
          showToast("Belum ada snapshot lokal. Tekan 'Cadangkan Sekarang' terlebih dahulu.", "info");
          return;
        }
        const parsed = JSON.parse(raw);
        if (parsed && parsed.state) {
          db = parsed.state;
          persistState(false);
          showToast("Data lokal berhasil dipulihkan dari snapshot terakhir!", "success");
          render();
        }
      } catch {
        showToast("Snapshot cadangan lokal rusak atau tidak terbaca.", "error");
      }
    }

    // ========================================================================
    // 7. HELPER OTORISASI, FORMAT & KEAMANAN
    // ========================================================================
    function sanitizeUserObj(u) {
      if (!u) return null;
      return {
        id: u.id,
        username: u.username,
        full_name: u.full_name,
        role: u.role,
        is_asisten: Boolean(u.is_asisten),
        created_at: u.created_at
      };
    }

    function currentUser() {
      if (!session || !session.user) return null;
      if (session.mode === "local") {
        const latest = db.users.find((u) => u.id === session.user.id);
        if (latest) return latest;
      }
      return session.user;
    }

    function isAdmin(u = currentUser()) {
      return Boolean(u && u.role === "admin");
    }

    function isDualRoleAdmin(u = currentUser()) {
      return Boolean(u && u.role === "admin" && u.is_asisten === true);
    }

    function canTeach(u = currentUser()) {
      return Boolean(u && (u.role === "asisten" || (u.role === "admin" && u.is_asisten === true)));
    }

    function getTaughtClasses(userId) {
      const ids = db.class_assistants.filter((ca) => ca.assistant_id === userId).map((ca) => ca.class_id);
      return db.classes.filter((c) => ids.includes(c.id));
    }

    function getEnrolledClasses(userId) {
      const ids = db.enrollments.filter((en) => en.student_id === userId).map((en) => en.class_id);
      return db.classes.filter((c) => ids.includes(c.id));
    }

    function getUserClassLabel(u) {
      if (!u) return "-";
      if (u.role === "praktikan") {
        const list = getEnrolledClasses(u.id).map((c) => c.name);
        return list.length ? list.join(", ") : "Belum ada kelas";
      }
      const taught = getTaughtClasses(u.id).map((c) => c.name);
      if (taught.length) return "Pengampu " + taught.join(", ");
      return u.role === "admin" ? "Administrator Lab" : "Belum ditugaskan";
    }

    function getRoleLabel(u) {
      if (!u) return "";
      if (u.role === "admin") return u.is_asisten ? "Admin + Asisten" : "Admin";
      if (u.role === "asisten") return "Asisten";
      return "Praktikan";
    }

    function uid(prefix) {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDate(isoStr, withTime = false) {
      if (!isoStr) return "-";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return "-";
      return withTime
        ? d.toLocaleString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
        : d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
    }

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return "0 KB";
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function validateFile(file) {
      if (!file) return "Pilih file terlebih dahulu.";
      if (file.size > MAX_FILE_SIZE) {
        return `Ukuran file terlalu besar (${(file.size / 1024 / 1024).toFixed(2)} MB). Maksimal 5 MB.`;
      }
      const lower = file.name.toLowerCase();
      if (!ALLOWED_EXT.some((ext) => lower.endsWith(ext))) {
        return `Format file tidak diizinkan. Gunakan: ${ALLOWED_EXT.join(", ")}`;
      }
      return null;
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          const idx = result.indexOf(",");
          resolve(idx >= 0 ? result.slice(idx + 1) : result);
        };
        reader.onerror = () => reject(new Error("Gagal membaca file dari perangkat."));
        reader.readAsDataURL(file);
      });
    }

    function base64ToBlob(base64, mime = "application/octet-stream") {
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    function triggerBlobDownload(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName || "dokumen_labkom.bin";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    async function handleFileDownload({ fileId, kind, fileName, fallbackContent, localBase64, localMime }) {
      // Cloud mode -> unduh via GAS downloadFile
      if (isCloudSession() && fileId && !String(fileId).startsWith("local-")) {
        showToast(`Mengunduh ${fileName || "berkas"} dari Google Drive...`, "info");
        const res = await callGas("downloadFile", { file_id: fileId, kind });
        if (res.ok && res.data) {
          if (res.data.file_base64) {
            const blob = base64ToBlob(res.data.file_base64, res.data.file_mime || "application/octet-stream");
            triggerBlobDownload(blob, res.data.file_name || fileName);
            showToast(`Berhasil mengunduh ${res.data.file_name || fileName}`, "success");
            return;
          }
          if (res.data.downloadUrl) {
            window.open(res.data.downloadUrl, "_blank");
            return;
          }
        }
        showToast(res.error || "Gagal mengunduh file dari Google Drive.", "error");
        return;
      }

      // Local mode -> cek runtimeBlobStore, lalu localBase64, lalu teks demo
      let blob = runtimeBlobStore.get(fileId);
      if (!blob && localBase64) {
        try {
          blob = base64ToBlob(localBase64, localMime || "application/octet-stream");
        } catch {}
      }
      if (!blob) {
        blob = new Blob([fallbackContent || `Dokumen Laboratorium Komputer: ${fileName}`], {
          type: "text/plain;charset=utf-8"
        });
      }
      triggerBlobDownload(blob, fileName || "dokumen_labkom.txt");
      showToast(`Mengunduh ${fileName}...`, "success");
    }

    function copyTextSafe(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
      } catch {
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
      }
      document.body.removeChild(ta);
    }

    // ========================================================================
    // 9. CLIENT-SIDE EXPORT ENGINE (.XLSX, .DOCX, .PDF)
    // ========================================================================
    function buildGradeMatrix(classId) {
      const cls = db.classes.find((c) => c.id === classId);
      const enrolledIds = db.enrollments.filter((e) => e.class_id === classId).map((e) => e.student_id);
      const students = db.users
        .filter((u) => enrolledIds.includes(u.id))
        .sort((a, b) => a.username.localeCompare(b.username));
      const assignments = db.assignments
        .filter((a) => a.class_id === classId)
        .sort((a, b) => new Date(a.release_at) - new Date(b.release_at));

      const rows = students.map((st, idx) => {
        const scores = {};
        const valid = [];
        assignments.forEach((asg) => {
          const g = db.grades.find(
            (gr) => gr.class_id === classId && gr.student_id === st.id && gr.assignment_id === asg.id
          );
          if (g !== undefined) {
            scores[asg.id] = Number(g.score);
            valid.push(Number(g.score));
          } else {
            scores[asg.id] = null;
          }
        });
        const avg = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
        return {
          no: idx + 1,
          nim: st.username,
          fullName: st.full_name,
          scores,
          average: avg
        };
      });

      return {
        className: cls ? cls.name : "Kelas",
        courseName: cls ? cls.course_name : "",
        assignments,
        rows
      };
    }

    function exportExcel(matrix) {
      try {
        if (typeof XLSX === "undefined") {
          showToast("Library Excel (SheetJS) belum termuat.", "error");
          return;
        }
        const headers = ["No", "NIM / ID", "Nama Praktikan", ...matrix.assignments.map((a) => a.title), "Rata-rata"];
        const body = matrix.rows.map((r) => [
          r.no,
          r.nim,
          r.fullName,
          ...matrix.assignments.map((a) => (r.scores[a.id] !== null ? r.scores[a.id] : "-")),
          r.average !== null ? Number(r.average.toFixed(1)) : "-"
        ]);
        const ws = XLSX.utils.aoa_to_sheet([
          ["REKAPITULASI NILAI LABORATORIUM KOMPUTER (LABKOM)"],
          [`Kelas: ${matrix.className} (${matrix.courseName})`, "", `Jumlah Praktikan: ${matrix.rows.length}`],
          [],
          headers,
          ...body
        ]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rekap Nilai");
        const slug = matrix.className.toLowerCase().replace(/[^a-z0-9]+/g, "_");
        XLSX.writeFile(wb, `Rekap_Nilai_${slug}.xlsx`);
        showToast("Laporan Excel (.xlsx) berhasil diunduh!", "success");
      } catch (err) {
        showToast("Gagal mengekspor Excel: " + err.message, "error");

    async function exportWord(matrix) {
      const slug = matrix.className.toLowerCase().replace(/[^a-z0-9]+/g, "_");
      const headers = ["No", "NIM / ID", "Nama Praktikan", ...matrix.assignments.map((a) => a.title), "Rata-rata"];
      const body = matrix.rows.map((r) => [
        String(r.no),
        r.nim,
        r.fullName,
        ...matrix.assignments.map((a) => (r.scores[a.id] !== null ? String(r.scores[a.id]) : "-")),
        r.average !== null ? r.average.toFixed(1) : "-"
      ]);

      try {
        if (window.docx && window.docx.Document && window.docx.Packer) {
          const { Document, Packer, Paragraph, Table, TableCell, TableRow, TextRun, WidthType, AlignmentType } = window.docx;
          const headerRow = new TableRow({
            tableHeader: true,
            children: headers.map(
              (h) =>
                new TableCell({
                  shading: { fill: "0F172A" },
                  children: [
                    new Paragraph({
                      alignment: AlignmentType.CENTER,
                      children: [new TextRun({ text: h, bold: true, color: "FFFFFF", size: 18 })]
                    })
                  ]
                })
            )
          });
          const dataRows = body.map(
            (row) =>
              new TableRow({
                children: row.map(
                  (val, idx) =>
                    new TableCell({
                      children: [
                        new Paragraph({
                          alignment: idx === 2 ? AlignmentType.LEFT : AlignmentType.CENTER,
                          children: [new TextRun({ text: val, size: 18 })]
                        })
                      ]
                    })
                )
              })
          );
          const doc = new Document({
            sections: [
              {
                children: [
                  new Paragraph({
                    alignment: AlignmentType.CENTER,
                    children: [new TextRun({ text: "LAPORAN REKAPITULASI NILAI PRAKTIKUM", bold: true, size: 28 })]
                  }),
                  new Paragraph({
                    alignment: AlignmentType.CENTER,
                    spacing: { after: 260 },
                    children: [
                      new TextRun({
                        text: `Laboratorium Komputer • Kelas: ${matrix.className} (${matrix.courseName}) • Total: ${matrix.rows.length} Praktikan`,
                        size: 20,
                        color: "475569"
                      })
                    ]
                  }),
                  new Table({
                    width: { size: 100, type: WidthType.PERCENTAGE },
                    rows: [headerRow, ...dataRows]
                  })
                ]
              }
            ]
          });
          const blob = await Packer.toBlob(doc);
          triggerBlobDownload(blob, `Rekap_Nilai_${slug}.docx`);
          showToast("Laporan Word (.docx) berhasil diunduh!", "success");
          return;
        }
      } catch {}

      // Fallback Word-compatible document
      const htmlDoc = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>Rekap Nilai Labkom</title>
        <style>body{font-family:Calibri,Arial,sans-serif;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #334155;padding:6px;font-size:11pt;}th{background:#0f172a;color:#fff;}</style>
        </head><body>
        <h2 style="text-align:center;">LAPORAN REKAPITULASI NILAI LABORATORIUM KOMPUTER</h2>
        <p style="text-align:center;">Kelas: ${esc(matrix.className)} (${esc(matrix.courseName)}) | Total Praktikan: ${matrix.rows.length}</p>
        <table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
        </body></html>`;
      const blob = new Blob(["\ufeff", htmlDoc], { type: "application/msword" });
      triggerBlobDownload(blob, `Rekap_Nilai_${slug}.docx`);
      showToast("Laporan Word (.docx) berhasil diunduh!", "success");
    }

    function exportPdf(matrix) {
      try {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          showToast("Library PDF (jsPDF) belum termuat.", "error");
          return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
        const headers = ["No", "NIM / ID", "Nama Praktikan", ...matrix.assignments.map((a) => a.title), "Rata-rata"];
        const body = matrix.rows.map((r) => [
          String(r.no),
          r.nim,
          r.fullName,
          ...matrix.assignments.map((a) => (r.scores[a.id] !== null ? String(r.scores[a.id]) : "-")),
          r.average !== null ? r.average.toFixed(1) : "-"
        ]);

        doc.setFontSize(14);
        doc.text("REKAPITULASI NILAI LABORATORIUM KOMPUTER (LABKOM)", 14, 15);
        doc.setFontSize(10);
        doc.setTextColor(71, 85, 105);
        doc.text(
          `Kelas: ${matrix.className} — ${matrix.courseName}   |   Jumlah Praktikan: ${matrix.rows.length}   |   Dicetak: ${new Date().toLocaleDateString("id-ID")}`,
          14,
          22
        );

        doc.autoTable({
          startY: 28,
          head: [headers],
          body,
          theme: "grid",
          headStyles: { fillColor: [15, 23, 42], textColor: 255, fontSize: 9 },
          styles: { fontSize: 8.5, cellPadding: 2.5 }
        });

        const slug = matrix.className.toLowerCase().replace(/[^a-z0-9]+/g, "_");
        doc.save(`Rekap_Nilai_${slug}.pdf`);
        showToast("Laporan PDF (.pdf) berhasil diunduh!", "success");
      } catch (err) {
        showToast("Gagal mengekspor PDF: " + err.message, "error");
      }
    }

    function bindLoginEvents() {
      const form = document.getElementById("auth-form");
      const errBox = document.getElementById("auth-error");
      const showAuthError = (msg) => {
        errBox.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i><span>${esc(msg)}</span>`;
        errBox.classList.remove("hidden");
        lucide.createIcons();
      };

      document.getElementById("btn-toggle-pass")?.addEventListener("click", () => {
        ui.showPassword = !ui.showPassword;
        const inp = document.getElementById("inp-password");
        if (inp) inp.type = ui.showPassword ? "text" : "password";
        const btn = document.getElementById("btn-toggle-pass");
        if (btn) {
          btn.innerHTML = `<i data-lucide="${ui.showPassword ? "eye-off" : "eye"}" class="w-4 h-4"></i>`;
          lucide.createIcons();
        }
      });

      document.getElementById("btn-switch-auth-mode")?.addEventListener("click", () => {
        ui.loginMode = ui.loginMode === "login" ? "register" : "login";
        render();
      });

      document.getElementById("btn-forgot-pass")?.addEventListener("click", () => {
        openModal(
          "Bantuan Lupa Password",
          `<div class="space-y-3 text-xs text-slate-600 leading-relaxed">
            <p>Untuk menjaga keamanan data praktikum, reset password hanya dapat dilakukan oleh <strong>Admin Laboratorium Komputer</strong>.</p>
            <p>Hubungi Koordinator Labkom atau Asisten pengampu kelas Anda dengan menyertakan <strong>NIM/ID</strong> dan <strong>Nama Lengkap</strong>.</p>
            <div class="p-3 rounded-xl bg-blue-50 border border-blue-100 text-blue-800">
              <strong>Mode Demo Lokal:</strong> Seluruh akun demo menggunakan password <code class="font-bold">123456</code>.
            </div>
            <button type="button" data-close-modal class="w-full py-2.5 bg-slate-900 text-white rounded-xl font-semibold">Mengerti</button>
          </div>`
        );
      });

      document.getElementById("btn-toggle-gas-panel")?.addEventListener("click", () => {
        ui.showGasConfigOnLogin = !ui.showGasConfigOnLogin;
        render();
      });

      document.getElementById("btn-login-test-gas")?.addEventListener("click", async () => {
        const inp = document.getElementById("inp-login-gas-url");
        const statusEl = document.getElementById("login-gas-status");
        const url = (inp?.value || "").trim();
        if (!/^https?:\/\//i.test(url)) {
          statusEl.className = "text-[11px] rounded-lg px-2.5 py-1.5 bg-rose-500/20 text-rose-200";
          statusEl.textContent = "Masukkan URL Google Apps Script yang valid (diawali https://).";
          statusEl.classList.remove("hidden");
          return;
        }
        statusEl.className = "text-[11px] rounded-lg px-2.5 py-1.5 bg-blue-500/20 text-blue-200";
        statusEl.textContent = "Menguji koneksi ke Google Apps Script...";
        statusEl.classList.remove("hidden");

        const res = await callGas("ping", {}, url);
        if (res.ok) {
          persistGasUrl(url);
          showToast("Terhubung ke server Google Drive (Apps Script)!", "success");
          render();
        } else {
          statusEl.className = "text-[11px] rounded-lg px-2.5 py-1.5 bg-rose-500/20 text-rose-200";
          statusEl.textContent = res.error || "Gagal terhubung ke Apps Script.";
        }
      });

      document.getElementById("btn-login-clear-gas")?.addEventListener("click", () => {
        persistGasUrl("");
        showToast("Koneksi Apps Script diputus. Beralih ke Mode Lokal.", "info");
        render();
      });

      document.querySelectorAll("[data-demo-user]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.getElementById("inp-username").value = btn.getAttribute("data-demo-user");
          document.getElementById("inp-password").value = "123456";
          form.dispatchEvent(new Event("submit", { cancelable: true }));
        });
      });

      document.getElementById("btn-reset-demo-login")?.addEventListener("click", confirmResetLocalData);

      form?.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (ui.isSubmittingAuth) return; // Anti klik ganda
        errBox.classList.add("hidden");

        const cleanUser = document.getElementById("inp-username").value.trim().toLowerCase().replace(/\s+/g, "");
        const password = document.getElementById("inp-password").value;
        const fullName = ui.loginMode === "register" ? document.getElementById("inp-fullname").value.trim() : "";

        if (cleanUser.length < 3) {
          showAuthError("ID/Username (NIM) minimal 3 karakter tanpa spasi.");
          return;
        }
        if (password.length < 6) {
          showAuthError("Password minimal harus terdiri dari 6 karakter.");
          return;
        }
        if (ui.loginMode === "register" && fullName.length < 2) {
          showAuthError("Nama lengkap wajib diisi.");
          return;
        }

        ui.isSubmittingAuth = true;
        const btn = document.getElementById("btn-auth-submit");
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Memproses...</span>`;
        lucide.createIcons();

        const resetBtn = () => {
          ui.isSubmittingAuth = false;
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<span>${ui.loginMode === "register" ? "Daftar Sebagai Praktikan" : "Login"}</span>`;
          }
        };

        // --- CLOUD MODE (Google Apps Script) ---
        if (isCloudConfigured()) {
          const action = ui.loginMode === "register" ? "register" : "login";
          const payload =
            action === "register"
              ? { username: cleanUser, full_name: fullName, password }
              : { username: cleanUser, password };

          const res = await callGas(action, payload);
          if (!res.ok) {
            resetBtn();
            showAuthError(res.error || "ID/Username atau Password salah.");
            return;
          }

          persistSession({
            token: res.data.token || "",
            user: sanitizeUserObj(res.data.user),
            mode: "cloud"
          });
          if (res.data.state) mergeCloudState(res.data.state);
          ui.isSubmittingAuth = false;
          ui.activeTab = "artikel";
          ui.articleDetailId = null;
          ui.loginMode = "login";
          updateSyncIndicator("synced");
          showToast(`Selamat datang, ${session.user.full_name}!`, "success");
          render();
          syncFromCloud(true);
          return;
        }

        // --- LOCAL DEMO MODE ---
        setTimeout(() => {
          if (ui.loginMode === "register") {
            if (db.users.some((u) => u.username === cleanUser)) {
              resetBtn();
              showAuthError("ID/Username tersebut sudah terdaftar. Silakan langsung Login.");
              return;
            }
            const newUser = {
              id: uid("u"),
              username: cleanUser,
              password,
              full_name: fullName,
              role: "praktikan", // Terkunci mutlak ke praktikan
              is_asisten: false,
              created_at: new Date().toISOString()
            };
            db.users.push(newUser);
            if (db.classes[0]) {
              db.enrollments.push({ id: uid("en"), class_id: db.classes[0].id, student_id: newUser.id });
            }
            persistState(true);
            persistSession({ token: "local-" + newUser.id, user: sanitizeUserObj(newUser), mode: "local" });
            ui.isSubmittingAuth = false;
            ui.activeTab = "artikel";
            ui.loginMode = "login";
            showToast(`Pendaftaran berhasil! Selamat datang, ${newUser.full_name}.`, "success");
            render();
            return;
          }

          const found = db.users.find((u) => u.username === cleanUser && u.password === password);
          if (!found) {
            resetBtn();
            showAuthError("ID/Username atau Password salah. Periksa kembali penulisan NIM/ID Anda.");
            return;
          }

          persistSession({ token: "local-" + found.id, user: sanitizeUserObj(found), mode: "local" });
          ui.isSubmittingAuth = false;
          ui.activeTab = "artikel";
          ui.articleDetailId = null;
          ui.selectedKelasId = "";
          ui.selectedNilaiClassId = "";
          showToast(`Masuk sebagai ${found.full_name} (${getRoleLabel(found)})`, "success");
          render();
        }, 280);
      });
    }

    function renderActiveView(user) {
      if (!user && ui.activeTab === "profil") return renderProfilView(null);
      switch (ui.activeTab) {
        case "artikel":
          return ui.articleDetailId ? renderArtikelDetailView(user) : renderArtikelListView(user);
        case "pengumuman":
          return renderPengumumanView(user);
        case "tugas":
          return renderTugasView(user);
        case "kelas":
          return renderKelasView(user);
        case "nilai":
          return renderNilaiView(user);
        case "asisten":
          return renderAsistenView(user);
        case "profil":
          return renderProfilView(user);
        default:
          return renderArtikelListView(user);
      }
    }

    // --- VIEW 4: TUGAS (GOOGLE CLASSROOM STYLE) ---
    function renderTugasView(user) {
      const now = new Date();
      const enrolledIds = getEnrolledClasses(user.id).map((c) => c.id);
      const taughtIds = getTaughtClasses(user.id).map((c) => c.id);

      const visibleAssignments = db.assignments
        .filter((asg) => {
          if (isAdmin(user)) return true;
          if (user.role === "asisten") return taughtIds.includes(asg.class_id);
          // Praktikan: hanya tugas kelasnya & waktu rilis sudah tiba
          return enrolledIds.includes(asg.class_id) && new Date(asg.release_at) <= now;
        })
        .sort((a, b) => new Date(b.release_at) - new Date(a.release_at));

      return visibleAssignments.length === 0
        ? `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
            Belum ada tugas yang dirilis untuk kelas Anda.
           </div>`
        : `<div class="space-y-3.5">
            ${visibleAssignments
              .map((asg) => {
                const cls = db.classes.find((c) => c.id === asg.class_id);
                const isFuture = new Date(asg.release_at) > now;
                const mySub =
                  user.role === "praktikan"
                    ? db.submissions.find((s) => s.assignment_id === asg.id && s.student_id === user.id)
                    : null;
                const totalSubs = db.submissions.filter((s) => s.assignment_id === asg.id).length;

                return `
                  <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div class="flex items-start gap-3">
                      <div class="w-10 h-10 rounded-xl bg-blue-600/10 text-blue-600 flex items-center justify-center shrink-0">
                        <i data-lucide="clipboard-list" class="w-5 h-5"></i>
                      </div>
                      <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-1.5">
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700">${esc(cls ? cls.name : "-")}</span>
                          ${
                            isFuture
                              ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 flex items-center gap-1">
                                  <i data-lucide="calendar-clock" class="w-3 h-3"></i> Terjadwal
                                 </span>`
                              : ""
                          }
                          ${
                            user.role === "praktikan"
                              ? mySub
                                ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 flex items-center gap-1">
                                    <i data-lucide="check-circle-2" class="w-3 h-3"></i> Sudah Dikumpulkan
                                   </span>`
                                : `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 flex items-center gap-1">
                                    <i data-lucide="clock" class="w-3 h-3"></i> Belum Dikumpulkan
                                   </span>`
                              : `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700">${totalSubs} Terkumpul</span>`
                          }
                        </div>

                        <h3 class="font-bold text-sm text-slate-900 mt-1.5">${esc(asg.title)}</h3>
                        <p class="text-xs text-slate-600 mt-1 whitespace-pre-line leading-relaxed">${esc(asg.description)}</p>

                        <div class="mt-2.5 text-[11px] text-slate-500 space-y-0.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                          <div class="flex items-center gap-1.5">
                            <i data-lucide="calendar" class="w-3 h-3 text-slate-400"></i>
                            <span>Rilis: <strong>${formatDate(asg.release_at, true)}</strong></span>
                          </div>
                          ${
                            asg.due_at
                              ? `<div class="flex items-center gap-1.5 text-rose-600">
                                  <i data-lucide="alarm-clock" class="w-3 h-3"></i>
                                  <span>Tenggat: <strong>${formatDate(asg.due_at, true)}</strong></span>
                                 </div>`
                              : ""
                          }
                        </div>

                        <div class="mt-3 flex flex-wrap gap-2">
                          ${
                            asg.file_name
                              ? `<button type="button" data-dl-material="${asg.id}" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold">
                                  <i data-lucide="download" class="w-3.5 h-3.5"></i> Download Soal
                                 </button>`
                              : ""
                          }
                          ${
                            user.role === "praktikan"
                              ? `<label class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold cursor-pointer">
                                  <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                                  <span>${mySub ? "Ganti File Tugas" : "Upload Tugas"}</span>
                                  <input type="file" data-upload-sub="${asg.id}" accept="${ALLOWED_EXT.join(",")}" class="hidden" />
                                 </label>`
                              : ""
                          }
                        </div>

                        ${
                          mySub
                            ? `<div class="mt-2.5 p-2 rounded-lg bg-emerald-50 border border-emerald-100 text-[11px] text-emerald-800 flex items-center justify-between gap-2">
                                <span class="truncate"><strong>Terkirim:</strong> ${esc(mySub.file_name)} (${formatBytes(mySub.file_size)})</span>
                                <button type="button" data-dl-sub="${mySub.id}" class="text-emerald-700 font-bold underline shrink-0">Unduh</button>
                               </div>`
                            : ""
                        }
                      </div>
                    </div>
                  </div>
                `;
              })
              .join("")}
          </div>`;
    }

    // --- VIEW 5: KELAS (ASISTEN & DUAL-ROLE ADMIN) ---
    function renderKelasView(user) {
      const taught = getTaughtClasses(user.id);
      if (taught.length === 0) {
        return `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
          Anda belum ditugaskan mengampu kelas mana pun. Atur pembagian kelas di menu <strong>Asisten</strong>.
        </div>`;
      }

      if (!ui.selectedKelasId || !taught.some((c) => c.id === ui.selectedKelasId)) {
        ui.selectedKelasId = taught[0].id;
      }

      const activeClass = taught.find((c) => c.id === ui.selectedKelasId);
      const studentIds = db.enrollments.filter((e) => e.class_id === activeClass.id).map((e) => e.student_id);
      const students = db.users
        .filter((u) => studentIds.includes(u.id))
        .sort((a, b) => a.username.localeCompare(b.username));
      const classAsgIds = db.assignments.filter((a) => a.class_id === activeClass.id).map((a) => a.id);

      return `
        ${
          isDualRoleAdmin(user)
            ? `<div class="mb-3 flex items-center justify-between bg-indigo-50 border border-indigo-200 rounded-xl px-3.5 py-2.5 text-xs text-indigo-800">
                <span class="font-semibold">Mode Dual-Role Admin + Asisten</span>
                <button type="button" data-nav="nilai" class="font-bold underline">Ke Rekap Nilai</button>
               </div>`
            : ""
        }

        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Kelas yang Diampu</label>
        <select id="sel-kelas-asisten" class="w-full mb-4 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
          ${taught
            .map(
              (c) => `<option value="${c.id}" ${c.id === activeClass.id ? "selected" : ""}>${esc(c.name)} — ${esc(c.course_name)}</option>`
            )
            .join("")}
        </select>

        <div class="flex items-center justify-between mb-2.5 text-xs text-slate-600">
          <span>Daftar Praktikan: <strong>${students.length} orang</strong></span>
          <span class="text-[11px] text-slate-400">Ketuk nama untuk menilai</span>
        </div>

        ${
          students.length === 0
            ? `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
                Belum ada praktikan di kelas ini. Klik <strong>+ Praktikan</strong> di pojok kanan atas.
               </div>`
            : `<div class="space-y-2.5">
                ${students
                  .map((st) => {
                    const subCount = db.submissions.filter(
                      (s) => s.student_id === st.id && classAsgIds.includes(s.assignment_id)
                    ).length;
                    const gradedCount = db.grades.filter(
                      (g) => g.student_id === st.id && g.class_id === activeClass.id
                    ).length;
                    return `
                      <div class="bg-white rounded-2xl border border-slate-200 px-3.5 py-3 flex items-center justify-between gap-2 shadow-sm hover:border-blue-300 transition">
                        <button type="button" data-open-student="${st.id}" class="flex-1 flex items-center gap-3 text-left min-w-0">
                          <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 font-bold text-sm flex items-center justify-center shrink-0">
                            ${esc(st.full_name.charAt(0).toUpperCase())}
                          </div>
                          <div class="min-w-0 flex-1">
                            <div class="font-bold text-sm text-slate-900 truncate">${esc(st.full_name)}</div>
                            <div class="text-[11px] text-slate-500 flex items-center gap-1.5 mt-0.5">
                              <span class="font-mono">NIM: ${esc(st.username)}</span>
                              <span>•</span>
                              <span class="text-blue-600 font-medium">${subCount} tugas (${gradedCount} dinilai)</span>
                            </div>
                          </div>
                          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 shrink-0"></i>
                        </button>
                        <button type="button" data-remove-student="${st.id}" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl shrink-0" aria-label="Hapus praktikan">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </div>
                    `;
                  })
                  .join("")}
              </div>`
        }
      `;
    }

    // --- VIEW 6: NILAI (REKAP REAL-TIME + EXPORT + DUAL-ROLE BUTTON) ---
    function renderNilaiView(user) {
      const availableClasses = isAdmin(user) ? db.classes : getTaughtClasses(user.id);
      if (availableClasses.length === 0) {
        return `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
          Belum ada kelas yang tersedia untuk rekapitulasi nilai.
        </div>`;
      }

      if (!ui.selectedNilaiClassId || !availableClasses.some((c) => c.id === ui.selectedNilaiClassId)) {
        ui.selectedNilaiClassId = availableClasses[0].id;
      }

      const matrix = buildGradeMatrix(ui.selectedNilaiClassId);
      const dualAdmin = isDualRoleAdmin(user);

      return `
        ${
          dualAdmin
            ? `<button type="button" id="btn-dualrole-kelas" class="mb-3.5 w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white text-xs font-bold flex items-center justify-center gap-2 shadow-md shadow-indigo-600/20 transition">
                <i data-lucide="users" class="w-4 h-4"></i>
                <span>Mode Asisten: Kelola Praktikan & Input Nilai Kelas Saya</span>
               </button>`
            : ""
        }

        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Filter Kelas</label>
        <select id="sel-kelas-nilai" class="w-full mb-3.5 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
          ${availableClasses
            .map(
              (c) => `<option value="${c.id}" ${c.id === ui.selectedNilaiClassId ? "selected" : ""}>${esc(c.name)} — ${esc(c.course_name)}</option>`
            )
            .join("")}
        </select>

        <!-- 3 Tombol Export Client-Side -->
        <div class="grid grid-cols-3 gap-2 mb-4">
          <button type="button" id="btn-export-xlsx" class="py-2.5 px-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel
          </button>
          <button type="button" id="btn-export-docx" class="py-2.5 px-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
            <i data-lucide="file-text" class="w-4 h-4"></i> Word
          </button>
          <button type="button" id="btn-export-pdf" class="py-2.5 px-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
            <i data-lucide="file-down" class="w-4 h-4"></i> PDF
          </button>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600">
            <span>Kelas: <strong class="text-slate-900">${esc(matrix.className)}</strong></span>
            <span class="px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-bold text-[11px]">${matrix.rows.length} Praktikan</span>
          </div>

          ${
            matrix.rows.length === 0
              ? `<div class="p-8 text-center text-xs text-slate-500">Belum ada praktikan terdaftar pada kelas ini.</div>`
              : `<div class="overflow-x-auto app-scroll">
                  <table class="w-full text-xs text-left">
                    <thead class="bg-slate-900 text-white">
                      <tr>
                        <th class="px-3 py-2.5 font-semibold">No</th>
                        <th class="px-3 py-2.5 font-semibold">NIM</th>
                        <th class="px-3 py-2.5 font-semibold">Nama Praktikan</th>
                        ${matrix.assignments
                          .map((a, i) => `<th class="px-3 py-2.5 font-semibold text-center whitespace-nowrap" title="${esc(a.title)}">T${i + 1}</th>`)
                          .join("")}
                        <th class="px-3 py-2.5 font-semibold text-center">Rata²</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${matrix.rows
                        .map(
                          (r) => `
                            <tr class="hover:bg-slate-50">
                              <td class="px-3 py-2.5 text-slate-500">${r.no}</td>
                              <td class="px-3 py-2.5 font-mono text-slate-700">${esc(r.nim)}</td>
                              <td class="px-3 py-2.5 font-semibold text-slate-900 whitespace-nowrap">${esc(r.fullName)}</td>
                              ${matrix.assignments
                                .map(
                                  (a) => `<td class="px-3 py-2.5 text-center ${r.scores[a.id] !== null ? "font-semibold text-slate-800" : "text-slate-400"}">
                                    ${r.scores[a.id] !== null ? r.scores[a.id] : "-"}
                                  </td>`
                                )
                                .join("")}
                              <td class="px-3 py-2.5 text-center font-extrabold text-blue-700">
                                ${r.average !== null ? r.average.toFixed(1) : "-"}
                              </td>
                            </tr>
                          `
                        )
                        .join("")}
                    </tbody>
                  </table>
                </div>`
          }

          ${
            matrix.assignments.length > 0
              ? `<div class="px-4 py-2.5 bg-slate-50 border-t border-slate-100 text-[10px] text-slate-500 space-y-0.5">
                  <div class="font-bold text-slate-600 mb-1">Keterangan Kolom Tugas:</div>
                  ${matrix.assignments.map((a, i) => `<div><strong>T${i + 1}:</strong> ${esc(a.title)}</div>`).join("")}
                 </div>`
              : ""
          }
        </div>
      `;
    }

    // --- VIEW 7: ASISTEN (ADMIN ONLY) ---
    function renderAsistenView(user) {
      const staff = db.users
        .filter((u) => u.role === "admin" || u.role === "asisten")
        .sort((a, b) => (a.role === b.role ? a.full_name.localeCompare(b.full_name) : a.role === "admin" ? -1 : 1));

      return `
        <div class="space-y-3.5">
          ${staff
            .map((p) => {
              const assignedIds = db.class_assistants
                .filter((ca) => ca.assistant_id === p.id)
                .map((ca) => ca.class_id);
              const canAssign = p.role === "asisten" || (p.role === "admin" && p.is_asisten);

              return `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <div class="flex flex-wrap items-center gap-1.5">
                        <h3 class="font-bold text-sm text-slate-900">${esc(p.full_name)}</h3>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                          p.role === "admin" ? "bg-indigo-100 text-indigo-700" : "bg-blue-100 text-blue-700"
                        }">${esc(getRoleLabel(p))}</span>
                        ${p.id === user.id ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">Anda</span>` : ""}
                      </div>
                      <p class="text-xs text-slate-500 font-mono mt-0.5">ID: ${esc(p.username)}</p>
                    </div>
                    ${
                      p.role === "asisten"
                        ? `<button type="button" data-del-assistant="${p.id}" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg" aria-label="Hapus asisten">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                           </button>`
                        : ""
                    }
                  </div>

                  ${
                    p.role === "admin"
                      ? `<label class="mt-3 flex items-center gap-2.5 text-xs text-slate-700 bg-slate-50 border border-slate-200/80 p-2.5 rounded-xl cursor-pointer select-none">
                          <input type="checkbox" data-toggle-dual="${p.id}" ${p.is_asisten ? "checked" : ""} class="w-4 h-4 rounded accent-indigo-600" />
                          <i data-lucide="shield" class="w-3.5 h-3.5 text-indigo-600 shrink-0"></i>
                          <span class="font-medium">Aktifkan Dual-Role (Admin merangkap Asisten)</span>
                         </label>`
                      : ""
                  }

                  ${
                    canAssign
                      ? `<div class="mt-3 pt-3 border-t border-slate-100">
                          <p class="text-[11px] font-semibold text-slate-500 mb-2">Pembagian Kelas yang Diampu:</p>
                          <div class="flex flex-wrap gap-1.5">
                            ${db.classes
                              .map((c) => {
                                const active = assignedIds.includes(c.id);
                                return `
                                  <button type="button" data-toggle-class="${p.id}::${c.id}" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition flex items-center gap-1 ${
                                    active
                                      ? "bg-blue-600 text-white border-blue-600 shadow-sm"
                                      : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"
                                  }">
                                    <i data-lucide="${active ? "check" : "plus"}" class="w-3 h-3"></i>
                                    ${esc(c.name)}
                                  </button>
                                `;
                              })
                              .join("")}
                          </div>
                         </div>`
                      : `<p class="mt-2.5 text-[11px] text-slate-400 italic">Aktifkan Dual-Role di atas untuk menugaskan kelas ke akun Admin ini.</p>`
                  }
                </div>
              `;
            })
            .join("")}
        </div>
      `;
    }

              <h2 class="font-extrabold text-base text-slate-900 truncate">${esc(user.full_name)}</h2>

                user.role === "admin"
                  ? "bg-indigo-100 text-indigo-700"
                  : user.role === "asisten"
                  ? "bg-blue-100 text-blue-700"

            </div>
            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-100">
              <div class="text-[10px] text-slate-500">${user.role === "praktikan" ? "Kelas Terdaftar" : "Kelas Diampu"}</div>
              <div class="font-semibold text-slate-900 mt-0.5 truncate">${esc(classLabel)}</div>

        <!-- ================================================================ -->
        <section class="mt-4 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <!-- Header Emerald WhatsApp-Style -->
          <div class="px-4 py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-white/15 backdrop-blur-sm flex items-center justify-center shrink-0">

              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-500">Status Koneksi</span>
                <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold ${
