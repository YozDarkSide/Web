              </div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-500">Terakhir dicadangkan (Lokal)</span>
                <span class="font-semibold text-slate-800">${formatDate(backupCfg.lastLocalBackupAt, true)}</span>
              </div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-500">Terakhir dicadangkan (Drive)</span>
                <span class="font-semibold text-slate-800">${backupCfg.lastCloudBackupAt ? formatDate(backupCfg.lastCloudBackupAt, true) : "Belum dicadangkan"}</span>
              </div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-500">Ukuran cadangan</span>
                <span class="font-mono font-semibold text-slate-800">${formatBytes(backupCfg.lastBackupSizeBytes)}</span>
              </div>
            </div>

            <!-- Tombol Utama WhatsApp-Style: Cadangkan Sekarang -->
            <div>
              <button type="button" id="btn-backup-now" ${ui.isBackingUp ? "disabled" : ""} class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-65 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-md shadow-emerald-600/20 transition">
                <i data-lucide="${ui.isBackingUp ? "loader-2" : "cloud-upload"}" class="w-4 h-4 ${ui.isBackingUp ? "animate-spin" : ""}"></i>
                <span>${ui.isBackingUp ? (ui.backupProgressText || "Mencadangkan...") : "Cadangkan Sekarang"}</span>
              </button>
            </div>

            <!-- Pengaturan Frekuensi Cadangan Otomatis -->
            <div class="pt-3 border-t border-slate-100 space-y-3">
              <div>
                <label class="flex items-center gap-1.5 text-xs font-bold text-slate-800 mb-1.5">
                  <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-emerald-600"></i>
                  Frekuensi Cadangan Otomatis
                </label>
                <select id="sel-backup-freq" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-600">
                  <option value="realtime" ${backupCfg.frequency === "realtime" ? "selected" : ""}>Otomatis setiap ada perubahan (debounce 4 dtk)</option>
                  <option value="daily" ${backupCfg.frequency === "daily" ? "selected" : ""}>Harian</option>
                  <option value="weekly" ${backupCfg.frequency === "weekly" ? "selected" : ""}>Mingguan</option>
                  <option value="manual" ${backupCfg.frequency === "manual" ? "selected" : ""}>Hanya saat saya ketuk "Cadangkan"</option>
                </select>
              </div>

              <!-- Pengaturan Endpoint Google Apps Script -->
              <div class="flex items-center justify-between gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200/80">
                <div class="min-w-0">
                  <div class="text-xs font-bold text-slate-800">Endpoint Google Apps Script</div>
                  <div class="text-[11px] text-slate-500 truncate mt-0.5">
                    ${cloudConnected ? esc(gasUrl) : "Belum terhubung (berjalan di Mode Lokal)"}
                  </div>
                </div>
                <button type="button" id="btn-config-gas" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-bold shrink-0">
                  Atur / Hubungkan
                </button>
              </div>

              <!-- Tombol Pulihkan dari Google Drive -->
              <div class="grid grid-cols-1 gap-2">
                <button type="button" id="btn-restore-drive" class="w-full py-2.5 rounded-xl border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold flex items-center justify-center gap-1.5 transition">
                  <i data-lucide="cloud-download" class="w-4 h-4"></i>
                  <span>${cloudConnected ? "Pulihkan dari Google Drive" : "Pulihkan dari Snapshot Terakhir"}</span>
                </button>

                ${
                  cloudConnected
                    ? `<button type="button" id="btn-sync-now" class="w-full py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold flex items-center justify-center gap-1.5">
                        <i data-lucide="refresh-ccw" class="w-3.5 h-3.5"></i> Tarik Pembaruan Data Terbaru
                       </button>`
                    : `<div class="grid grid-cols-2 gap-2 pt-1">
                        <button type="button" id="btn-export-json" class="py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-[11px] font-semibold flex items-center justify-center gap-1.5">
                          <i data-lucide="download" class="w-3.5 h-3.5"></i> Ekspor JSON
                        </button>
                        <label class="py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-[11px] font-semibold flex items-center justify-center gap-1.5 cursor-pointer">
                          <i data-lucide="upload" class="w-3.5 h-3.5"></i> Impor JSON
                          <input id="inp-import-json" type="file" accept=".json,application/json" class="hidden" />
                        </label>
                       </div>`
                }
              </div>
            </div>
          </div>
        </section>

        <!-- Reset Lokal (Mode Demo) -->
        ${
          !cloudConnected
            ? `<div class="mt-3 text-center">
                <button type="button" id="btn-reset-demo-profil" class="text-[11px] text-slate-500 hover:text-rose-600 underline">
                  Reset Data Demo Lokal ke Kondisi Awal
                </button>
               </div>`
            : ""
        }
      `;
    }

    // ========================================================================
    // 13. EVENT BINDING SEMUA HALAMAN
    // ========================================================================
    function bindAppEvents(user) {
      // Bottom Nav & navigasi cepat
      document.querySelectorAll("[data-nav]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.activeTab = btn.getAttribute("data-nav");
          ui.articleDetailId = null;
          render();
        });
      });

      // Klik status sync di Header -> buka Profil / sinkron cepat
      document.getElementById("btn-header-sync-info")?.addEventListener("click", () => {
        if (isCloudSession() && navigator.onLine) {
          syncFromCloud(false);
        } else {
          ui.activeTab = "profil";
          ui.articleDetailId = null;
          render();
        }
      });

      document.getElementById("btn-back-artikel")?.addEventListener("click", () => {
        ui.articleDetailId = null;
        render();
      });

      document.getElementById("btn-logout-trigger")?.addEventListener("click", () => {
        openConfirm({
          title: "Konfirmasi Logout",
          message: "Apakah Anda yakin ingin keluar dari akun Laboratorium Komputer?",
          confirmLabel: "Ya, Logout",
          danger: true,
          onConfirm: () => {
            persistSession(null);
            ui.activeTab = "artikel";
            ui.articleDetailId = null;
            updateSyncIndicator();
            showToast("Anda berhasil keluar dari akun.", "info");
            render();
          }
        });
      });

      document.getElementById("btn-goto-login")?.addEventListener("click", () => {
        ui.activeTab = "artikel";
        render();
      });
      document.getElementById("btn-profil-login-cta")?.addEventListener("click", () => {
        ui.activeTab = "artikel";
        render();
      });

      // --- ARTIKEL ---
      const searchInp = document.getElementById("inp-article-search");
      if (searchInp) {
        searchInp.addEventListener("input", (e) => {
          const val = e.target.value;
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            ui.articleSearch = val;
            render();
            const restored = document.getElementById("inp-article-search");
            if (restored) {
              restored.focus();
              restored.setSelectionRange(val.length, val.length);
            }
          }, 300);
        });
      }

      document.getElementById("btn-sort-article")?.addEventListener("click", () => {
        ui.articleSort = ui.articleSort === "desc" ? "asc" : "desc";
        render();
      });

      document.querySelectorAll("[data-open-article]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.articleDetailId = btn.getAttribute("data-open-article");
          render();
        });
      });

      document.getElementById("btn-new-article")?.addEventListener("click", () => openNewArticleModal(user));

      document.querySelectorAll("[data-del-article]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-article");
          openConfirm({
            title: "Hapus Artikel?",
            message: "Artikel beserta seluruh komentar dan suka akan dihapus permanen.",
            confirmLabel: "Hapus",
            onConfirm: async () => {
              if (isCloudSession()) {
                const res = await callGas("deleteArticle", { id });
                if (!res.ok) {
                  showToast(res.error || "Gagal menghapus artikel di Drive.", "error");
                  return;
                }
              }
              db.articles = db.articles.filter((a) => a.id !== id);
              db.likes = db.likes.filter((l) => l.article_id !== id);
              db.comments = db.comments.filter((c) => c.article_id !== id);
              persistState(true);
              showToast("Artikel berhasil dihapus.", "success");
              render();
            }
          });
        });
      });

      document.getElementById("btn-like-article")?.addEventListener("click", async () => {
        const articleId = ui.articleDetailId;
        const idx = db.likes.findIndex((l) => l.article_id === articleId && l.user_id === user.id);
        if (idx >= 0) db.likes.splice(idx, 1);
        else db.likes.push({ article_id: articleId, user_id: user.id });
        persistState(true);
        render();

        if (isCloudSession()) {
          const res = await callGas("toggleLike", { article_id: articleId });
          if (!res.ok && !res.isNetworkError) showToast(res.error || "Gagal menyimpan Like.", "error");
        }
      });

      document.getElementById("btn-share-article")?.addEventListener("click", async () => {
        const art = db.articles.find((a) => a.id === ui.articleDetailId);
        const shareUrl = `${window.location.origin}${window.location.pathname}#artikel-${ui.articleDetailId}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: art?.title || "Artikel Labkom", url: shareUrl });
            return;
          } catch {}
        }
        copyTextSafe(shareUrl);
        showToast("Link artikel berhasil disalin ke clipboard!", "success");
      });

      document.getElementById("form-comment")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const inp = document.getElementById("inp-comment");
        const content = inp.value.trim();
        if (!content) return;

        const newCmt = {
          id: uid("cmt"),
          article_id: ui.articleDetailId,
          user_id: user.id,
          content,
          created_at: new Date().toISOString()
        };

        if (isCloudSession()) {
          const res = await callGas("addComment", { article_id: ui.articleDetailId, content });
          if (!res.ok) {
            showToast(res.error || "Gagal mengirim komentar.", "error");
            return;
          }
          if (res.data?.comment) Object.assign(newCmt, res.data.comment);
        }

        db.comments.push(newCmt);
        persistState(true);
        render();
      });

      // --- PENGUMUMAN ---
      document.querySelectorAll("[data-ann-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.announcementTab = btn.getAttribute("data-ann-tab");
          render();
        });
      });

      document.getElementById("btn-new-announcement")?.addEventListener("click", () => openNewAnnouncementModal(user));

      document.querySelectorAll("[data-del-ann]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-ann");
          openConfirm({
            title: "Hapus Pengumuman?",
            message: "Pengumuman ini tidak akan tampil lagi di daftar.",
            confirmLabel: "Hapus",
            onConfirm: async () => {
              if (isCloudSession()) {
                const res = await callGas("deleteAnnouncement", { id });
                if (!res.ok) {
                  showToast(res.error || "Gagal menghapus pengumuman.", "error");
                  return;
                }
              }
              db.announcements = db.announcements.filter((a) => a.id !== id);
              persistState(true);
              showToast("Pengumuman berhasil dihapus.", "success");
              render();
            }
          });
        });
      });

      // --- TUGAS ---
      document.getElementById("btn-new-assignment")?.addEventListener("click", () => openNewAssignmentModal(user));

      document.querySelectorAll("[data-dl-material]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const asg = db.assignments.find((a) => a.id === btn.getAttribute("data-dl-material"));
          if (!asg) return;
          handleFileDownload({
            fileId: asg.file_id || ("local-mat-" + asg.id),
            kind: "material",
            fileName: asg.file_name,
            fallbackContent: asg.file_content,
            localBase64: asg.file_base64,
            localMime: asg.file_mime
          });
        });
      });

      document.querySelectorAll("[data-dl-sub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const sub = db.submissions.find((s) => s.id === btn.getAttribute("data-dl-sub"));
          if (!sub) return;
          handleFileDownload({
            fileId: sub.file_id || ("local-sub-" + sub.id),
            kind: "submission",
            fileName: sub.file_name,
            fallbackContent: sub.file_content,
            localBase64: sub.file_base64,
            localMime: sub.file_mime
          });
        });
      });

      document.querySelectorAll("[data-upload-sub]").forEach((inp) => {
        inp.addEventListener("change", async (e) => {
          const file = e.target.files?.[0];
          const asgId = inp.getAttribute("data-upload-sub");
          e.target.value = "";
          if (!file) return;

          const err = validateFile(file);
          if (err) {
            showToast(err, "error");
            return;
          }

          showToast("Mengunggah tugas...", "info");
          let fileBase64 = "";
          try {
            if (isCloudSession() || file.size <= 1.5 * 1024 * 1024) {
              fileBase64 = await readFileAsBase64(file);
            }
          } catch (readErr) {
            showToast(readErr.message, "error");
            return;
          }

          let remoteSub = null;
          if (isCloudSession()) {
            const res = await callGas("submitAssignment", {
              assignment_id: asgId,
              file_name: file.name,
              file_mime: file.type || "application/octet-stream",
              file_base64: fileBase64,
              file_size: file.size
            });
            if (!res.ok) {
              showToast(res.error || "Gagal mengunggah tugas ke Google Drive.", "error");
              return;
            }
            remoteSub = res.data?.submission || null;
          }

          let existing = db.submissions.find((s) => s.assignment_id === asgId && s.student_id === user.id);
          if (existing) {
            existing.file_name = remoteSub?.file_name || file.name;
            existing.file_size = remoteSub?.file_size || file.size;
            existing.file_id = remoteSub?.file_id || existing.file_id || ("local-sub-" + existing.id);
            existing.file_mime = file.type || "application/octet-stream";
            existing.file_base64 = !isCloudSession() && file.size <= 1.5 * 1024 * 1024 ? fileBase64 : undefined;
            existing.submitted_at = remoteSub?.submitted_at || new Date().toISOString();
            runtimeBlobStore.set(existing.file_id, file);
          } else {
            const newId = remoteSub?.id || uid("sub");
            const fileId = remoteSub?.file_id || ("local-sub-" + newId);
            const newSub = {
              id: newId,
              assignment_id: asgId,
              student_id: user.id,
              file_id: fileId,
              file_name: remoteSub?.file_name || file.name,
              file_size: remoteSub?.file_size || file.size,
              file_mime: file.type || "application/octet-stream",
              file_base64: !isCloudSession() && file.size <= 1.5 * 1024 * 1024 ? fileBase64 : undefined,
              file_content: `File unggahan praktikan: ${file.name} (${formatBytes(file.size)}) oleh ${user.full_name}`,
              submitted_at: remoteSub?.submitted_at || new Date().toISOString()
            };
            db.submissions.push(newSub);
            runtimeBlobStore.set(fileId, file);
          }

          persistState(true);
          showToast("Tugas berhasil dikumpulkan!", "success");
          render();
        });
      });

      // --- KELAS ---
      document.getElementById("sel-kelas-asisten")?.addEventListener("change", (e) => {
        ui.selectedKelasId = e.target.value;
        render();
      });

      document.getElementById("btn-add-student")?.addEventListener("click", openAddStudentModal);

      document.querySelectorAll("[data-remove-student]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const stId = btn.getAttribute("data-remove-student");
          const st = db.users.find((u) => u.id === stId);
          openConfirm({
            title: "Keluarkan Praktikan?",
            message: `Keluarkan ${st ? st.full_name : "praktikan ini"} dari kelas ini?`,
            confirmLabel: "Keluarkan",
            onConfirm: async () => {
              if (isCloudSession()) {
                const res = await callGas("removeStudent", { class_id: ui.selectedKelasId, student_id: stId });
                if (!res.ok) {
                  showToast(res.error || "Gagal mengeluarkan praktikan.", "error");
                  return;
                }
              }
              db.enrollments = db.enrollments.filter(
                (en) => !(en.class_id === ui.selectedKelasId && en.student_id === stId)
              );
              persistState(true);
              showToast("Praktikan dikeluarkan dari kelas.", "info");
              render();
            }
          });
        });
      });

      document.querySelectorAll("[data-open-student]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openStudentDetailModal(btn.getAttribute("data-open-student"), ui.selectedKelasId);
        });
      });

      // --- NILAI ---
      document.getElementById("btn-dualrole-kelas")?.addEventListener("click", () => {
        ui.activeTab = "kelas";
        render();
      });

      document.getElementById("sel-kelas-nilai")?.addEventListener("change", (e) => {
        ui.selectedNilaiClassId = e.target.value;
        render();
      });

      document.getElementById("btn-export-xlsx")?.addEventListener("click", () => {
        exportExcel(buildGradeMatrix(ui.selectedNilaiClassId));
      });
      document.getElementById("btn-export-docx")?.addEventListener("click", () => {
        exportWord(buildGradeMatrix(ui.selectedNilaiClassId));
      });
      document.getElementById("btn-export-pdf")?.addEventListener("click", () => {
        exportPdf(buildGradeMatrix(ui.selectedNilaiClassId));
      });

      // --- ASISTEN ---
      document.getElementById("btn-add-assistant")?.addEventListener("click", openAddAssistantModal);

      document.querySelectorAll("[data-toggle-dual]").forEach((chk) => {
        chk.addEventListener("change", async () => {
          const targetId = chk.getAttribute("data-toggle-dual");
          const target = db.users.find((u) => u.id === targetId);
          if (!target) return;
          const nextVal = chk.checked;

          if (isCloudSession()) {
            const res = await callGas("toggleDualRole", { user_id: targetId, is_asisten: nextVal });
            if (!res.ok) {
              chk.checked = !nextVal;
              showToast(res.error || "Gagal memperbarui Dual-Role.", "error");
              return;
            }
          }
          target.is_asisten = nextVal;
          if (session?.user?.id === targetId) {
            session.user.is_asisten = nextVal;
            persistSession(session);
          }
          persistState(true);
          showToast(`${target.full_name}: Dual-Role ${nextVal ? "diaktifkan" : "dinonaktifkan"}.`, "success");
          render();
        });
      });

      document.querySelectorAll("[data-toggle-class]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const [asstId, clsId] = btn.getAttribute("data-toggle-class").split("::");
          if (isCloudSession()) {
            const res = await callGas("toggleClassAssistant", { assistant_id: asstId, class_id: clsId });
            if (!res.ok) {
              showToast(res.error || "Gagal mengubah pembagian kelas.", "error");
              return;
            }
          }
          const idx = db.class_assistants.findIndex((ca) => ca.assistant_id === asstId && ca.class_id === clsId);
          if (idx >= 0) db.class_assistants.splice(idx, 1);
          else db.class_assistants.push({ id: uid("ca"), assistant_id: asstId, class_id: clsId });
          persistState(true);
          render();
        });
      });

      document.querySelectorAll("[data-del-assistant]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const asstId = btn.getAttribute("data-del-assistant");
          const target = db.users.find((u) => u.id === asstId);
          openConfirm({
            title: "Hapus Akun Asisten?",
            message: `Hapus asisten "${target ? target.full_name : ""}" dari sistem?`,
            confirmLabel: "Hapus",
            onConfirm: async () => {
              if (isCloudSession()) {
                const res = await callGas("deleteAssistant", { user_id: asstId });
                if (!res.ok) {
                  showToast(res.error || "Gagal menghapus asisten.", "error");
                  return;
                }
              }
              db.users = db.users.filter((u) => u.id !== asstId);
              db.class_assistants = db.class_assistants.filter((ca) => ca.assistant_id !== asstId);
              persistState(true);
              showToast("Asisten berhasil dihapus.", "success");
              render();
            }
          });
        });
      });

      // --- PROFIL & WHATSAPP-STYLE BACKUP ---
      document.getElementById("btn-backup-now")?.addEventListener("click", () => {
        performBackup({ reason: "manual", silent: false });
      });

      document.getElementById("sel-backup-freq")?.addEventListener("change", (e) => {
        backupCfg.frequency = e.target.value;
        persistBackupCfg();
        const labels = {
          realtime: "Otomatis setiap perubahan (debounce 4 dtk)",
          daily: "Harian",
          weekly: "Mingguan",
          manual: "Manual saja"
        };
        showToast(`Frekuensi cadangan diubah: ${labels[backupCfg.frequency]}`, "success");
      });

      document.getElementById("btn-config-gas")?.addEventListener("click", openGasSettingsModal);

      document.getElementById("btn-restore-drive")?.addEventListener("click", () => {
        openConfirm({
          title: isCloudConfigured() ? "Pulihkan dari Google Drive?" : "Pulihkan Snapshot Lokal?",
          message: isCloudConfigured()
            ? "Data cache lokal akan ditimpa dengan cadangan terbaru dari Google Drive Anda."
            : "Data lokal saat ini akan dikembalikan ke snapshot cadangan terakhir.",
          confirmLabel: "Ya, Pulihkan",
          danger: false,
          onConfirm: performRestoreFromDrive
        });
      });

      document.getElementById("btn-sync-now")?.addEventListener("click", () => syncFromCloud(false));

      document.getElementById("btn-export-json")?.addEventListener("click", () => {
        const payload = {
          app: "Laboratorium Komputer (Labkom)",
          version: 2,
          exportedAt: new Date().toISOString(),
          state: db
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const dateTag = new Date().toISOString().slice(0, 10);
        triggerBlobDownload(blob, `labkom_backup_${dateTag}.json`);
        showToast("File cadangan JSON berhasil diunduh!", "success");
      });

      document.getElementById("inp-import-json")?.addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result || ""));
            const nextState = parsed.state || parsed;
            if (!nextState || !Array.isArray(nextState.users) || !Array.isArray(nextState.classes)) {
              showToast("Format file JSON cadangan tidak valid.", "error");
              return;
            }
            openConfirm({
              title: "Impor Cadangan JSON?",
              message: `Muat data dari "${file.name}" dan ganti data lokal saat ini?`,
              confirmLabel: "Ya, Impor",
              danger: false,
              onConfirm: () => {
                db = nextState;
                persistState(false);
                showToast("Cadangan JSON berhasil diimpor & dipulihkan!", "success");
                render();
              }
            });
          } catch {
            showToast("Gagal membaca file JSON.", "error");
          }
        };
        reader.readAsText(file);
      });

      document.getElementById("btn-reset-demo-profil")?.addEventListener("click", confirmResetLocalData);
    }

      document.getElementById("modal-gas-test")?.addEventListener("click", async () => {
        const url = document.getElementById("modal-gas-url").value.trim();

        if (!/^https?:\/\//i.test(url)) {
          fb.className = "p-2.5 rounded-xl text-[11px] bg-rose-50 text-rose-700 border border-rose-200";

        render();
      });
    }

        db.assignments.unshift(
          remoteAsg || {

            class_id: payload.class_id,
            title: payload.title,
            description: payload.description,
            file_id: fileId,
            file_name: payload.file_name,
            file_mime: payload.file_mime,
            file_base64: !isCloudSession() && file && file.size <= 1.5 * 1024 * 1024 ? fileBase64 : undefined,
            file_content: `Modul Tugas: ${payload.title}\n\n${payload.description}`,
            release_at: payload.release_at,
            due_at: payload.due_at,
            created_by: user.id,
            created_at: new Date().toISOString()
          }
        );

        persistState(true);
        closeModal();
        showToast("Tugas berhasil dijadwalkan!", "success");
        render();
      });

    function openStudentDetailModal(studentId, classId) {
      const st = db.users.find((u) => u.id === studentId);
      const cls = db.classes.find((c) => c.id === classId);
      if (!st) return;

      const classAsgs = db.assignments.filter((a) => a.class_id === classId);
      const subs = db.submissions.filter(
        (s) => s.student_id === studentId && classAsgs.some((a) => a.id === s.assignment_id)
      );

      const listHtml =
        subs.length === 0
          ? `<div class="p-6 text-center text-xs text-slate-500 bg-slate-50 rounded-xl border border-slate-100">
              Praktikan ini belum mengumpulkan tugas di kelas ${esc(cls?.name || "")}.
             </div>`
          : `<div class="space-y-3">
              ${subs
                .map((sub) => {
                  const asg = classAsgs.find((a) => a.id === sub.assignment_id);
                  const existingGrade = db.grades.find((g) => g.submission_id === sub.id);
                  return `
                    <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                      <div class="font-bold text-xs text-slate-900">${esc(asg ? asg.title : "Tugas")}</div>
                      <div class="text-[10px] text-slate-500 mt-0.5">Dikumpulkan: ${formatDate(sub.submitted_at, true)}</div>
                      <button type="button" data-modal-dl-sub="${sub.id}" class="mt-2 inline-flex items-center gap-1.5 text-xs font-semibold text-blue-600 hover:underline bg-white px-2.5 py-1.5 rounded-lg border border-blue-100">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span class="truncate max-w-[210px]">${esc(sub.file_name)}</span>
                      </button>

                      <div class="mt-2.5 flex items-center gap-2">
                        <input type="number" min="0" max="100" step="0.5" data-score-input="${sub.id}" value="${existingGrade !== undefined ? existingGrade.score : ""}" placeholder="Nilai (0-100)" class="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                        <button type="button" data-save-grade="${sub.id}" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1">
                          <i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan
                        </button>
                      </div>
                      <input type="text" data-feedback-input="${sub.id}" value="${esc(existingGrade?.feedback || "")}" placeholder="Catatan evaluasi internal (opsional)..." class="mt-2 w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-[11px] focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                    </div>
                  `;
                })
                .join("")}
            </div>`;

      openModal(
        "Detail & Penilaian Praktikan",
        `<div class="space-y-4">
          <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-900 text-white">
            <div class="w-11 h-11 rounded-full bg-blue-600 flex items-center justify-center font-bold text-base shrink-0">
              ${esc(st.full_name.charAt(0).toUpperCase())}
            </div>
            <div class="min-w-0">
              <div class="font-bold text-sm truncate">${esc(st.full_name)}</div>
              <div class="text-[11px] text-slate-300 font-mono">NIM: ${esc(st.username)} • ${esc(cls?.name || "")}</div>
            </div>
          </div>

          <div class="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 flex items-center gap-1.5">
            <i data-lucide="lock" class="w-3.5 h-3.5 shrink-0"></i>
            <span>Nilai tersinkron ke Rekap Nilai & <strong>tersembunyi mutlak</strong> dari akun Praktikan.</span>
          </div>

          ${listHtml}
        </div>`
      );

      document.querySelectorAll("[data-modal-dl-sub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const sub = db.submissions.find((s) => s.id === btn.getAttribute("data-modal-dl-sub"));
          if (!sub) return;
          handleFileDownload({
            fileId: sub.file_id || ("local-sub-" + sub.id),
            kind: "submission",
            fileName: sub.file_name,
            fallbackContent: sub.file_content,
            localBase64: sub.file_base64,
            localMime: sub.file_mime
          });
        });
      });

      document.querySelectorAll("[data-save-grade]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const subId = btn.getAttribute("data-save-grade");
          const scoreInp = document.querySelector(`[data-score-input="${subId}"]`);
          const fbInp = document.querySelector(`[data-feedback-input="${subId}"]`);
          const val = parseFloat(scoreInp.value);
          const feedback = (fbInp?.value || "").trim();

          if (isNaN(val) || val < 0 || val > 100) {
            showToast("Masukkan angka nilai valid antara 0 hingga 100.", "error");
            return;
          }

          if (isCloudSession()) {
            const res = await callGas("saveGrade", { submission_id: subId, score: val, feedback });
            if (!res.ok) {
              showToast(res.error || "Gagal menyimpan nilai ke Drive.", "error");
              return;
            }
          }

          const sub = db.submissions.find((s) => s.id === subId);
          if (!sub) return;
          const existing = db.grades.find((g) => g.submission_id === subId);
          if (existing) {
            existing.score = val;
            existing.feedback = feedback;
            existing.updated_at = new Date().toISOString();
          } else {
            db.grades.push({
              id: uid("grd"),
              submission_id: subId,
              assignment_id: sub.assignment_id,
              student_id: studentId,
              class_id: classId,
              score: val,
              feedback,
              updated_at: new Date().toISOString()
            });
          }

          persistState(true);
          showToast(`Nilai ${val} tersimpan & otomatis masuk ke tabel Nilai!`, "success");
          render();
        });
      });
    }

          return;
        }

        db.users.push(
          remoteUser || {
            id: uid("u"),
            username,
            password,
            full_name,
            role: "asisten",
            is_asisten: true,
            created_at: new Date().toISOString()
          }
        );
        persistState(true);
        closeModal();
        showToast(`Asisten ${full_name} berhasil ditambahkan!`, "success");
        render();
      });
    }

    function confirmResetLocalData() {
      openConfirm({
        title: "Reset Data Lokal?",
        message: "Seluruh data demo lokal dan snapshot akan dikembalikan ke kondisi awal.",
        confirmLabel: "Ya, Reset",
        danger: true,
        onConfirm: () => {
          localStorage.removeItem(STATE_KEY);
          localStorage.removeItem(SESSION_KEY);
          localStorage.removeItem(BACKUP_CFG_KEY);
          localStorage.removeItem(LOCAL_SNAPSHOT_KEY);
          runtimeBlobStore.clear();
          session = null;
          loadAllFromStorage();
          ui.activeTab = "artikel";
          ui.articleDetailId = null;
          showToast("Data lokal berhasil dikembalikan ke kondisi awal.", "success");
          render();
        }
      });
    }

    // ========================================================================
    // 15. NETWORK LISTENERS & BOOTSTRAP APLIKASI
    // ========================================================================
    window.addEventListener("online", () => {
      ui.isOffline = false;
      updateSyncIndicator();
      render();
      if (isCloudSession()) {
        syncFromCloud(true);
      }
    });

    window.addEventListener("offline", () => {
      ui.isOffline = true;
      updateSyncIndicator("offline");
      render();
    });

    // Jalankan Aplikasi
    loadAllFromStorage();
    render();
    checkScheduledBackupOnStartup();
    if (isCloudSession() && navigator.onLine) {
      syncFromCloud(true);
    }
  })();
  </script>
</body>
</html>
