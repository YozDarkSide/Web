<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Labkom" />
  <meta name="description" content="Progressive Web App Laboratorium Komputer dengan sinkronisasi & cadangan otomatis Google Drive." />
  <title>Laboratorium Komputer (Labkom)</title>

  <!-- Dynamic Inline PWA Manifest (Android & iOS Home Screen Ready) -->
  <link id="pwa-manifest-link" rel="manifest" href="" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Client-Side Export Libraries: SheetJS (.xlsx), docx (.docx), FileSaver.js, jsPDF + AutoTable (.pdf) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      font-family: 'Inter', system-ui, sans-serif;
      overscroll-behavior-y: none;
    }
    .pt-safe {
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }
    .pb-safe {
      padding-bottom: max(0.45rem, env(safe-area-inset-bottom));
    }
    .app-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .app-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeSlideUp 0.18s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-200 sm:bg-slate-900/95 text-slate-900 min-h-[100dvh] flex items-center justify-center sm:p-4">

  <!-- ====================================================================== -->
  <!-- MOBILE-FIRST NATIVE PWA SHELL                                          -->
  <!-- ====================================================================== -->
  <div id="app-frame" class="w-full sm:max-w-md h-[100dvh] sm:h-[calc(100dvh-2rem)] sm:max-h-[900px] bg-slate-50 sm:rounded-[28px] sm:shadow-2xl sm:border sm:border-slate-700/60 overflow-hidden flex flex-col relative">

    <!-- Toast Notification Stack -->
    <div id="toast-container" class="absolute top-16 left-4 right-4 z-[80] pointer-events-none flex flex-col gap-2"></div>

    <!-- Dynamic App Content Root -->
    <div id="app-root" class="flex-1 flex flex-col min-h-0 overflow-hidden"></div>

    <!-- Modal Overlay -->
    <div id="modal-root" class="hidden absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-3"></div>

    <!-- Confirmation Dialog Overlay (Replaces native alert/confirm) -->
    <div id="confirm-root" class="hidden absolute inset-0 z-[65] bg-slate-900/65 backdrop-blur-[2px] flex items-center justify-center p-4"></div>

  </div>

  <script>
  /**
   * ==========================================================================
   * LABORATORIUM KOMPUTER (LABKOM) — AUTO-CONNECTED GOOGLE DRIVE PWA
   * ==========================================================================
   * 100% otomatis terhubung ke Google Apps Script (Google Drive) tanpa
   * pengaturan URL manual. Mendukung Local-First cache, anti random logout,
   * auto-sync 30 detik, auto-backup ala WhatsApp, Dual-Role Admin+Asisten,
   * isolasi nilai mutlak, serta export Excel (.xlsx), Word (.docx), PDF (.pdf).
   */
  (function () {
    "use strict";

    // ========================================================================
    // 1. PERMANENT AUTO-CONNECTED GOOGLE APPS SCRIPT ENDPOINT & STORAGE KEYS
    // ========================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwJaDPPxUWRA0ql5rw8Q8tvQPnmmT_9eFEoeZQrDqYoQXCQIP8x2ngq8z24fYK0xVy7/exec";

    const KEY_SESSION = "labkom_v3_session";
    const KEY_STATE = "labkom_v3_state";
    const KEY_BACKUP_META = "labkom_v3_backup_meta";
    const KEY_BACKUP_FREQ = "labkom_v3_backup_freq";

    const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5 MB
    const ALLOWED_EXT = [".pdf", ".docx", ".xlsx", ".zip", ".rar", ".png", ".jpg", ".jpeg"];
    const AUTO_SYNC_INTERVAL_MS = 30000;   // Sinkronisasi latar belakang tiap 30 detik
    const AUTO_BACKUP_DEBOUNCE_MS = 5000;  // Auto-backup 5 detik setelah perubahan

    // Pasang manifest PWA secara dinamis via Blob agar siap di-install ke Home Screen
    (function injectDynamicManifest() {
      try {
        const svgIcon = encodeURIComponent(
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>" +
          "<rect width='512' height='512' rx='112' fill='#0f172a'/>" +
          "<rect x='56' y='56' width='400' height='400' rx='84' fill='#2563eb'/>" +
          "<text x='256' y='306' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='186' font-weight='800' fill='#ffffff'>LK</text>" +
          "</svg>"
        );
        const manifestObj = {
          name: "Laboratorium Komputer (Labkom)",
          short_name: "Labkom",
          description: "Portal Praktikum, Tugas, dan Penilaian Laboratorium Komputer",
          start_url: window.location.href.split("#")[0],
          display: "standalone",
          orientation: "portrait",
          background_color: "#f8fafc",
          theme_color: "#0f172a",
          icons: [
            { src: "data:image/svg+xml," + svgIcon, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
            { src: "data:image/svg+xml," + svgIcon, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
        const link = document.getElementById("pwa-manifest-link");
        if (link) link.href = URL.createObjectURL(blob);
      } catch {}
    })();

    // ========================================================================
    // 2. GLOBAL STATE & UI CONTROLLER
    // ========================================================================
    let session = null; // { token, user: { id, username, fullName, role, isAsisten } }
    let db = createEmptyState();
    let backupMeta = createDefaultBackupMeta();
    let backupFreq = "realtime"; // realtime | daily | weekly | manual

    let ui = {
      activeTab: "artikel",        // artikel | pengumuman | tugas | kelas | nilai | asisten | profil
      articleDetailId: null,
      articleSearch: "",
      articleSort: "desc",         // desc | asc
      announcementTab: "global",   // global | asisten
      selectedKelasId: "",
      selectedNilaiClassId: "",
      loginMode: "login",          // login | register
      showPassword: false,
      isSubmittingAuth: false,
      isOffline: typeof navigator !== "undefined" ? !navigator.onLine : false,
      connState: typeof navigator !== "undefined" && !navigator.onLine ? "offline" : "connecting", // connecting | online | syncing | offline
      isBackingUp: false,
      uploadingAssignmentId: null
    };

    let searchDebounceTimer = null;
    let autoBackupTimer = null;
    let isSyncInFlight = false;

    function createEmptyState() {
      return {
        users: [],
        classes: [],
        articles: [],
        announcements: [],
        assignments: [],
        submissions: [],
        grades: []
      };
    }

    function createDefaultBackupMeta() {
      return {
        lastSyncAt: null,
        lastBackupAt: null,
        lastBackupFileName: null,
        lastBackupSizeBytes: 0
      };
    }

    // ========================================================================
    // 3. LOCALSTORAGE PERSISTENCE (FRESH v3 KEYS, ANTI RANDOM LOGOUT)
    // ========================================================================
    function loadFromStorage() {
      try {
        const rawState = localStorage.getItem(KEY_STATE);
        if (rawState) db = normalizeState(JSON.parse(rawState));
      } catch {
        db = createEmptyState();
      }

      try {
        const rawMeta = localStorage.getItem(KEY_BACKUP_META);
        backupMeta = rawMeta ? Object.assign(createDefaultBackupMeta(), JSON.parse(rawMeta)) : createDefaultBackupMeta();
      } catch {
        backupMeta = createDefaultBackupMeta();
      }

      try {
        const savedFreq = localStorage.getItem(KEY_BACKUP_FREQ);
        if (["realtime", "daily", "weekly", "manual"].includes(savedFreq)) {
          backupFreq = savedFreq;
        }
      } catch {
        backupFreq = "realtime";
      }

      try {
        const rawSess = localStorage.getItem(KEY_SESSION);
        if (rawSess) {
          const parsed = JSON.parse(rawSess);
          if (parsed && parsed.token && parsed.user && parsed.user.id) {
            session = parsed;
          }
        }
      } catch {
        session = null;
      }

      ui.isOffline = typeof navigator !== "undefined" ? !navigator.onLine : false;
      ui.connState = ui.isOffline ? "offline" : "connecting";
    }

    function normalizeState(raw) {
      const s = raw && typeof raw === "object" ? raw : {};
      return {
        users: Array.isArray(s.users) ? s.users : [],
        classes: Array.isArray(s.classes) ? s.classes : [],
        articles: Array.isArray(s.articles) ? s.articles : [],
        announcements: Array.isArray(s.announcements) ? s.announcements : [],
        assignments: Array.isArray(s.assignments) ? s.assignments : [],
        submissions: Array.isArray(s.submissions) ? s.submissions : [],
        grades: Array.isArray(s.grades) ? s.grades : []
      };
    }

    function saveState(newState, serverTime) {
      db = normalizeState(newState);

      // Isolasi nilai mutlak: akun praktikan selalu memegang array kosong
      if (session?.user?.role === "praktikan") {
        db.grades = [];
      }

      // Perbarui metadata peran/dual-role user aktif secara real-time dari server
      if (session && session.user) {
        const updatedSelf = db.users.find((u) => u.id === session.user.id);
        if (updatedSelf) {
          session.user = {
            id: updatedSelf.id,
            username: updatedSelf.username,
            fullName: updatedSelf.fullName,
            role: updatedSelf.role,
            isAsisten: Boolean(updatedSelf.isAsisten)
          };
          saveSession(session);
        }
      }

      try {
        localStorage.setItem(KEY_STATE, JSON.stringify(db));
        backupMeta.lastSyncAt = serverTime || new Date().toISOString();
        saveBackupMeta();
      } catch {}
    }

    function saveSession(newSess) {
      session = newSess;
      try {
        if (newSess) localStorage.setItem(KEY_SESSION, JSON.stringify(newSess));
        else localStorage.removeItem(KEY_SESSION);
      } catch {}
    }

    function saveBackupMeta() {
      try {
        localStorage.setItem(KEY_BACKUP_META, JSON.stringify(backupMeta));
      } catch {}
    }

    function saveBackupFreq(freq) {
      backupFreq = freq;
      try {
        localStorage.setItem(KEY_BACKUP_FREQ, freq);
      } catch {}
    }

    function getLocalCacheSizeBytes() {
      try {
        return new Blob([localStorage.getItem(KEY_STATE) || JSON.stringify(db)]).size;
      } catch {
        return 0;
      }
    }

    // ========================================================================
    // 4. GOOGLE APPS SCRIPT CLIENT (CORS-SAFE TEXT/PLAIN + AUTO PING/SYNC)
    // ========================================================================
    async function callGas(action, payload = {}) {
      if (typeof navigator !== "undefined" && !navigator.onLine) {
        ui.isOffline = true;
        ui.connState = "offline";
        updateLiveConnectionIndicators();
        return {
          ok: false,
          isNetworkError: true,
          error: "Koneksi internet terputus. Periksa Wi-Fi atau data seluler Anda."
        };
      }

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action,
            token: session?.token || "",
            payload: payload || {}
          }),
          redirect: "follow"
        });

        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch {
          return {
            ok: false,
            isNetworkError: false,
            error: "Server Google Drive mengembalikan respons tidak valid. Pastikan Web App Google Apps Script di-deploy dengan akses 'Anyone'."
          };
        }

        // Anti Random Logout: hanya logout jika server HTTP berhasil menjawab bahwa sesi benar-benar tidak valid/dicabut
        if (
          res.ok &&
          data &&
          data.ok === false &&
          session &&
          action !== "login" &&
          action !== "register" &&
          action !== "ping" &&
          /sesi tidak valid|telah berakhir/i.test(String(data.error || ""))
        ) {
          saveSession(null);
          ui.activeTab = "artikel";
          ui.articleDetailId = null;
          showToast("Sesi Anda telah berakhir di server. Silakan login kembali.", "error");
          render();
          return data;
        }

        return data;
      } catch {
        ui.connState = "offline";
        updateLiveConnectionIndicators();
        return {
          ok: false,
          isNetworkError: true,
          error: "Gagal terhubung ke server Google Drive. Periksa kestabilan jaringan internet Anda."
        };
      }
    }

    async function pingDrive() {
      if (typeof navigator !== "undefined" && !navigator.onLine) {
        ui.isOffline = true;
        ui.connState = "offline";
        updateLiveConnectionIndicators();
        return false;
      }

      ui.connState = "connecting";
      updateLiveConnectionIndicators();

      const res = await callGas("ping", {});
      if (res && res.ok) {
        ui.isOffline = false;
        ui.connState = "online";
        updateLiveConnectionIndicators();
        return true;
      }

      ui.connState = "offline";
      updateLiveConnectionIndicators();
      return false;
    }

    async function syncWithDrive({ silent = true } = {}) {
      if (!session || isSyncInFlight) return false;
      if (typeof navigator !== "undefined" && !navigator.onLine) {
        ui.isOffline = true;
        ui.connState = "offline";
        updateLiveConnectionIndicators();
        if (!silent) showToast("Sedang offline. Menampilkan data lokal tersimpan.", "info");
        return false;
      }

      isSyncInFlight = true;
      ui.connState = "syncing";
      updateLiveConnectionIndicators();

      const res = await callGas("sync", {});
      isSyncInFlight = false;

      if (res && res.ok && res.state) {
        saveState(res.state, res.serverTime);
        ui.isOffline = false;
        ui.connState = "online";
        updateLiveConnectionIndicators();
        if (!silent) showToast("Data berhasil disinkronkan dengan Google Drive.", "success");
        // Hindari mengganggu pengguna yang sedang mengetik di modal terbuka
        if (document.getElementById("modal-root")?.classList.contains("hidden")) {
          render();
        }
        return true;
      }

      // Jangan pernah menghapus sesi saat koneksi lambat/gagal
      ui.connState = "offline";
      updateLiveConnectionIndicators();
      if (!silent && res && res.error) showToast(res.error, "error");
      return false;
    }

    /**
     * Helper mutasi terpadu ke Google Drive + pemicu auto-backup untuk Admin/Asisten.
     */
    async function mutateDrive(action, payload, { successMsg = "", triggerAutoBackup = true } = {}) {
      ui.connState = "syncing";
      updateLiveConnectionIndicators();

      const res = await callGas(action, payload);
      if (!res || !res.ok) {
        ui.connState = res?.isNetworkError ? "offline" : "online";
        updateLiveConnectionIndicators();
        showToast(res?.error || "Gagal menyimpan perubahan ke Google Drive.", "error");
        return null;
      }

      if (res.state) {
        saveState(res.state, res.serverTime);
      }
      ui.isOffline = false;
      ui.connState = "online";
      updateLiveConnectionIndicators();

      if (successMsg) showToast(successMsg, "success");
      if (triggerAutoBackup) scheduleRealtimeAutoBackup();
      return res;
    }

    // ========================================================================
    // 5. WHATSAPP-STYLE AUTO-BACKUP ENGINE (ADMIN & ASISTEN)
    // ========================================================================
    function canTriggerAutoBackup(u = currentUser()) {
      return Boolean(u && (u.role === "admin" || u.role === "asisten"));
    }

    function scheduleRealtimeAutoBackup() {
      if (!session || !canTriggerAutoBackup(session.user)) return;
      if (backupFreq !== "realtime") return;
      clearTimeout(autoBackupTimer);
      autoBackupTimer = setTimeout(() => {
        runDriveBackup({ silent: true });
      }, AUTO_BACKUP_DEBOUNCE_MS);
    }

    function checkScheduledAutoBackup() {
      if (!session || !canTriggerAutoBackup(session.user)) return;
      if (backupFreq !== "daily" && backupFreq !== "weekly") return;
      if (typeof navigator !== "undefined" && !navigator.onLine) return;

      const intervalMs = backupFreq === "daily" ? 24 * 3600 * 1000 : 7 * 24 * 3600 * 1000;
      const lastMs = backupMeta.lastBackupAt ? new Date(backupMeta.lastBackupAt).getTime() : 0;
      if (!lastMs || Date.now() - lastMs >= intervalMs) {
        runDriveBackup({ silent: true });
      }
    }

    async function runDriveBackup({ silent = false } = {}) {
      if (!session || ui.isBackingUp) return;
      if (typeof navigator !== "undefined" && !navigator.onLine) {
        if (!silent) showToast("Tidak bisa mencadangkan saat perangkat sedang offline.", "error");
        return;
      }

      ui.isBackingUp = true;
      ui.connState = "syncing";
      if (ui.activeTab === "profil") render();
      else updateLiveConnectionIndicators();

      const res = await callGas("backupNow", {});
      ui.isBackingUp = false;

      if (res && res.ok && res.backupInfo) {
        backupMeta.lastBackupAt = res.backupInfo.backedUpAt || new Date().toISOString();
        backupMeta.lastBackupFileName = res.backupInfo.fileName || "backup_labkom.json";
        backupMeta.lastBackupSizeBytes = res.backupInfo.sizeBytes || getLocalCacheSizeBytes();
        saveBackupMeta();
        ui.connState = "online";
        if (!silent) {
          showToast(`Cadangan berhasil disimpan ke Google Drive (${backupMeta.lastBackupFileName})`, "success");
        }
      } else {
        ui.connState = res?.isNetworkError ? "offline" : "online";
        if (!silent) showToast(res?.error || "Gagal membuat cadangan di Google Drive.", "error");
      }

      if (ui.activeTab === "profil") render();
      else updateLiveConnectionIndicators();
    }

    async function runRestoreFromDrive() {
      if (!session || !isAdmin(session.user)) {
        showToast("Hanya Admin yang dapat memulihkan cadangan Google Drive.", "error");
        return;
      }
      ui.connState = "syncing";
      updateLiveConnectionIndicators();
      showToast("Memulihkan cadangan terbaru dari Google Drive...", "info");

      const res = await callGas("restoreBackup", {});
      if (res && res.ok && res.state) {
        saveState(res.state, new Date().toISOString());
        ui.connState = "online";
        showToast(`Database dipulihkan dari ${res.restoredFrom || "cadangan terbaru"}!`, "success");
        render();
      } else {
        ui.connState = res?.isNetworkError ? "offline" : "online";
        updateLiveConnectionIndicators();
        showToast(res?.error || "Gagal memulihkan cadangan dari Google Drive.", "error");
      }
    }

    // ========================================================================
    // 6. ROLE, DATA & FILE HELPERS
    // ========================================================================
    function currentUser() {
      return session?.user || null;
    }

    function isAdmin(u = currentUser()) {
      return Boolean(u && u.role === "admin");
    }

    function isDualRoleAdmin(u = currentUser()) {
      return Boolean(u && u.role === "admin" && u.isAsisten === true);
    }

    function canTeach(u = currentUser()) {
      return Boolean(u && (u.role === "asisten" || (u.role === "admin" && u.isAsisten === true)));
    }

    function getTaughtClasses(userId) {
      return db.classes.filter((c) => Array.isArray(c.assistantIds) && c.assistantIds.includes(userId));
    }

    function getEnrolledClasses(userId) {
      return db.classes.filter((c) => Array.isArray(c.studentIds) && c.studentIds.includes(userId));
    }

    function getRoleLabel(role, isAsisten) {
      if (role === "admin") return isAsisten ? "Admin+Asisten" : "Admin";
      if (role === "asisten") return "Asisten";
      return "Praktikan";
    }

    function getUserClassLabel(u) {
      if (!u) return "-";
      if (u.role === "praktikan") {
        const list = getEnrolledClasses(u.id).map((c) => c.name);
        return list.length ? list.join(", ") : "Belum terdaftar di kelas";
      }
      const taught = getTaughtClasses(u.id).map((c) => c.name);
      if (taught.length) return "Pengampu " + taught.join(", ");
      return u.role === "admin" ? "Administrator Lab" : "Belum ditugaskan";
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDate(isoStr, withTime = false) {
      if (!isoStr) return "-";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return "-";
      return withTime
        ? d.toLocaleString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
        : d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
    }

    function formatKB(bytes) {
      if (!bytes || bytes <= 0) return "0.0 KB";
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function validateUploadFile(file) {
      if (!file) return "Pilih file terlebih dahulu.";
      if (file.size > MAX_FILE_SIZE) {
        return `Ukuran file terlalu besar (${(file.size / 1024 / 1024).toFixed(2)} MB). Maksimal 5 MB.`;
      }
      const lower = file.name.toLowerCase();
      if (!ALLOWED_EXT.some((ext) => lower.endsWith(ext))) {
        return `Format tidak didukung. Gunakan: ${ALLOWED_EXT.join(", ")}`;
      }
      return null;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const str = String(reader.result || "");
          const comma = str.indexOf(",");
          resolve(comma >= 0 ? str.slice(comma + 1) : str);
        };
        reader.onerror = () => reject(new Error("Gagal membaca file dari perangkat."));
        reader.readAsDataURL(file);
      });
    }

    /**
     * Resize thumbnail artikel di sisi klien (lebar maks 640px JPEG)
     * agar database Google Drive tetap cepat dan ringan.
     */
    function resizeThumbnailToJpeg(file, maxWidth = 640, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("File yang dipilih bukan gambar valid."));
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = String(reader.result || "");
        };
        reader.readAsDataURL(file);
      });
    }

    function openDriveDownload(fileUrl, fileId) {
      const url = fileUrl || (fileId ? `https://drive.google.com/uc?export=download&id=${encodeURIComponent(fileId)}` : "");
      if (!url) {
        showToast("Tautan unduhan file belum tersedia.", "error");
        return;
      }
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function triggerDownloadBlob(blob, filename) {
      if (typeof window.saveAs === "function") {
        window.saveAs(blob, filename);
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    function copyTextSafe(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
      } catch {
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
      }
      document.body.removeChild(ta);
    }

    function buildGradeMatrix(classId) {
      const cls = db.classes.find((c) => c.id === classId);
      const studentIds = Array.isArray(cls?.studentIds) ? cls.studentIds : [];
      const students = db.users
        .filter((u) => studentIds.includes(u.id))
        .sort((a, b) => a.username.localeCompare(b.username));
      const assignments = db.assignments
        .filter((a) => a.classId === classId)
        .sort((a, b) => new Date(a.releaseAt) - new Date(b.releaseAt));

      const rows = students.map((st, idx) => {
        const scores = {};
        const valid = [];
        assignments.forEach((asg) => {
          const g = db.grades.find(
            (gr) => gr.classId === classId && gr.studentId === st.id && gr.assignmentId === asg.id
          );
          if (g !== undefined) {
            scores[asg.id] = Number(g.score);
            valid.push(Number(g.score));
          } else {
            scores[asg.id] = null;
          }
        });
        const avg = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
        return {
          no: idx + 1,
          nim: st.username,
          fullName: st.fullName,
          scores,
          average: avg
        };
      });

      return {
        className: cls ? cls.name : "Kelas",
        courseName: cls ? cls.courseName || "" : "",
        assignments,
        rows
      };
    }

    function exportExcel(matrix) {
      try {
        if (typeof XLSX === "undefined") {
          showToast("Library Excel (SheetJS) belum termuat.", "error");
          return;
        }
        const headers = ["No", "NIM / ID", "Nama Praktikan", ...matrix.assignments.map((a) => a.title), "Rata-rata"];
        const body = matrix.rows.map((r) => [
          r.no,
          r.nim,
          r.fullName,
          ...matrix.assignments.map((a) => (r.scores[a.id] !== null ? r.scores[a.id] : "-")),
          r.average !== null ? Number(r.average.toFixed(1)) : "-"
        ]);
        const ws = XLSX.utils.aoa_to_sheet([
          ["REKAPITULASI NILAI LABORATORIUM KOMPUTER (LABKOM)"],
          [`Kelas: ${matrix.className} (${matrix.courseName})`, "", `Total Praktikan: ${matrix.rows.length}`],
          [],
          headers,
          ...body
        ]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rekap Nilai");
        const slug = matrix.className.toLowerCase().replace(/[^a-z0-9]+/g, "_");
        XLSX.writeFile(wb, `Rekap_Nilai_${slug}.xlsx`);

    async function exportWord(matrix) {
      const slug = matrix.className.toLowerCase().replace(/[^a-z0-9]+/g, "_");
      const headers = ["No", "NIM / ID", "Nama Praktikan", ...matrix.assignments.map((a) => a.title), "Rata-rata"];
      const body = matrix.rows.map((r) => [
        String(r.no),
        r.nim,
        r.fullName,
        ...matrix.assignments.map((a) => (r.scores[a.id] !== null ? String(r.scores[a.id]) : "-")),
        r.average !== null ? r.average.toFixed(1) : "-"
      ]);

      try {
        if (window.docx && window.docx.Document && window.docx.Packer) {
          const { Document, Packer, Paragraph, Table, TableCell, TableRow, TextRun, WidthType, AlignmentType } = window.docx;
          const headerRow = new TableRow({
            tableHeader: true,
            children: headers.map(
              (h) =>
                new TableCell({
                  shading: { fill: "0F172A" },
                  children: [
                    new Paragraph({
                      alignment: AlignmentType.CENTER,
                      children: [new TextRun({ text: h, bold: true, color: "FFFFFF", size: 18 })]
                    })
                  ]
                })
            )
          });
          const dataRows = body.map(
            (row) =>
              new TableRow({
                children: row.map(
                  (val, idx) =>
                    new TableCell({
                      children: [
                        new Paragraph({
                          alignment: idx === 2 ? AlignmentType.LEFT : AlignmentType.CENTER,
                          children: [new TextRun({ text: val, size: 18 })]
                        })
                      ]
                    })
                )
              })
          );
          const doc = new Document({
            sections: [
              {
                children: [
                  new Paragraph({
                    alignment: AlignmentType.CENTER,
                    children: [new TextRun({ text: "LAPORAN REKAPITULASI NILAI PRAKTIKUM", bold: true, size: 28 })]
                  }),
                  new Paragraph({
                    alignment: AlignmentType.CENTER,
                    spacing: { after: 260 },
                    children: [
                      new TextRun({
                        text: `Laboratorium Komputer • Kelas: ${matrix.className} (${matrix.courseName}) • Total: ${matrix.rows.length} Praktikan`,
                        size: 20,
                        color: "475569"
                      })
                    ]
                  }),
                  new Table({
                    width: { size: 100, type: WidthType.PERCENTAGE },
                    rows: [headerRow, ...dataRows]
                  })
                ]
              }
            ]
          });
          const blob = await Packer.toBlob(doc);
          triggerDownloadBlob(blob, `Rekap_Nilai_${slug}.docx`);
          showToast("Laporan Word (.docx) berhasil diunduh!", "success");
          return;
        }
      } catch {}

      const htmlDoc = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>Rekap Nilai Labkom</title>
        <style>body{font-family:Calibri,Arial,sans-serif;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #334155;padding:6px;font-size:11pt;}th{background:#0f172a;color:#fff;}</style>
        </head><body>
        <h2 style="text-align:center;">LAPORAN REKAPITULASI NILAI LABORATORIUM KOMPUTER</h2>
        <p style="text-align:center;">Kelas: ${esc(matrix.className)} (${esc(matrix.courseName)}) | Total Praktikan: ${matrix.rows.length}</p>
        <table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
        </body></html>`;
      triggerDownloadBlob(new Blob(["\ufeff", htmlDoc], { type: "application/msword" }), `Rekap_Nilai_${slug}.docx`);
      showToast("Laporan Word (.docx) berhasil diunduh!", "success");
    }

    function exportPdf(matrix) {
      try {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          showToast("Library PDF (jsPDF) belum termuat.", "error");

        }

        const body = matrix.rows.map((r) => [
          String(r.no),

        ]);

        doc.setFontSize(14);
        doc.text("REKAPITULASI NILAI LABORATORIUM KOMPUTER (LABKOM)", 14, 15);
        doc.setFontSize(10);

    function bindLoginEvents() {
      const form = document.getElementById("auth-form");
      const errBox = document.getElementById("auth-error");

      const showAuthError = (msg) => {
        errBox.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i><span>${esc(msg)}</span>`;
        errBox.classList.remove("hidden");
        lucide.createIcons();
      };

      document.getElementById("btn-toggle-pass")?.addEventListener("click", () => {
        ui.showPassword = !ui.showPassword;
        const inp = document.getElementById("inp-password");
        if (inp) inp.type = ui.showPassword ? "text" : "password";
        const btn = document.getElementById("btn-toggle-pass");
        if (btn) {
          btn.innerHTML = `<i data-lucide="${ui.showPassword ? "eye-off" : "eye"}" class="w-4 h-4"></i>`;
          lucide.createIcons();
        }
      });

      document.getElementById("btn-switch-auth-mode")?.addEventListener("click", () => {
        ui.loginMode = ui.loginMode === "login" ? "register" : "login";
        render();
      });

      document.querySelectorAll("[data-autofill]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const uname = btn.getAttribute("data-autofill");
          const uInp = document.getElementById("inp-username");
          const pInp = document.getElementById("inp-password");
          if (uInp) uInp.value = uname;
          if (pInp) pInp.value = "123456";
          showToast(`Form diisi dengan akun "${uname}". Ketuk Login untuk masuk.`, "info");
        });
      });

      document.getElementById("btn-forgot-pass")?.addEventListener("click", () => {
        openModal(
          "Bantuan Lupa Password",
          `<div class="space-y-3 text-xs text-slate-600 leading-relaxed">
            <p>Demi keamanan data praktikum, reset password hanya dapat dilakukan oleh <strong>Admin Laboratorium Komputer</strong>.</p>
            <p>Silakan hubungi Koordinator Labkom atau Asisten kelas Anda dengan menyertakan <strong>NIM/ID</strong> dan <strong>Nama Lengkap</strong>.</p>
            <button type="button" data-close-modal class="w-full py-2.5 bg-slate-900 text-white rounded-xl font-semibold">Mengerti</button>
          </div>`
        );
      });

      form?.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (ui.isSubmittingAuth) return; // Anti klik ganda
        errBox.classList.add("hidden");

        const cleanUser = document.getElementById("inp-username").value.trim().toLowerCase().replace(/\s+/g, "");
        const password = document.getElementById("inp-password").value;
        const fullName = ui.loginMode === "register" ? document.getElementById("inp-fullname").value.trim() : "";

        if (cleanUser.length < 3) {
          showAuthError("ID/Username (NIM) minimal 3 karakter tanpa spasi.");
          return;
        }
        if (password.length < 6) {
          showAuthError("Password minimal harus terdiri dari 6 karakter.");
          return;
        }
        if (ui.loginMode === "register" && fullName.length < 2) {
          showAuthError("Nama lengkap wajib diisi.");
          return;
        }

        ui.isSubmittingAuth = true;
        const btn = document.getElementById("btn-auth-submit");
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Memproses...</span>`;
        lucide.createIcons();

        const action = ui.loginMode === "register" ? "register" : "login";
        const payload =
          action === "register"
            ? { username: cleanUser, fullName, password }
            : { username: cleanUser, password };

        const res = await callGas(action, payload);
        ui.isSubmittingAuth = false;

        if (!res || !res.ok) {
          btn.disabled = false;
          btn.innerHTML = `<span>${ui.loginMode === "register" ? "Daftar Praktikan" : "Login"}</span>`;
          if (res?.isNetworkError) {
            showAuthError("Koneksi ke Google Drive terputus atau jaringan sedang offline. Periksa internet Anda lalu coba lagi.");
          } else {
            showAuthError(res?.error || "ID/Username atau Password salah. Periksa kembali penulisan NIM/ID Anda.");
          }
          return;
        }

        saveSession({ token: res.token, user: res.user });
        if (res.state) saveState(res.state, res.serverTime || new Date().toISOString());

        ui.activeTab = "artikel";
        ui.articleDetailId = null;
        ui.loginMode = "login";
        ui.selectedKelasId = "";
        ui.selectedNilaiClassId = "";
        ui.connState = "online";
        ui.isOffline = false;

        showToast(`Selamat datang, ${res.user.fullName} (${getRoleLabel(res.user.role, res.user.isAsisten)})!`, "success");
        render();
        checkScheduledAutoBackup();
      });
    }

    // --- MENU PENGUMUMAN ---
    function renderPengumumanView(user) {
      const enrolledIds = getEnrolledClasses(user.id).map((c) => c.id);
      const taughtIds = getTaughtClasses(user.id).map((c) => c.id);

      const list = db.announcements
        .filter((ann) => {
          if (ann.scope !== ui.announcementTab) return false;
          if (ann.scope === "global") return true;
          if (isAdmin(user) && !isDualRoleAdmin(user)) return true;
          if (user.role === "praktikan") return enrolledIds.includes(ann.classId);
          return taughtIds.includes(ann.classId) || isAdmin(user);
        })
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      return `

                          <div class="flex items-start gap-2.5 min-w-0">
                            <div class="w-8 h-8 rounded-xl ${ann.scope === "global" ? "bg-blue-50 text-blue-600" : "bg-indigo-50 text-indigo-600"} flex items-center justify-center shrink-0 mt-0.5">

    // --- MENU TUGAS (GOOGLE CLASSROOM STYLE) ---
    function renderTugasView(user) {
      const now = Date.now();
      const enrolledIds = getEnrolledClasses(user.id).map((c) => c.id);
      const taughtIds = getTaughtClasses(user.id).map((c) => c.id);

      const visibleAssignments = db.assignments
        .filter((asg) => {
          if (isAdmin(user)) return true;
          if (user.role === "asisten") return taughtIds.includes(asg.classId);
          return enrolledIds.includes(asg.classId) && new Date(asg.releaseAt).getTime() <= now;
        })
        .sort((a, b) => new Date(b.releaseAt) - new Date(a.releaseAt));

      return visibleAssignments.length === 0
        ? `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
            Belum ada tugas yang dirilis untuk kelas Anda.
           </div>`
        : `<div class="space-y-3.5">
            ${visibleAssignments
              .map((asg) => {
                const cls = db.classes.find((c) => c.id === asg.classId);
                const isFuture = new Date(asg.releaseAt).getTime() > now;
                const mySub =
                  user.role === "praktikan"
                    ? db.submissions.find((s) => s.assignmentId === asg.id && s.studentId === user.id)
                    : null;
                const totalSubs = db.submissions.filter((s) => s.assignmentId === asg.id).length;
                const isUploading = ui.uploadingAssignmentId === asg.id;

                return `
                  <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div class="flex items-start gap-3">
                      <div class="w-10 h-10 rounded-xl bg-blue-600/10 text-blue-600 flex items-center justify-center shrink-0">
                        <i data-lucide="clipboard-list" class="w-5 h-5"></i>
                      </div>
                      <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-1.5">
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700">${esc(cls ? cls.name : "-")}</span>
                          ${
                            isFuture
                              ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 flex items-center gap-1">
                                  <i data-lucide="calendar-clock" class="w-3 h-3"></i> Terjadwal
                                 </span>`
                              : ""
                          }
                          ${
                            user.role === "praktikan"
                              ? mySub
                                ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 flex items-center gap-1">
                                    <i data-lucide="check-circle-2" class="w-3 h-3"></i> Sudah Dikumpulkan
                                   </span>`
                                : `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 flex items-center gap-1">
                                    <i data-lucide="clock" class="w-3 h-3"></i> Belum Dikumpulkan
                                   </span>`
                              : `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700">${totalSubs} Terkumpul</span>`
                          }
                        </div>

                        <h3 class="font-bold text-sm text-slate-900 mt-1.5">${esc(asg.title)}</h3>
                        <p class="text-xs text-slate-600 mt-1 whitespace-pre-line leading-relaxed">${esc(asg.description)}</p>

                        <div class="mt-2.5 text-[11px] text-slate-500 space-y-0.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                          <div class="flex items-center gap-1.5">
                            <i data-lucide="calendar" class="w-3 h-3 text-slate-400"></i>
                            <span>Rilis: <strong>${formatDate(asg.releaseAt, true)}</strong></span>
                          </div>
                          ${
                            asg.dueAt
                              ? `<div class="flex items-center gap-1.5 text-rose-600">
                                  <i data-lucide="alarm-clock" class="w-3 h-3"></i>
                                  <span>Tenggat: <strong>${formatDate(asg.dueAt, true)}</strong></span>
                                 </div>`
                              : ""
                          }
                        </div>

                        <div class="mt-3 flex flex-wrap gap-2">
                          ${
                            asg.fileUrl || asg.fileId
                              ? `<button type="button" data-dl-material="${esc(asg.id)}" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold">
                                  <i data-lucide="download" class="w-3.5 h-3.5"></i> Download Soal
                                 </button>`
                              : ""
                          }
                          ${
                            user.role === "praktikan"
                              ? `<label class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold cursor-pointer ${isUploading ? "opacity-60 pointer-events-none" : ""}">
                                  <i data-lucide="${isUploading ? "loader-2" : "upload"}" class="w-3.5 h-3.5 ${isUploading ? "animate-spin" : ""}"></i>
                                  <span>${isUploading ? "Mengunggah..." : mySub ? "Ganti File Tugas" : "Upload Tugas"}</span>
                                  <input type="file" data-upload-sub="${esc(asg.id)}" accept="${ALLOWED_EXT.join(",")}" class="hidden" ${isUploading ? "disabled" : ""} />
                                 </label>`
                              : ""
                          }
                        </div>

                        ${
                          mySub
                            ? `<div class="mt-2.5 p-2 rounded-lg bg-emerald-50 border border-emerald-100 text-[11px] text-emerald-800 flex items-center justify-between gap-2">
                                <span class="truncate"><strong>Terkirim:</strong> ${esc(mySub.fileName)} (${formatKB(mySub.fileSize)})</span>
                                ${
                                  mySub.fileUrl || mySub.fileId
                                    ? `<button type="button" data-dl-sub="${esc(mySub.id)}" class="text-emerald-700 font-bold underline shrink-0">Unduh</button>`
                                    : ""
                                }
                               </div>`
                            : ""
                        }
                      </div>
                    </div>
                  </div>
                `;
              })
              .join("")}
          </div>`;
    }

    // --- MENU KELAS (ASISTEN & DUAL-ROLE ADMIN) ---
    function renderKelasView(user) {
      const taught = getTaughtClasses(user.id);
      if (taught.length === 0) {
        return `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
          Anda belum ditugaskan mengampu kelas mana pun.${isAdmin(user) ? " Pilih kelas yang Anda ajar di menu <strong>Asisten</strong>." : " Hubungi Admin Labkom."}
        </div>`;
      }

      if (!ui.selectedKelasId || !taught.some((c) => c.id === ui.selectedKelasId)) {
        ui.selectedKelasId = taught[0].id;
      }

      const activeClass = taught.find((c) => c.id === ui.selectedKelasId);
      const studentIds = Array.isArray(activeClass.studentIds) ? activeClass.studentIds : [];
      const students = db.users
        .filter((u) => studentIds.includes(u.id))
        .sort((a, b) => a.username.localeCompare(b.username));
      const classAsgIds = db.assignments.filter((a) => a.classId === activeClass.id).map((a) => a.id);

      return `
        ${
          isDualRoleAdmin(user)
            ? `<div class="mb-3 flex items-center justify-between bg-indigo-50 border border-indigo-200 rounded-xl px-3.5 py-2.5 text-xs text-indigo-800">
                <span class="font-semibold">Mode Dual-Role Admin+Asisten</span>
                <button type="button" data-nav="nilai" class="font-bold underline">Kembali ke Nilai</button>
               </div>`
            : ""
        }

        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Kelas yang Diampu</label>
        <select id="sel-kelas-asisten" class="w-full mb-4 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
          ${taught
            .map(
              (c) => `<option value="${esc(c.id)}" ${c.id === activeClass.id ? "selected" : ""}>${esc(c.name)} — ${esc(c.courseName || "")}</option>`
            )
            .join("")}
        </select>

        <div class="flex items-center justify-between mb-2.5 text-xs text-slate-600">
          <span>Daftar Praktikan: <strong>${students.length} orang</strong></span>
          <span class="text-[11px] text-slate-400">Ketuk nama untuk menilai</span>
        </div>

        ${
          students.length === 0
            ? `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
                Belum ada praktikan di kelas ini. Klik tombol <strong>+ Praktikan</strong> di pojok kanan atas.
               </div>`
            : `<div class="space-y-2.5">
                ${students
                  .map((st) => {
                    const subCount = db.submissions.filter(
                      (s) => s.studentId === st.id && classAsgIds.includes(s.assignmentId)
                    ).length;
                    const gradedCount = db.grades.filter(
                      (g) => g.studentId === st.id && g.classId === activeClass.id
                    ).length;
                    return `
                      <div class="bg-white rounded-2xl border border-slate-200 px-3.5 py-3 flex items-center justify-between gap-2 shadow-sm hover:border-blue-300 transition">
                        <button type="button" data-open-student="${esc(st.id)}" class="flex-1 flex items-center gap-3 text-left min-w-0">
                          <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 font-bold text-sm flex items-center justify-center shrink-0">
                            ${esc((st.fullName || "P").charAt(0).toUpperCase())}
                          </div>
                          <div class="min-w-0 flex-1">
                            <div class="font-bold text-sm text-slate-900 truncate">${esc(st.fullName)}</div>
                            <div class="text-[11px] text-slate-500 flex items-center gap-1.5 mt-0.5">
                              <span class="font-mono">NIM: ${esc(st.username)}</span>
                              <span>•</span>
                              <span class="text-blue-600 font-medium">${subCount} tugas (${gradedCount} dinilai)</span>
                            </div>
                          </div>
                          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 shrink-0"></i>
                        </button>
                        <button type="button" data-remove-student="${esc(st.id)}" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl shrink-0" aria-label="Hapus praktikan">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </div>
                    `;
                  })
                  .join("")}
              </div>`
        }
      `;
    }

    // --- MENU NILAI (REKAP REAL-TIME + EXPORT + DUAL-ROLE SHORTCUT) ---
    function renderNilaiView(user) {
      const availableClasses = isAdmin(user) ? db.classes : getTaughtClasses(user.id);
      if (availableClasses.length === 0) {
        return `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
          Belum ada kelas yang tersedia untuk rekapitulasi nilai.
        </div>`;
      }

      if (!ui.selectedNilaiClassId || !availableClasses.some((c) => c.id === ui.selectedNilaiClassId)) {
        ui.selectedNilaiClassId = availableClasses[0].id;
      }

      const matrix = buildGradeMatrix(ui.selectedNilaiClassId);
      const dualAdmin = isDualRoleAdmin(user);

      return `
        ${
          dualAdmin
            ? `<button type="button" id="btn-dualrole-kelas" class="mb-3.5 w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white text-xs font-bold flex items-center justify-center gap-2 shadow-md shadow-indigo-600/20 transition">
                <i data-lucide="users" class="w-4 h-4"></i>
                <span>Mode Asisten: Kelola Praktikan & Input Nilai Kelas Saya</span>
               </button>`
            : ""
        }

        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Filter Kelas</label>
        <select id="sel-kelas-nilai" class="w-full mb-3.5 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
          ${availableClasses
            .map(
              (c) => `<option value="${esc(c.id)}" ${c.id === ui.selectedNilaiClassId ? "selected" : ""}>${esc(c.name)} — ${esc(c.courseName || "")}</option>`
            )
            .join("")}
        </select>

        <!-- 3 Tombol Export Client-Side -->
        <div class="grid grid-cols-3 gap-2 mb-4">
          <button type="button" id="btn-export-xlsx" class="py-2.5 px-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel
          </button>
          <button type="button" id="btn-export-docx" class="py-2.5 px-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
            <i data-lucide="file-text" class="w-4 h-4"></i> Word
          </button>
          <button type="button" id="btn-export-pdf" class="py-2.5 px-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
            <i data-lucide="file-down" class="w-4 h-4"></i> PDF
          </button>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600">
            <span>Kelas: <strong class="text-slate-900">${esc(matrix.className)}</strong></span>
            <span class="px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-bold text-[11px]">${matrix.rows.length} Praktikan</span>
          </div>

          ${
            matrix.rows.length === 0
              ? `<div class="p-8 text-center text-xs text-slate-500">Belum ada praktikan terdaftar pada kelas ini.</div>`
              : `<div class="overflow-x-auto app-scroll">
                  <table class="w-full text-xs text-left">
                    <thead class="bg-slate-900 text-white">
                      <tr>
                        <th class="px-3 py-2.5 font-semibold">No</th>
                        <th class="px-3 py-2.5 font-semibold">NIM</th>
                        <th class="px-3 py-2.5 font-semibold">Nama Praktikan</th>
                        ${matrix.assignments
                          .map((a, i) => `<th class="px-3 py-2.5 font-semibold text-center whitespace-nowrap" title="${esc(a.title)}">T${i + 1}</th>`)
                          .join("")}
                        <th class="px-3 py-2.5 font-semibold text-center">Rata²</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${matrix.rows
                        .map(
                          (r) => `
                            <tr class="hover:bg-slate-50">
                              <td class="px-3 py-2.5 text-slate-500">${r.no}</td>
                              <td class="px-3 py-2.5 font-mono text-slate-700">${esc(r.nim)}</td>
                              <td class="px-3 py-2.5 font-semibold text-slate-900 whitespace-nowrap">${esc(r.fullName)}</td>
                              ${matrix.assignments
                                .map(
                                  (a) => `<td class="px-3 py-2.5 text-center ${r.scores[a.id] !== null ? "font-semibold text-slate-800" : "text-slate-400"}">
                                    ${r.scores[a.id] !== null ? r.scores[a.id] : "-"}
                                  </td>`

                                .join("")}
                              <td class="px-3 py-2.5 text-center font-extrabold text-blue-700">

          ${
            matrix.assignments.length > 0
              ? `<div class="px-4 py-2.5 bg-slate-50 border-t border-slate-100 text-[10px] text-slate-500 space-y-0.5">
                  <div class="font-bold text-slate-600 mb-1">Keterangan Kolom Tugas:</div>
                  ${matrix.assignments.map((a, i) => `<div><strong>T${i + 1}:</strong> ${esc(a.title)}</div>`).join("")}

      `;

                                const active = Array.isArray(c.assistantIds) && c.assistantIds.includes(p.id);
                                return `
                                  <button type="button" data-toggle-class="${esc(p.id)}::${esc(c.id)}" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition flex items-center gap-1 ${
                                    active
                                      ? "bg-blue-600 text-white border-blue-600 shadow-sm"
                                      : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"
                                  }">
                                    <i data-lucide="${active ? "check" : "plus"}" class="w-3 h-3"></i>
                                    ${esc(c.name)}
                                  </button>
                                `;
                              })
                              .join("")}
                          </div>
                         </div>`
                      : `<p class="mt-2.5 text-[11px] text-slate-400 italic">Aktifkan Dual-Role di atas untuk menugaskan kelas ke akun Admin ini.</p>`
                  }
                </div>
              `;
            })
            .join("")}
        </div>
      `;
    }

    // ========================================================================
    // 13. EVENT BINDING SEMUA MENU
    // ========================================================================
    function bindAppEvents(user) {
      document.querySelectorAll("[data-nav]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.activeTab = btn.getAttribute("data-nav");
          ui.articleDetailId = null;
          render();
        });
      });

      document.getElementById("btn-header-sync")?.addEventListener("click", () => {
        syncWithDrive({ silent: false });
      });

      document.getElementById("btn-back-artikel")?.addEventListener("click", () => {
        ui.articleDetailId = null;
        render();
      });

      document.getElementById("btn-logout-trigger")?.addEventListener("click", () => {
        openConfirm({
          title: "Konfirmasi Logout",
          message: "Apakah Anda yakin ingin keluar dari akun Laboratorium Komputer?",
          confirmLabel: "Ya, Logout",
          danger: true,
          onConfirm: () => {
            saveSession(null);
            ui.activeTab = "artikel";
            ui.articleDetailId = null;
            showToast("Anda telah keluar dari akun.", "info");
            render();
            pingDrive();
          }
        });
      });

      // --- ARTIKEL ---
      const searchInp = document.getElementById("inp-article-search");
      if (searchInp) {
        searchInp.addEventListener("input", (e) => {
          const val = e.target.value;
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            ui.articleSearch = val;
            render();
            const restored = document.getElementById("inp-article-search");
            if (restored) {
              restored.focus();
              restored.setSelectionRange(val.length, val.length);
            }
          }, 280);
        });
      }

      document.getElementById("btn-sort-article")?.addEventListener("click", () => {
        ui.articleSort = ui.articleSort === "desc" ? "asc" : "desc";
        render();
      });

      document.querySelectorAll("[data-open-article]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.articleDetailId = btn.getAttribute("data-open-article");
          render();
        });
      });

      document.getElementById("btn-new-article")?.addEventListener("click", openNewArticleModal);

      document.querySelectorAll("[data-del-article]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-article");
          openConfirm({
            title: "Hapus Artikel?",
            message: "Artikel beserta seluruh komentar akan dihapus permanen dari Google Drive.",
            confirmLabel: "Hapus",
            onConfirm: async () => {
              const res = await mutateDrive("deleteArticle", { id }, { successMsg: "Artikel berhasil dihapus." });
              if (res) render();
            }
          });
        });
      });

      document.getElementById("btn-like-article")?.addEventListener("click", async () => {
        const articleId = ui.articleDetailId;
        const art = db.articles.find((a) => a.id === articleId);
        if (art) {
          art.likes = Array.isArray(art.likes) ? art.likes : [];
          const idx = art.likes.indexOf(user.id);
          if (idx >= 0) art.likes.splice(idx, 1);
          else art.likes.push(user.id);
          render();
        }
        const res = await mutateDrive("toggleLike", { articleId }, { triggerAutoBackup: false });
        if (res) render();
      });

      document.getElementById("btn-share-article")?.addEventListener("click", async () => {
        const art = db.articles.find((a) => a.id === ui.articleDetailId);
        const shareUrl = `${window.location.origin}${window.location.pathname}#artikel-${ui.articleDetailId}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: art?.title || "Artikel Labkom", url: shareUrl });
            return;
          } catch {}
        }
        copyTextSafe(shareUrl);
        showToast("Link artikel berhasil disalin!", "success");
      });

      document.getElementById("form-comment")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const inp = document.getElementById("inp-comment");
        const btn = document.getElementById("btn-send-comment");
        const content = inp.value.trim();
        if (!content) return;
        btn.disabled = true;
        const res = await mutateDrive(
          "addComment",
          { articleId: ui.articleDetailId, content },
          { successMsg: "Komentar terkirim!", triggerAutoBackup: false }
        );
        if (res) {
          inp.value = "";
          render();
        } else {
          btn.disabled = false;
        }
      });

      // --- PENGUMUMAN ---
      document.querySelectorAll("[data-ann-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.announcementTab = btn.getAttribute("data-ann-tab");
          render();
        });
      });

      document.getElementById("btn-new-announcement")?.addEventListener("click", () => openNewAnnouncementModal(user));

      document.querySelectorAll("[data-del-ann]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-ann");
          openConfirm({
            title: "Hapus Pengumuman?",
            message: "Pengumuman ini akan dihapus permanen dari Google Drive.",
            confirmLabel: "Hapus",
            onConfirm: async () => {
              const res = await mutateDrive("deleteAnnouncement", { id }, { successMsg: "Pengumuman berhasil dihapus." });
              if (res) render();
            }
          });
        });
      });

      // --- TUGAS ---
      document.getElementById("btn-new-assignment")?.addEventListener("click", openNewAssignmentModal);

      document.querySelectorAll("[data-dl-material]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const asg = db.assignments.find((a) => a.id === btn.getAttribute("data-dl-material"));
          if (asg) openDriveDownload(asg.fileUrl, asg.fileId);
        });
      });

      document.querySelectorAll("[data-dl-sub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const sub = db.submissions.find((s) => s.id === btn.getAttribute("data-dl-sub"));
          if (sub) openDriveDownload(sub.fileUrl, sub.fileId);
        });
      });

      document.querySelectorAll("[data-upload-sub]").forEach((inp) => {
        inp.addEventListener("change", async (e) => {
          const file = e.target.files?.[0];
          const assignmentId = inp.getAttribute("data-upload-sub");
          e.target.value = "";
          if (!file) return;

          const err = validateUploadFile(file);
          if (err) {
            showToast(err, "error");
            return;
          }

          ui.uploadingAssignmentId = assignmentId;
          render();
          showToast(`Mengunggah ${file.name} ke Google Drive...`, "info");

          try {
            const fileBase64 = await fileToBase64(file);
            await mutateDrive(
              "submitAssignment",
              {
                assignmentId,
                fileName: file.name,
                fileSize: file.size,
                fileBase64,
                fileType: file.type || "application/octet-stream"
              },
              { successMsg: "Tugas berhasil dikumpulkan ke Google Drive!", triggerAutoBackup: false }
            );
          } catch (readErr) {
            showToast(readErr.message || "Gagal membaca file.", "error");
          } finally {
            ui.uploadingAssignmentId = null;
            render();
          }
        });
      });

      // --- KELAS ---
      document.getElementById("sel-kelas-asisten")?.addEventListener("change", (e) => {
        ui.selectedKelasId = e.target.value;
        render();
      });

      document.getElementById("btn-add-student")?.addEventListener("click", openAddStudentModal);

      document.querySelectorAll("[data-remove-student]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const studentId = btn.getAttribute("data-remove-student");
          const st = db.users.find((u) => u.id === studentId);
          openConfirm({
            title: "Keluarkan Praktikan?",
            message: `Keluarkan ${st ? st.fullName : "praktikan ini"} dari kelas ini?`,
            confirmLabel: "Keluarkan",
            onConfirm: async () => {
              const res = await mutateDrive(
                "removeStudentFromClass",
                { classId: ui.selectedKelasId, studentId },
                { successMsg: "Praktikan berhasil dikeluarkan dari kelas." }
              );
              if (res) render();
            }
          });
        });
      });

      document.querySelectorAll("[data-open-student]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openStudentDetailModal(btn.getAttribute("data-open-student"), ui.selectedKelasId);
        });
      });

      // --- NILAI ---
      document.getElementById("btn-dualrole-kelas")?.addEventListener("click", () => {
        ui.activeTab = "kelas";
        render();
      });

      document.getElementById("sel-kelas-nilai")?.addEventListener("change", (e) => {
        ui.selectedNilaiClassId = e.target.value;
        render();
      });

      document.getElementById("btn-export-xlsx")?.addEventListener("click", () => {
        exportExcel(buildGradeMatrix(ui.selectedNilaiClassId));
      });
      document.getElementById("btn-export-docx")?.addEventListener("click", () => {
        exportWord(buildGradeMatrix(ui.selectedNilaiClassId));
      });
      document.getElementById("btn-export-pdf")?.addEventListener("click", () => {
        exportPdf(buildGradeMatrix(ui.selectedNilaiClassId));
      });

      // --- ASISTEN ---
      document.getElementById("btn-add-assistant")?.addEventListener("click", openAddAssistantModal);

      document.querySelectorAll("[data-toggle-dual]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const userId = btn.getAttribute("data-toggle-dual");
          btn.disabled = true;
          const res = await mutateDrive("toggleDualRole", { userId }, { successMsg: "Status Dual-Role diperbarui!" });
          render();
          if (!res) btn.disabled = false;
        });
      });

      document.querySelectorAll("[data-toggle-class]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const [assistantId, classId] = btn.getAttribute("data-toggle-class").split("::");
          btn.disabled = true;
          const res = await mutateDrive("toggleAssistantClass", { assistantId, classId }, { successMsg: "Pembagian kelas diperbarui!" });
          render();
          if (!res) btn.disabled = false;
        });
      });

      document.querySelectorAll("[data-del-assistant]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const userId = btn.getAttribute("data-del-assistant");
          const target = db.users.find((u) => u.id === userId);
          openConfirm({
            title: "Hapus Akun Asisten?",
            message: `Hapus asisten "${target ? target.fullName : ""}" secara permanen dari Google Drive?`,
            confirmLabel: "Hapus",
            onConfirm: async () => {
              const res = await mutateDrive("deleteAssistant", { userId }, { successMsg: "Asisten berhasil dihapus." });
              if (res) render();
            }
          });
        });
      });

      // --- PROFIL & CADANGAN GOOGLE DRIVE ---
      document.getElementById("btn-backup-now")?.addEventListener("click", () => runDriveBackup({ silent: false }));
      document.getElementById("btn-sync-now")?.addEventListener("click", () => syncWithDrive({ silent: false }));

      document.getElementById("sel-backup-freq")?.addEventListener("change", (e) => {
        const val = e.target.value;
        saveBackupFreq(val);
        const labels = {
          realtime: "Otomatis (Setiap Perubahan)",
          daily: "Harian",
          weekly: "Mingguan",
          manual: "Manual"
        };
        showToast(`Frekuensi cadangan diatur: ${labels[val]}`, "success");
      });

      document.getElementById("btn-restore-drive")?.addEventListener("click", () => {
        openConfirm({
          title: "Pulihkan dari Google Drive?",
          message: "Database Google Drive akan dipulihkan ke file cadangan terbaru yang tersimpan di folder Backups.",
          confirmLabel: "Ya, Pulihkan",
          danger: false,
          onConfirm: runRestoreFromDrive
        });
      });

      document.getElementById("btn-export-local-json")?.addEventListener("click", () => {
        const snapshot = {
          app: "Laboratorium Komputer (Labkom)",
          exportedAt: new Date().toISOString(),
          state: db
        };
        const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: "application/json" });
        triggerDownloadBlob(blob, `labkom_lokal_${new Date().toISOString().slice(0, 10)}.json`);
        showToast("Salinan lokal (.json) berhasil diunduh!", "success");
      });
    }

    // ========================================================================
    // 14. MODALS (ARTIKEL, PENGUMUMAN, TUGAS, PRAKTIKAN, NILAI, ASISTEN)
    // ========================================================================
    function openNewArticleModal() {
      openModal(
        "Tulis Artikel Baru",
        `<form id="form-new-article" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Judul Artikel</label>
            <input id="art-title" type="text" required placeholder="Contoh: Panduan Instalasi VS Code" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Ringkasan Singkat</label>
            <input id="art-excerpt" type="text" required placeholder="Deskripsi 1–2 kalimat..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Gambar Thumbnail (Opsional, otomatis diperkecil 640px)</label>

          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Atau Pilih Tema Sampul</label>
