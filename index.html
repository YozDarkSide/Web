              <option value="theme:blue">Biru — Artikel Labkom</option>
              <option value="theme:emerald">Hijau — Panduan Praktikum</option>
              <option value="theme:indigo">Indigo — Informasi Lab</option>
              <option value="theme:slate">Gelap — Laboratorium Komputer</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Isi Lengkap Artikel</label>
            <textarea id="art-content" rows="5" required placeholder="Tulis isi artikel..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></textarea>
          </div>
          <button id="btn-submit-article" type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm">Publikasikan Artikel</button>
        </form>`
      );

      document.getElementById("form-new-article").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-submit-article");
        btn.disabled = true;
        btn.textContent = "Menyimpan ke Google Drive...";

        let thumbnail = document.getElementById("art-theme").value;
        const imgFile = document.getElementById("art-img").files?.[0];
        if (imgFile) {
          try {
            thumbnail = await resizeThumbnailToJpeg(imgFile, 640, 0.72);
          } catch (err) {
            showToast(err.message, "error");
            btn.disabled = false;
            btn.textContent = "Publikasikan Artikel";
            return;
          }
        }

        const res = await mutateDrive(
          "createArticle",
          {
            title: document.getElementById("art-title").value.trim(),
            excerpt: document.getElementById("art-excerpt").value.trim(),
            content: document.getElementById("art-content").value.trim(),
            thumbnail
          },
          { successMsg: "Artikel berhasil dipublikasikan!" }
        );

        if (res) {
          closeModal();
          render();
        } else {
          btn.disabled = false;
          btn.textContent = "Publikasikan Artikel";
        }
      });
    }

    function openNewAnnouncementModal(user) {
      const scope = ui.announcementTab;
      const taught = getTaughtClasses(user.id);

      openModal(
        `Buat Pengumuman ${scope === "global" ? "Global" : "Asisten"}`,
        `<form id="form-ann" class="space-y-3">
          ${
            scope === "asisten"
              ? `<div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Target Kelas</label>
                  <select id="ann-class" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white">
                    ${taught.map((c) => `<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.courseName || "")}</option>`).join("")}
                  </select>
                 </div>`
              : ""
          }
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Judul</label>
            <input id="ann-title" type="text" required placeholder="Judul pengumuman..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Isi Pengumuman</label>
            <textarea id="ann-content" rows="4" required placeholder="Tulis pesan pengumuman..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></textarea>
          </div>
          <button id="btn-submit-ann" type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm">Kirim Pengumuman</button>
        </form>`
      );

      document.getElementById("form-ann").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-submit-ann");
        btn.disabled = true;
        btn.textContent = "Mengirim...";

        const res = await mutateDrive(
          "createAnnouncement",
          {
            title: document.getElementById("ann-title").value.trim(),
            content: document.getElementById("ann-content").value.trim(),
            scope,
            classId: scope === "asisten" ? document.getElementById("ann-class").value : null
          },
          { successMsg: "Pengumuman berhasil dikirim!" }
        );

        if (res) {
          closeModal();
          render();
        } else {
          btn.disabled = false;
          btn.textContent = "Kirim Pengumuman";
        }
      });
    }

    function openNewAssignmentModal() {
      const nowLocal = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      openModal(
        "Buat & Jadwalkan Tugas",
        `<form id="form-asg" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Target Kelas</label>
            <select id="asg-class" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white">
              ${db.classes.map((c) => `<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.courseName || "")}</option>`).join("")}
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Judul Tugas</label>
            <input id="asg-title" type="text" required placeholder="Contoh: Modul 1 - Pengenalan Algoritma" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Deskripsi & Instruksi</label>
            <textarea id="asg-desc" rows="3" required placeholder="Petunjuk pengerjaan tugas..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Jadwal Rilis Otomatis</label>
            <input id="asg-release" type="datetime-local" required value="${nowLocal}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
            <p class="text-[10px] text-slate-400 mt-0.5">Tugas otomatis tampil di kelas terkait begitu waktunya tiba.</p>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tenggat Pengumpulan (Opsional)</label>
            <input id="asg-due" type="datetime-local" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">File Soal / Modul Opsional (Maks 5 MB)</label>
            <input id="asg-file" type="file" accept="${ALLOWED_EXT.join(",")}" class="text-xs w-full" />
          </div>
          <button id="btn-submit-asg" type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm">Jadwalkan Tugas</button>
        </form>`
      );

      document.getElementById("form-asg").addEventListener("submit", async (e) => {
        e.preventDefault();
        const file = document.getElementById("asg-file").files?.[0];
        if (file) {
          const err = validateUploadFile(file);
          if (err) {
            showToast(err, "error");
            return;
          }
        }

        const btn = document.getElementById("btn-submit-asg");
        btn.disabled = true;
        btn.textContent = "Menyimpan ke Google Drive...";

        let fileBase64 = null;
        if (file) {
          try {
            fileBase64 = await fileToBase64(file);
          } catch (err) {
            showToast(err.message, "error");
            btn.disabled = false;
            btn.textContent = "Jadwalkan Tugas";
            return;
          }
        }

        const dueRaw = document.getElementById("asg-due").value;
        const res = await mutateDrive(
          "createAssignment",
          {
            classId: document.getElementById("asg-class").value,
            title: document.getElementById("asg-title").value.trim(),
            description: document.getElementById("asg-desc").value.trim(),
            releaseAt: new Date(document.getElementById("asg-release").value).toISOString(),
            dueAt: dueRaw ? new Date(dueRaw).toISOString() : null,
            fileName: file ? file.name : null,
            fileBase64,
            fileType: file ? (file.type || "application/octet-stream") : null
          },
          { successMsg: "Tugas berhasil dijadwalkan!" }
        );

        if (res) {
          closeModal();
          render();
        } else {
          btn.disabled = false;
          btn.textContent = "Jadwalkan Tugas";
        }
      });
    }

    function openAddStudentModal() {
      openModal(
        "Tambah Praktikan ke Kelas",
        `<form id="form-add-student" class="space-y-3">
          <p class="text-xs text-slate-500">Masukkan NIM / ID praktikan yang sudah mendaftar akun di Labkom.</p>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">NIM / Username Praktikan</label>
            <input id="st-nim" type="text" required placeholder="Contoh: 2401001" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <button id="btn-submit-student" type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm">Tambahkan ke Kelas</button>
        </form>`
      );

      document.getElementById("form-add-student").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-submit-student");
        btn.disabled = true;
        btn.textContent = "Menambahkan...";

        const username = document.getElementById("st-nim").value.trim().toLowerCase().replace(/\s+/g, "");
        const res = await mutateDrive(
          "addStudentToClass",
          { classId: ui.selectedKelasId, username },
          { successMsg: "Praktikan berhasil ditambahkan ke kelas!" }
        );

        if (res) {
          closeModal();
          render();
        } else {
          btn.disabled = false;
          btn.textContent = "Tambahkan ke Kelas";
        }
      });
    }

    function openStudentDetailModal(studentId, classId) {
      const st = db.users.find((u) => u.id === studentId);
      const cls = db.classes.find((c) => c.id === classId);
      if (!st) return;

      const classAsgs = db.assignments.filter((a) => a.classId === classId);
      const subs = db.submissions.filter(
        (s) => s.studentId === studentId && classAsgs.some((a) => a.id === s.assignmentId)
      );

      const listHtml =
        subs.length === 0
          ? `<div class="p-6 text-center text-xs text-slate-500 bg-slate-50 rounded-xl border border-slate-100">
              Praktikan ini belum mengumpulkan tugas di kelas ${esc(cls?.name || "")}.
             </div>`
          : `<div class="space-y-3">
              ${subs
                .map((sub) => {
                  const asg = classAsgs.find((a) => a.id === sub.assignmentId);
                  const existingGrade = db.grades.find((g) => g.submissionId === sub.id);
                  return `
                    <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                      <div class="font-bold text-xs text-slate-900">${esc(asg ? asg.title : "Tugas")}</div>
                      <div class="text-[10px] text-slate-500 mt-0.5">Dikumpulkan: ${formatDate(sub.submittedAt, true)}</div>
                      <button type="button" data-modal-dl-sub="${esc(sub.id)}" class="mt-2 inline-flex items-center gap-1.5 text-xs font-semibold text-blue-600 hover:underline bg-white px-2.5 py-1.5 rounded-lg border border-blue-100">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span class="truncate max-w-[210px]">${esc(sub.fileName)}</span>
                      </button>

                      <div class="mt-2.5 flex items-center gap-2">
                        <input type="number" min="0" max="100" step="0.5" data-score-input="${esc(sub.id)}" value="${existingGrade !== undefined ? existingGrade.score : ""}" placeholder="Nilai (0-100)" class="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                        <button type="button" data-save-grade="${esc(sub.id)}" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1">
                          <i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan
                        </button>
                      </div>
                    </div>
                  `;
                })
                .join("")}
            </div>`;

      openModal(
        "Detail & Penilaian Praktikan",
        `<div class="space-y-4">
          <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-900 text-white">
            <div class="w-11 h-11 rounded-full bg-blue-600 flex items-center justify-center font-bold text-base shrink-0">
              ${esc((st.fullName || "P").charAt(0).toUpperCase())}
            </div>
            <div class="min-w-0">
              <div class="font-bold text-sm truncate">${esc(st.fullName)}</div>
              <div class="text-[11px] text-slate-300 font-mono">NIM: ${esc(st.username)} • ${esc(cls?.name || "")}</div>
            </div>
          </div>

          <div class="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 flex items-center gap-1.5">
            <i data-lucide="lock" class="w-3.5 h-3.5 shrink-0"></i>
            <span>Nilai tersimpan otomatis ke Google Drive & <strong>tersembunyi mutlak</strong> dari akun Praktikan.</span>
          </div>

          ${listHtml}
        </div>`
      );

      document.querySelectorAll("[data-modal-dl-sub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const sub = db.submissions.find((s) => s.id === btn.getAttribute("data-modal-dl-sub"));
          if (sub) openDriveDownload(sub.fileUrl, sub.fileId);
        });
      });

      document.querySelectorAll("[data-save-grade]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const submissionId = btn.getAttribute("data-save-grade");
          const scoreInp = document.querySelector(`[data-score-input="${submissionId}"]`);
          const score = parseFloat(scoreInp.value);
          if (isNaN(score) || score < 0 || score > 100) {
            showToast("Masukkan angka nilai antara 0 hingga 100.", "error");
            return;
          }

          const sub = db.submissions.find((s) => s.id === submissionId);
          if (!sub) return;

          btn.disabled = true;
          btn.textContent = "...";
          const res = await mutateDrive(
            "saveGrade",
            {
              submissionId,
              assignmentId: sub.assignmentId,
              studentId,
              classId,
              score
            },
            { successMsg: `Nilai ${score} tersimpan & otomatis masuk ke tabel Nilai!` }
          );

          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan`;
          lucide.createIcons();
          if (res) render();
        });
      });
    }

    function openAddAssistantModal() {
      openModal(
        "Tambah Asisten Baru",
        `<form id="form-add-asst" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
            <input id="asst-name" type="text" required placeholder="Contoh: Nadia Putri" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">ID / Username</label>
            <input id="asst-user" type="text" required placeholder="Contoh: asisten2" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Password Awal (min. 6 karakter)</label>
            <input id="asst-pass" type="password" required minlength="6" placeholder="Minimal 6 karakter" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <button id="btn-submit-asst" type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm">Simpan Asisten</button>
        </form>`
      );

      document.getElementById("form-add-asst").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-submit-asst");
        btn.disabled = true;
        btn.textContent = "Menyimpan...";

        const username = document.getElementById("asst-user").value.trim().toLowerCase().replace(/\s+/g, "");
        const fullName = document.getElementById("asst-name").value.trim();
        const password = document.getElementById("asst-pass").value;

        const res = await mutateDrive(
          "createAssistant",
          { username, fullName, password },
          { successMsg: `Asisten ${fullName} berhasil ditambahkan!` }
        );

        if (res) {
          closeModal();
          render();
        } else {
          btn.disabled = false;
          btn.textContent = "Simpan Asisten";
        }
      });
    }

    // ========================================================================
    // 15. AUTO-SYNC & LIFECYCLE BOOTSTRAP
    // ========================================================================
    window.addEventListener("online", () => {
      ui.isOffline = false;
      if (session) {
        syncWithDrive({ silent: true });
      } else {
        pingDrive();
      }
      render();
    });

    window.addEventListener("offline", () => {
      ui.isOffline = true;
      ui.connState = "offline";
      render();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && navigator.onLine) {
        if (session) syncWithDrive({ silent: true });
        else pingDrive();
      }
    });

    // Background Auto-Sync setiap 30 detik
    setInterval(() => {
      if (session && navigator.onLine && document.visibilityState === "visible") {
        syncWithDrive({ silent: true });
      }
    }, AUTO_SYNC_INTERVAL_MS);

    // Boot Instan (Local-First) + Auto-Ping / Auto-Sync ke Google Drive
    loadFromStorage();
    render();

    if (session) {
      if (navigator.onLine) {
        syncWithDrive({ silent: true }).then(() => {
          checkScheduledAutoBackup();
        });
      }
    } else {
      pingDrive();
    }
  })();
  </script>
</body>
</html>
