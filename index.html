    // ========================================================================
    // 13. EVENT BINDING SEMUA MENU (TRUE 0ms OPTIMISTIC UI)
    // ========================================================================
    function bindAppEvents(user) {
      document.querySelectorAll("[data-nav]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.activeTab = btn.getAttribute("data-nav");
          ui.articleDetailId = null;
          render();
        });
      });

      const refreshBtn = document.getElementById("btn-header-refresh");
      if (refreshBtn) {
        refreshBtn.addEventListener("click", () => {
          if (syncQueue.length > 0) processSyncQueue();
          syncWithDrive({ silent: false, force: true });
        });
      }

      const backArtBtn = document.getElementById("btn-back-artikel");
      if (backArtBtn) {
        backArtBtn.addEventListener("click", () => {
          ui.articleDetailId = null;
          render();
        });
      }

      const logoutBtn = document.getElementById("btn-logout-trigger");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          openConfirm({
            title: "Konfirmasi Logout",
            message: "Apakah Anda yakin ingin keluar dari akun Laboratorium Komputer?",
            confirmLabel: "Ya, Logout",
            danger: true,
            onConfirm: () => {
              syncQueue = [];
              saveSyncQueue();
              saveSession(null);
              ui.activeTab = "artikel";
              ui.articleDetailId = null;
              showToast("Anda telah keluar dari akun.", "info");
              render();
            }
          });
        });
      }

      // --- ARTIKEL ---
      const searchInp = document.getElementById("inp-article-search");
      if (searchInp) {
        searchInp.addEventListener("input", (e) => {
          const val = e.target.value;
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            ui.articleSearch = val;
            render();
            const restored = document.getElementById("inp-article-search");
            if (restored) {
              restored.focus();
              restored.setSelectionRange(val.length, val.length);
            }
          }, 250);
        });
      }

      const sortArtBtn = document.getElementById("btn-sort-article");
      if (sortArtBtn) {
        sortArtBtn.addEventListener("click", () => {
          ui.articleSort = ui.articleSort === "desc" ? "asc" : "desc";
          render();
        });
      }

      document.querySelectorAll("[data-open-article]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.articleDetailId = btn.getAttribute("data-open-article");
          render();
        });
      });

      const newArtBtn = document.getElementById("btn-new-article");
      if (newArtBtn) newArtBtn.addEventListener("click", openNewArticleModal);

      // Optimistic Delete Article (0ms)
      document.querySelectorAll("[data-del-article]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-article");
          openConfirm({
            title: "Hapus Artikel?",
            message: "Artikel beserta seluruh komentar akan dihapus permanen.",
            confirmLabel: "Hapus",
            onConfirm: () => {
              db.articles = db.articles.filter((a) => a.id !== id);
              persistLocalDb();
              render();
              showToast("Artikel dihapus.", "success");
              enqueueMutation("deleteArticle", { id });
            }
          });
        });
      });

      // Optimistic Like (0ms)
      const likeArtBtn = document.getElementById("btn-like-article");
      if (likeArtBtn) {
        likeArtBtn.addEventListener("click", () => {
          const articleId = ui.articleDetailId;
          const art = db.articles.find((a) => a.id === articleId);
          if (!art) return;
          art.likes = Array.isArray(art.likes) ? art.likes : [];
          const idx = art.likes.indexOf(user.id);
          if (idx >= 0) art.likes.splice(idx, 1);
          else art.likes.push(user.id);
          persistLocalDb();
          render();
          enqueueMutation("toggleLike", { articleId });
        });
      }

      const shareArtBtn = document.getElementById("btn-share-article");
      if (shareArtBtn) {
        shareArtBtn.addEventListener("click", async () => {
          const art = db.articles.find((a) => a.id === ui.articleDetailId);
          const shareUrl = window.location.origin + window.location.pathname + "#artikel-" + ui.articleDetailId;
          if (navigator.share) {
            try {
              await navigator.share({ title: (art && art.title) || "Artikel Labkom", url: shareUrl });
              return;
            } catch (_e) {
              // Fallback ke copy link
            }
          }
          copyTextSafe(shareUrl);
          showToast("Link artikel berhasil disalin!", "success");
        });
      }

      // Optimistic Add Comment (0ms)
      const cmtForm = document.getElementById("form-comment");
      if (cmtForm) {
        cmtForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const inp = document.getElementById("inp-comment");
          const content = inp.value.trim();
          if (!content) return;
          const articleId = ui.articleDetailId;
          const art = db.articles.find((a) => a.id === articleId);
          if (art) {
            art.comments = Array.isArray(art.comments) ? art.comments : [];
            art.comments.push({
              id: "temp_cmt_" + Date.now(),
              userId: user.id,
              authorName: user.fullName,
              role: user.role,
              isAsisten: Boolean(user.isAsisten),
              classLabel: getUserClassLabel(user),
              content,
              createdAt: new Date().toISOString()
            });
            persistLocalDb();
            render();
            enqueueMutation("addComment", { articleId, content });
          }
        });
      }

      // --- PENGUMUMAN ---
      document.querySelectorAll("[data-ann-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.announcementTab = btn.getAttribute("data-ann-tab");
          render();
        });
      });

      const newAnnBtn = document.getElementById("btn-new-announcement");
      if (newAnnBtn) {
        newAnnBtn.addEventListener("click", () => openNewAnnouncementModal(user));
      }

      // Optimistic Delete Announcement (0ms)
      document.querySelectorAll("[data-del-ann]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-ann");
          openConfirm({
            title: "Hapus Pengumuman?",
            message: "Pengumuman ini akan dihapus permanen.",
            confirmLabel: "Hapus",
            onConfirm: () => {
              db.announcements = db.announcements.filter((a) => a.id !== id);
              persistLocalDb();
              render();
              showToast("Pengumuman dihapus.", "success");
              enqueueMutation("deleteAnnouncement", { id });
            }
          });
        });
      });

      // --- TUGAS ---
      const newAsgBtn = document.getElementById("btn-new-assignment");
      if (newAsgBtn) newAsgBtn.addEventListener("click", openNewAssignmentModal);

      // Optimistic Delete Assignment (0ms — otomatis menghapus file tugas di folder Tugas/)
      document.querySelectorAll("[data-del-assignment]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-assignment");
          const asg = db.assignments.find((a) => a.id === id);
          openConfirm({
            title: "Hapus Tugas?",
            message: 'File tugas "' + (asg ? asg.title : "") + '" akan dihapus dari folder Tugas Google Drive.',
            confirmLabel: "Hapus",
            onConfirm: () => {
              db.assignments = db.assignments.filter((a) => a.id !== id);
              persistLocalDb();
              render();
              showToast("Tugas dihapus.", "success");
              enqueueMutation("deleteAssignment", { id });
            }
          });
        });
      });

      document.querySelectorAll("[data-dl-material]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const asg = db.assignments.find((a) => a.id === btn.getAttribute("data-dl-material"));
          if (asg) openDriveDownload(asg.fileUrl, asg.fileId);
        });
      });

      document.querySelectorAll("[data-dl-sub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const sub = db.submissions.find((s) => s.id === btn.getAttribute("data-dl-sub"));
          if (sub) openDriveDownload(sub.fileUrl, sub.fileId);
        });
      });

      // Optimistic Upload Tugas (Validasi 5 MB + baca base64 + update instan + antre background)
      document.querySelectorAll("[data-upload-sub]").forEach((inp) => {
        inp.addEventListener("change", async (e) => {
          const file = e.target.files && e.target.files[0];
          const assignmentId = inp.getAttribute("data-upload-sub");
          e.target.value = "";
          if (!file) return;

          const err = validateUploadFile(file);
          if (err) {
            showToast(err, "error");
            return;
          }

          try {
            const fileBase64 = await fileToBase64(file);
            const asg = db.assignments.find((a) => a.id === assignmentId);
            const existingIdx = db.submissions.findIndex(
              (s) => s.assignmentId === assignmentId && s.studentId === user.id
            );
            const tempSubId = existingIdx >= 0 ? db.submissions[existingIdx].id : "temp_sub_" + Date.now();
            const optimisticSub = {
              id: tempSubId,
              assignmentId,
              classId: asg ? asg.classId : "",
              studentId: user.id,
              fileName: file.name,
              fileSize: file.size,
              fileUrl: null,
              fileId: null,
              submittedAt: new Date().toISOString()
            };
            if (existingIdx >= 0) db.submissions[existingIdx] = optimisticSub;
            else db.submissions.push(optimisticSub);

            persistLocalDb();
            render();
            showToast('"' + file.name + '" terkumpul & sedang dikirim di latar belakang.', "success");

            enqueueMutation("submitAssignment", {
              tempId: tempSubId,
              assignmentId,
              fileName: file.name,
              fileSize: file.size,
              fileBase64,
              fileType: file.type || "application/octet-stream"
            });
          } catch (readErr) {
            showToast(readErr.message || "Gagal membaca file.", "error");
          }
        });
      });

      // --- KELAS ---
      const selKelasAsst = document.getElementById("sel-kelas-asisten");
      if (selKelasAsst) {
        selKelasAsst.addEventListener("change", (e) => {
          ui.selectedKelasId = e.target.value;
          render();
        });
      }

      const addStBtn = document.getElementById("btn-add-student");
      if (addStBtn) addStBtn.addEventListener("click", openAddStudentModal);

      // Optimistic Remove Student (0ms)
      document.querySelectorAll("[data-remove-student]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const studentId = btn.getAttribute("data-remove-student");
          const st = db.users.find((u) => u.id === studentId);
          openConfirm({
            title: "Keluarkan Praktikan?",
            message: "Keluarkan " + (st ? st.fullName : "praktikan ini") + " dari kelas ini?",
            confirmLabel: "Keluarkan",
            onConfirm: () => {
              const cls = db.classes.find((c) => c.id === ui.selectedKelasId);
              if (cls && Array.isArray(cls.studentIds)) {
                cls.studentIds = cls.studentIds.filter((id) => id !== studentId);
              }
              persistLocalDb();
              render();
              showToast("Praktikan dikeluarkan dari kelas.", "success");
              enqueueMutation("removeStudentFromClass", { classId: ui.selectedKelasId, studentId });
            }
          });
        });
      });

      document.querySelectorAll("[data-open-student]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openStudentDetailModal(btn.getAttribute("data-open-student"), ui.selectedKelasId);
        });
      });

      // --- NILAI ---
      const dualBtn = document.getElementById("btn-dualrole-kelas");
      if (dualBtn) {
        dualBtn.addEventListener("click", () => {
          ui.activeTab = "kelas";
          render();
        });
      }

      const selNilai = document.getElementById("sel-kelas-nilai");
      if (selNilai) {
        selNilai.addEventListener("change", (e) => {
          ui.selectedNilaiClassId = e.target.value;
          render();
        });
      }

      const expXlsx = document.getElementById("btn-export-xlsx");
      if (expXlsx) expXlsx.addEventListener("click", () => exportExcel(buildGradeMatrix(ui.selectedNilaiClassId)));

      const expDocx = document.getElementById("btn-export-docx");
      if (expDocx) expDocx.addEventListener("click", () => exportWord(buildGradeMatrix(ui.selectedNilaiClassId)));

      const expPdf = document.getElementById("btn-export-pdf");

              });

              showToast("Asisten berhasil dihapus.", "success");

        });
      }

      const restoreBtn = document.getElementById("btn-restore-drive");
      if (restoreBtn) {
        restoreBtn.addEventListener("click", () => {
          openConfirm({
            title: "Pulihkan Cadangan Terakhir?",
            message: "Database Google Drive akan dikembalikan ke file cadangan terakhir di folder Backups.",
            confirmLabel: "Ya, Pulihkan",
            danger: false,
            onConfirm: runRestoreFromDrive
          });
        });
      }

      const expJsonBtn = document.getElementById("btn-export-local-json");
      if (expJsonBtn) {
        expJsonBtn.addEventListener("click", () => {
          const snapshot = {
            app: "Laboratorium Komputer (Labkom)",
            version: "v4",
            exportedAt: new Date().toISOString(),
            state: db
          };
          const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: "application/json" });
          triggerDownloadBlob(blob, "labkom_backup_" + new Date().toISOString().slice(0, 10) + ".json");
          showToast("Cadangan lokal (.json) berhasil diekspor!", "success");
        });
      }

      const impJsonInp = document.getElementById("inp-import-local-json");
      if (impJsonInp) {
        impJsonInp.addEventListener("change", (e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(String(reader.result || "{}"));
              const incoming = parsed.state && typeof parsed.state === "object" ? parsed.state : parsed;
              if (!Array.isArray(incoming.classes) && !Array.isArray(incoming.articles)) {
                throw new Error("Format file JSON cadangan Labkom tidak dikenali.");
              }
              openConfirm({
                title: "Impor Data Lokal (.json)?",
                message: 'Tampilan data lokal di perangkat akan dimuat dari "' + file.name + '".',
                confirmLabel: "Ya, Impor",
                danger: false,
                onConfirm: () => {
                  db = normalizeState(incoming);
                  persistLocalDb();
                  showToast("Data cadangan JSON lokal berhasil dimuat!", "success");
                  render();
                }
              });
            } catch (err) {
              showToast(err.message || "File JSON tidak valid.", "error");
            }
          };
          reader.readAsText(file);
        });
      }
    }

    function openStudentDetailModal(studentId, classId) {
      const user = currentUser();
      const st = db.users.find((u) => u.id === studentId);
      const cls = db.classes.find((c) => c.id === classId);
      if (!st) return;

      const classAsgs = db.assignments.filter((a) => a.classId === classId);
      const subs = db.submissions.filter(
        (s) => s.studentId === studentId && classAsgs.some((a) => a.id === s.assignmentId)
      );

      const listHtml =
        subs.length === 0
          ? `<div class="p-6 text-center text-xs text-slate-500 bg-slate-50 rounded-xl border border-slate-100">
              Praktikan ini belum mengumpulkan tugas di kelas ${esc(cls ? cls.name : "")}.
             </div>`
          : `<div class="space-y-3">
              ${subs
                .map((sub) => {
                  const asg = classAsgs.find((a) => a.id === sub.assignmentId);
                  const existingGrade = db.grades.find((g) => g.submissionId === sub.id);
                  return `
                    <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                      <div class="font-bold text-xs text-slate-900">${esc(asg ? asg.title : "Tugas")}</div>
                      <div class="text-[10px] text-slate-500 mt-0.5">Dikumpulkan: ${formatDate(sub.submittedAt, true)}</div>
                      <button type="button" data-modal-dl-sub="${esc(sub.id)}" class="mt-2 inline-flex items-center gap-1.5 text-xs font-semibold text-blue-600 hover:underline bg-white px-2.5 py-1.5 rounded-lg border border-blue-100">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span class="truncate max-w-[210px]">${esc(sub.fileName)}</span>
                      </button>

                      <div class="mt-2.5 flex items-center gap-2">
                        <input type="number" min="0" max="100" step="0.5" data-score-input="${esc(sub.id)}" value="${existingGrade !== undefined ? existingGrade.score : ""}" placeholder="Nilai (0-100)" class="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                        <button type="button" data-save-grade="${esc(sub.id)}" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1">
                          <i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan
                        </button>
                        ${
                          existingGrade
                            ? `<button type="button" data-del-grade="${esc(sub.id)}" class="p-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl border border-rose-200" aria-label="Hapus nilai">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                               </button>`
                            : ""
                        }
                      </div>
                    </div>
                  `;
                })
                .join("")}
            </div>`;

      openModal(
        "Detail & Penilaian Praktikan",
        `<div class="space-y-4">
          <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-900 text-white">
            <div class="w-11 h-11 rounded-full bg-blue-600 flex items-center justify-center font-bold text-base shrink-0">
              ${esc((st.fullName || "P").charAt(0).toUpperCase())}
            </div>
            <div class="min-w-0">
              <div class="font-bold text-sm truncate">${esc(st.fullName)}</div>
              <div class="text-[11px] text-slate-300 font-mono">NIM: ${esc(st.username)} • ${esc(cls ? cls.name : "")}</div>
            </div>
          </div>

          <div class="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 flex items-center gap-1.5">
            <i data-lucide="lock" class="w-3.5 h-3.5 shrink-0"></i>
            <span>Nilai tersimpan instan & <strong>tersembunyi mutlak</strong> dari akun Praktikan.</span>
          </div>

          ${listHtml}
        </div>`
      );

      document.querySelectorAll("[data-modal-dl-sub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const sub = db.submissions.find((s) => s.id === btn.getAttribute("data-modal-dl-sub"));
          if (sub) openDriveDownload(sub.fileUrl, sub.fileId);
        });
      });

      // Optimistic Save Grade (0ms)
      document.querySelectorAll("[data-save-grade]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const submissionId = btn.getAttribute("data-save-grade");
          const scoreInp = document.querySelector('[data-score-input="' + submissionId + '"]');
          const score = parseFloat(scoreInp.value);
          if (isNaN(score) || score < 0 || score > 100) {
            showToast("Masukkan angka nilai antara 0 hingga 100.", "error");
            return;
          }

          const sub = db.submissions.find((s) => s.id === submissionId);
          if (!sub) return;

          const gIdx = db.grades.findIndex((g) => g.submissionId === submissionId);
          const tempGrdId = gIdx >= 0 ? db.grades[gIdx].id : "temp_grd_" + Date.now();
          const gradeObj = {
            id: tempGrdId,
            submissionId,
            assignmentId: sub.assignmentId,
            studentId,
            classId,
            score,
            gradedBy: user.id,
            updatedAt: new Date().toISOString()
          };
          if (gIdx >= 0) db.grades[gIdx] = gradeObj;
          else db.grades.push(gradeObj);

          persistLocalDb();
          render();
          showToast("Nilai " + score + " tersimpan instan & masuk ke rekap Nilai!", "success");

          enqueueMutation("saveGrade", {
            tempId: tempGrdId,
            submissionId,
            assignmentId: sub.assignmentId,
            studentId,
            classId,
            score
          });
          openStudentDetailModal(studentId, classId);
        });
      });

      // Optimistic Delete Grade (otomatis menghapus file nilai di folder Nilai/)
      document.querySelectorAll("[data-del-grade]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const submissionId = btn.getAttribute("data-del-grade");
          const existing = db.grades.find((g) => g.submissionId === submissionId);
          if (!existing) return;
          db.grades = db.grades.filter((g) => g.submissionId !== submissionId);
          persistLocalDb();
          render();
          showToast("Nilai dihapus dari folder Nilai.", "success");
          enqueueMutation("deleteGrade", { id: existing.id, submissionId });
          openStudentDetailModal(studentId, classId);
        });
      });
    }

    function openAddClassModal() {
      openModal(
        "Tambah Kelas Baru",
        `<form id="form-add-class" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Kelas</label>
            <input id="cls-name" type="text" required placeholder="Contoh: IF-C 2026" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Mata Kuliah / Praktikum</label>
            <input id="cls-course" type="text" required placeholder="Contoh: Pemrograman Web" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm">Simpan Kelas</button>
        </form>`
      );

      document.getElementById("form-add-class").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("cls-name").value.trim();
        const courseName = document.getElementById("cls-course").value.trim();
        if (!name) return;

        const tempClsId = "temp_cls_" + Date.now();
        db.classes.push({
          id: tempClsId,
          name,
          courseName,
          assistantIds: [],
          studentIds: [],
          createdAt: new Date().toISOString()
        });

        persistLocalDb();
        closeModal();
        render();
        showToast('Kelas "' + name + '" ditambahkan!', "success");
        enqueueMutation("createClass", { tempId: tempClsId, name, courseName });
      });
    }

    function openAddAssistantModal() {
      openModal(
        "Tambah Asisten Baru",
        `<form id="form-add-asst" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
            <input id="asst-name" type="text" required placeholder="Contoh: Nadia Putri" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">ID / Username</label>
            <input id="asst-user" type="text" required placeholder="Contoh: asisten2" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Password Awal (min. 6 karakter)</label>
            <input id="asst-pass" type="password" required minlength="6" placeholder="Minimal 6 karakter" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          </div>
          <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm">Simpan Asisten</button>
        </form>`
      );

      document.getElementById("form-add-asst").addEventListener("submit", (e) => {
        e.preventDefault();
        const username = document.getElementById("asst-user").value.trim().toLowerCase().replace(/\s+/g, "");
        const fullName = document.getElementById("asst-name").value.trim();
        const password = document.getElementById("asst-pass").value;

        if (db.users.some((u) => u.username === username)) {
          showToast("ID/Username tersebut sudah digunakan.", "error");
          return;
        }

        const tempUsrId = "temp_usr_" + Date.now();
        db.users.push({
          id: tempUsrId,
          username,
          fullName,
          role: "asisten",
          isAsisten: true
        });

        persistLocalDb();
        closeModal();
        render();
        showToast("Asisten " + fullName + " ditambahkan!", "success");
        enqueueMutation("createAssistant", { tempId: tempUsrId, username, fullName, password });
      });
    }

    // ========================================================================
    // 15. LIFECYCLE BOOTSTRAP (ZERO PING, ZERO 30s POLLING, >5m RESUME SYNC)
    // ========================================================================
    window.addEventListener("online", () => {
      ui.isOffline = false;
      updateLiveConnectionIndicators();
      if (session) {
        if (syncQueue.length > 0) processSyncQueue();
        else syncWithDrive({ silent: true });
      }
      render();
    });

    window.addEventListener("offline", () => {
      ui.isOffline = true;
      updateLiveConnectionIndicators();
      render();
    });

    // Sync diam-diam hanya jika user kembali ke tab setelah >5 menit
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && session && navigator.onLine) {
        if (syncQueue.length > 0) {
          processSyncQueue();
        } else if (Date.now() - lastSyncTimestamp > RESUME_SYNC_THRESHOLD_MS) {
          syncWithDrive({ silent: true });
        }
      }
    });

    // Boot Instan (<50ms) langsung dari localStorage — TANPA ping & TANPA interval polling
    loadFromStorage();
    render();

    if (session && navigator.onLine) {
      if (syncQueue.length > 0) {
        processSyncQueue().then(() => {
          syncWithDrive({ silent: true }).then(() => checkScheduledDriveBackup());
        });
      } else {
        syncWithDrive({ silent: true }).then(() => checkScheduledDriveBackup());
      }
    }
  })();
  </script>
</body>
</html>
