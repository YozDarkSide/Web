  <!-- Dynamic Inline PWA Manifest (Android & iOS Home Screen Ready) -->

  <style>

      overscroll-behavior-y: none;
    }

      padding-top: max(0.75rem, env(safe-area-inset-top));

      padding-bottom: max(0.45rem, env(safe-area-inset-bottom));

      width: 4px;

    }

      background: #cbd5e1;
      border-radius: 9999px;
    }

      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeSlideUp 0.18s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-200 sm:bg-slate-900/95 text-slate-900 min-h-[100dvh] flex items-center justify-center sm:p-4">

  <!-- ====================================================================== -->
  <!-- MOBILE-FIRST NATIVE PWA SHELL                                          -->
  <!-- ====================================================================== -->
  <div id="app-frame" class="w-full sm:max-w-md h-[100dvh] sm:h-[calc(100dvh-2rem)] sm:max-h-[900px] bg-slate-50 sm:rounded-[28px] sm:shadow-2xl sm:border sm:border-slate-700/60 overflow-hidden flex flex-col relative">

    <!-- Toast Notification Stack -->
    <div id="toast-container" class="absolute top-16 left-4 right-4 z-[80] pointer-events-none flex flex-col gap-2"></div>

    <!-- Dynamic App Content Root -->
    <div id="app-root" class="flex-1 flex flex-col min-h-0 overflow-hidden"></div>

    <!-- Modal Overlay -->
    <div id="modal-root" class="hidden absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-3"></div>

    <!-- Confirmation Dialog Overlay (Replaces native alert/confirm) -->
    <div id="confirm-root" class="hidden absolute inset-0 z-[65] bg-slate-900/65 backdrop-blur-[2px] flex items-center justify-center p-4"></div>

  </div>

  <script>
  /**
   * ==========================================================================
   * LABORATORIUM KOMPUTER (LABKOM) — V4 TURBO (OPTIMISTIC LOCAL-FIRST PWA)
   * ==========================================================================
   * - Zero Ping on Boot & Zero Polling Spam (instant render <50ms dari cache)
   * - True Optimistic UI (0ms respon) + antrean latar belakang (syncQueue)
   * - Timeout fetch 15 detik + CORS-safe text/plain + Anti Random Logout
   * - Dual-Role Admin+Asisten, Isolasi Nilai Mutlak, Export .xlsx/.docx/.pdf
   * - Cadangan Google Drive ala WhatsApp (Default: Manual / Harian / Mingguan)
   */
  (function () {
    "use strict";

    // ========================================================================
    // 1. PERMANENT GAS ENDPOINT & V4 STORAGE KEYS
    // ========================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwJaDPPxUWRA0ql5rw8Q8tvQPnmmT_9eFEoeZQrDqYoQXCQIP8x2ngq8z24fYK0xVy7/exec";

    const KEY_SESSION = "labkom_v4_session";
    const KEY_STATE = "labkom_v4_state";
    const KEY_VERSION = "labkom_v4_version";
    const KEY_BACKUP_CFG = "labkom_v4_backup_cfg";
    const KEY_QUEUE = "labkom_v4_queue";

    const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5 MB
    const ALLOWED_EXT = [".pdf", ".docx", ".xlsx", ".zip", ".rar", ".png", ".jpg", ".jpeg"];
    const FETCH_TIMEOUT_MS = 15000;          // Timeout 15 detik agar tidak pernah nge-hang
    const RESUME_SYNC_THRESHOLD_MS = 5 * 60 * 1000; // Sync diam-diam jika balik ke tab >5 menit

    // Pasang manifest PWA secara dinamis via Blob agar siap di-install ke Home Screen
    (function injectDynamicManifest() {
      try {
        const svgIcon = encodeURIComponent(
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>" +
          "<rect width='512' height='512' rx='112' fill='#0f172a'/>" +
          "<rect x='56' y='56' width='400' height='400' rx='84' fill='#2563eb'/>" +
          "<text x='256' y='306' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='186' font-weight='800' fill='#ffffff'>LK</text>" +
          "</svg>"
        );
        const manifestObj = {
          name: "Laboratorium Komputer (Labkom)",
          short_name: "Labkom",
          description: "Portal Praktikum, Tugas, dan Penilaian Laboratorium Komputer",
          start_url: window.location.href.split("#")[0],
          display: "standalone",
          orientation: "portrait",
          background_color: "#f8fafc",
          theme_color: "#0f172a",
          icons: [
            { src: "data:image/svg+xml," + svgIcon, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
            { src: "data:image/svg+xml," + svgIcon, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
        const link = document.getElementById("pwa-manifest-link");
        if (link) link.href = URL.createObjectURL(blob);
      } catch (_e) {
        // Abaikan jika browser membatasi dynamic manifest blob
      }
    })();

    // ========================================================================
    // 2. GLOBAL STATE, SYNC QUEUE & UI CONTROLLER
    // ========================================================================
    let session = null; // { token, user: { id, username, fullName, role, isAsisten } }
    let db = createEmptyState();
    let clientVersion = "";
    let backupCfg = createDefaultBackupCfg();
    let syncQueue = []; // [{ id, action, payload, createdAt }]

    let ui = {
      activeTab: "artikel",        // artikel | pengumuman | tugas | kelas | nilai | asisten | profil
      articleDetailId: null,
      articleSearch: "",
      articleSort: "desc",         // desc | asc
      announcementTab: "global",   // global | asisten
      selectedKelasId: "",
      selectedNilaiClassId: "",
      loginMode: "login",          // login | register
      showPassword: false,
      isSubmittingAuth: false,
      isOffline: typeof navigator !== "undefined" ? !navigator.onLine : false,
      isBackingUp: false
    };

    let searchDebounceTimer = null;
    let isSyncInFlight = false;
    let isQueueProcessing = false;
    let lastSyncTimestamp = 0;

    function createEmptyState() {
      return {
        users: [],
        classes: [],
        articles: [],
        announcements: [],
        assignments: [],
        submissions: [],
        grades: []
      };
    }

    function createDefaultBackupCfg() {
      return {
        frequency: "manual", // manual (default) | daily | weekly
        lastLocalSavedAt: null,
        lastDriveBackupAt: null,
        lastBackupFileName: null,
        lastBackupSizeBytes: 0
      };
    }

    // ========================================================================
    // 3. LOCALSTORAGE PERSISTENCE (INSTANT <50ms BOOT & ANTI RANDOM LOGOUT)
    // ========================================================================
    function loadFromStorage() {
      try {
        const rawState = localStorage.getItem(KEY_STATE);
        if (rawState) db = normalizeState(JSON.parse(rawState));
      } catch (_e) {
        db = createEmptyState();
      }

      try {
        clientVersion = localStorage.getItem(KEY_VERSION) || "";
      } catch (_e) {
        clientVersion = "";
      }

      try {
        const rawCfg = localStorage.getItem(KEY_BACKUP_CFG);
        if (rawCfg) {
          const parsed = JSON.parse(rawCfg);
          backupCfg = Object.assign(createDefaultBackupCfg(), parsed);
          if (!["manual", "daily", "weekly"].includes(backupCfg.frequency)) {
            backupCfg.frequency = "manual";
          }
        }
      } catch (_e) {
        backupCfg = createDefaultBackupCfg();
      }

      try {
        const rawQueue = localStorage.getItem(KEY_QUEUE);
        if (rawQueue) {
          const parsedQ = JSON.parse(rawQueue);
          if (Array.isArray(parsedQ)) syncQueue = parsedQ;
        }
      } catch (_e) {
        syncQueue = [];
      }

      try {
        const rawSess = localStorage.getItem(KEY_SESSION);
        if (rawSess) {
          const parsed = JSON.parse(rawSess);
          if (parsed && parsed.token && parsed.user && parsed.user.id) {
            session = parsed;
          }
        }
      } catch (_e) {
        session = null;
      }

      ui.isOffline = typeof navigator !== "undefined" ? !navigator.onLine : false;
    }

    function normalizeState(raw) {
      const s = raw && typeof raw === "object" ? raw : {};
      return {
        users: Array.isArray(s.users) ? s.users : [],
        classes: Array.isArray(s.classes) ? s.classes : [],
        articles: Array.isArray(s.articles) ? s.articles : [],
        announcements: Array.isArray(s.announcements) ? s.announcements : [],
        assignments: Array.isArray(s.assignments) ? s.assignments : [],
        submissions: Array.isArray(s.submissions) ? s.submissions : [],
        grades: Array.isArray(s.grades) ? s.grades : []
      };
    }

    function persistLocalDb() {
      // Isolasi nilai mutlak: akun praktikan selalu memegang array kosong
      if (session && session.user && session.user.role === "praktikan") {
        db.grades = [];
      }
      try {
        localStorage.setItem(KEY_STATE, JSON.stringify(db));
        backupCfg.lastLocalSavedAt = new Date().toISOString();
        saveBackupCfg();
      } catch (_e) {
        // Abaikan jika penyimpanan browser penuh
      }
    }

    function saveStateFromServer(newState, serverTime, version) {
      db = normalizeState(newState);

      if (session && session.user && session.user.role === "praktikan") {
        db.grades = [];
      }

      // Sinkronkan perubahan role / dual-role user aktif dari server
      if (session && session.user) {
        const updatedSelf = db.users.find((u) => u.id === session.user.id);
        if (updatedSelf) {
          session.user = {
            id: updatedSelf.id,
            username: updatedSelf.username,
            fullName: updatedSelf.fullName,
            role: updatedSelf.role,
            isAsisten: Boolean(updatedSelf.isAsisten)
          };
          saveSession(session);
        }
      }

      const nextVer = version || serverTime || "";
      if (nextVer) {
        clientVersion = String(nextVer);
        try {
          localStorage.setItem(KEY_VERSION, clientVersion);
        } catch (_e) {
          // Abaikan
        }
      }

      persistLocalDb();
    }

    function saveSession(nextSess) {
      session = nextSess;
      try {
        if (nextSess) localStorage.setItem(KEY_SESSION, JSON.stringify(nextSess));
        else localStorage.removeItem(KEY_SESSION);
      } catch (_e) {
        // Abaikan jika localStorage penuh
      }
    }

    function saveBackupCfg() {
      try {
        localStorage.setItem(KEY_BACKUP_CFG, JSON.stringify(backupCfg));
      } catch (_e) {
        // Abaikan
      }
    }

    function saveSyncQueue() {
      try {
        localStorage.setItem(KEY_QUEUE, JSON.stringify(syncQueue));
      } catch (_e) {
        // Abaikan
      }
    }

    function getLocalCacheSizeBytes() {
      try {
        return new Blob([localStorage.getItem(KEY_STATE) || "{}"]).size;
      } catch (_e) {
        return JSON.stringify(db).length;
      }
    }

    // ========================================================================
    // 4. GOOGLE APPS SCRIPT TRANSPORT & LIGHTWEIGHT SYNC (TIMEOUT 15s)
    // ========================================================================
    async function callGas(action, payload) {
      if (typeof navigator !== "undefined" && !navigator.onLine) {
        ui.isOffline = true;
        updateLiveConnectionIndicators();
        return { ok: false, isNetworkError: true, error: "Perangkat sedang offline." };
      }

      const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS) : null;

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          redirect: "follow",
          signal: controller ? controller.signal : undefined,
          body: JSON.stringify({
            action,
            token: session && session.token ? session.token : "",
            payload: payload || {}
          })
        });

        if (timer) clearTimeout(timer);
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (_parseErr) {
          return { ok: false, isNetworkError: true, error: "Respons server Google Drive tidak valid." };
        }

        ui.isOffline = false;
        return data;
      } catch (err) {
        if (timer) clearTimeout(timer);
        const isTimeout = err && err.name === "AbortError";
        return {
          ok: false,
          isNetworkError: true,
          isTimeout,
          error: isTimeout ? "Koneksi timeout (15 detik)." : "Gagal terhubung ke jaringan."
        };
      }
    }

    function applyLightweightAck(action, payload, res) {
      if (res.version) {
        clientVersion = String(res.version);
        try {
          localStorage.setItem(KEY_VERSION, clientVersion);
        } catch (_e) {
          // Abaikan
        }
      }

      // Ganti ID sementara (temp_*) dengan ID permanen dari file Google Drive
      const replaceTempId = (arr, tempId, realId, extra) => {
        if (!tempId || !realId || !Array.isArray(arr)) return;
        const item = arr.find((x) => x.id === tempId);
        if (item) {
          item.id = realId;
          if (extra) Object.assign(item, extra);
        }
        // Perbarui referensi tempId pada antrean sinkronisasi yang masih menunggu
        syncQueue.forEach((q) => {
          if (!q || !q.payload) return;
          ["id", "articleId", "assignmentId", "classId", "submissionId", "userId", "assistantId"].forEach((k) => {
            if (q.payload[k] === tempId) q.payload[k] = realId;
          });
        });
        saveSyncQueue();
      };

      if (action === "createArticle") {
        replaceTempId(db.articles, payload.tempId, res.id, res.thumbnail ? { thumbnail: res.thumbnail } : null);
        if (ui.articleDetailId === payload.tempId && res.id) ui.articleDetailId = res.id;
      } else if (action === "createAnnouncement") {
        replaceTempId(db.announcements, payload.tempId, res.id);
      } else if (action === "createClass") {
        replaceTempId(db.classes, payload.tempId, res.id);
        if (ui.selectedKelasId === payload.tempId && res.id) ui.selectedKelasId = res.id;
        if (ui.selectedNilaiClassId === payload.tempId && res.id) ui.selectedNilaiClassId = res.id;
      } else if (action === "createAssignment") {
        replaceTempId(db.assignments, payload.tempId, res.id, {
          fileUrl: res.fileUrl || null,
          fileId: res.fileId || null
        });
      } else if (action === "submitAssignment") {
        replaceTempId(db.submissions, payload.tempId, res.id, {
          fileUrl: res.fileUrl || null,
          fileId: res.fileId || null
        });
      } else if (action === "saveGrade") {
        replaceTempId(db.grades, payload.tempId, res.id);
      } else if (action === "createAssistant") {
        replaceTempId(db.users, payload.tempId, res.id);
      } else if (action === "addStudentToClass" && res.user) {
        if (!db.users.some((u) => u.id === res.user.id)) {
          db.users.push(res.user);
        }
        const cls = db.classes.find((c) => c.id === res.classId);
        if (cls) {
          cls.studentIds = Array.isArray(cls.studentIds) ? cls.studentIds : [];
          if (!cls.studentIds.includes(res.user.id)) cls.studentIds.push(res.user.id);
        }
      }

      persistLocalDb();
    }

    async function syncWithDrive(opts) {
      const silent = opts && opts.silent !== undefined ? opts.silent : true;
      const force = Boolean(opts && opts.force);
      if (isSyncInFlight || !session) return;
      if (typeof navigator !== "undefined" && !navigator.onLine) {
        ui.isOffline = true;
        updateLiveConnectionIndicators();
        if (!silent) showToast("Sedang offline. Menampilkan data tersimpan lokal.", "info");
        return;
      }

      isSyncInFlight = true;
      updateLiveConnectionIndicators();

      const res = await callGas("sync", {
        clientVersion: force ? "" : clientVersion,
        force
      });

      isSyncInFlight = false;
      updateLiveConnectionIndicators();

      if (res && res.ok) {
        lastSyncTimestamp = Date.now();
        if (!res.unchanged && res.state) {
          saveStateFromServer(res.state, res.serverTime || new Date().toISOString(), res.version);
          const modalEl = document.getElementById("modal-root");
          if (modalEl && modalEl.classList.contains("hidden")) {
            render();
          }
        }
        if (!silent) showToast("Data terbaru berhasil disinkronkan dari Google Drive!", "success");
      } else if (res && res.isNetworkError) {
        // JANGAN logout saat jaringan bermasalah
        if (!silent) showToast("Jaringan lambat/terputus. Data lokal tetap aktif.", "info");
      } else if (!silent) {
        showToast((res && res.error) || "Gagal menyinkronkan data.", "error");
      }
    }

    function enqueueMutation(action, payload) {
      syncQueue.push({
        id: "q_" + Date.now() + "_" + Math.floor(Math.random() * 10000),
        action,
        payload,
        createdAt: new Date().toISOString()
      });
      saveSyncQueue();
      updateLiveConnectionIndicators();
      processSyncQueue();
    }

    async function processSyncQueue() {
      if (isQueueProcessing || !session || syncQueue.length === 0) {
        updateLiveConnectionIndicators();
        return;
      }
      if (typeof navigator !== "undefined" && !navigator.onLine) {
        ui.isOffline = true;
        updateLiveConnectionIndicators();
        return;
      }

      isQueueProcessing = true;
      updateLiveConnectionIndicators();

      let latestServerRes = null;
      let hadLightweightAck = false;

      while (syncQueue.length > 0 && session) {
        if (typeof navigator !== "undefined" && !navigator.onLine) {
          ui.isOffline = true;
          break;
        }

        const item = syncQueue[0];
        const res = await callGas(item.action, item.payload);

        if (res && res.ok) {
          syncQueue.shift();
          saveSyncQueue();
          if (res.state) {
            latestServerRes = res;
          } else {
            applyLightweightAck(item.action, item.payload, res);
            hadLightweightAck = true;
          }
        } else if (res && res.isNetworkError) {
          // Jaringan putus / timeout: tahan antrean, data lokal tetap aman, tidak logout
          break;
        } else {
          // Error validasi bisnis dari server: buang item gagal, beri tahu user, lalu sinkron ulang
          syncQueue.shift();
          saveSyncQueue();
          showToast((res && res.error) || "Perubahan ditolak server. Menyelaraskan data...", "error");
          isQueueProcessing = false;
          updateLiveConnectionIndicators();
          syncWithDrive({ silent: true, force: true });
          return;
        }
      }

      isQueueProcessing = false;

      // Setelah seluruh antrean kosong, selaraskan ID permanen dari server secara halus
      if (syncQueue.length === 0 && latestServerRes && latestServerRes.state) {
        const prevArtId = ui.articleDetailId;
        const prevArtObj = prevArtId ? db.articles.find((a) => a.id === prevArtId) : null;

        saveStateFromServer(latestServerRes.state, latestServerRes.serverTime, latestServerRes.version);

        // Jika user sedang membuka artikel baru dengan ID sementara, alihkan ke ID server permanen
        if (prevArtObj && String(prevArtId).startsWith("temp_")) {
          const matched = db.articles.find(
            (a) => a.title === prevArtObj.title && a.excerpt === prevArtObj.excerpt
          );
          if (matched) ui.articleDetailId = matched.id;
        }

        const modalEl = document.getElementById("modal-root");
        if (modalEl && modalEl.classList.contains("hidden")) {
          render();
        }
      } else if (syncQueue.length === 0 && hadLightweightAck) {
        const modalEl = document.getElementById("modal-root");
        if (modalEl && modalEl.classList.contains("hidden")) {
          render();
        }
      }

      updateLiveConnectionIndicators();
    }

    // ========================================================================
    // 5. WHATSAPP-STYLE GOOGLE DRIVE BACKUP (MANUAL / HARIAN / MINGGUAN)
    // ========================================================================
    function canUseDriveBackup(u) {
      const target = u || currentUser();
      return Boolean(target && (target.role === "admin" || target.role === "asisten"));
    }

    function checkScheduledDriveBackup() {
      if (!session || !canUseDriveBackup(session.user)) return;
      if (backupCfg.frequency !== "daily" && backupCfg.frequency !== "weekly") return;
      if (typeof navigator !== "undefined" && !navigator.onLine) return;

      const intervalMs = backupCfg.frequency === "daily" ? 24 * 3600 * 1000 : 7 * 24 * 3600 * 1000;
      const lastMs = backupCfg.lastDriveBackupAt ? new Date(backupCfg.lastDriveBackupAt).getTime() : 0;
      if (!lastMs || Date.now() - lastMs >= intervalMs) {
        runDriveBackup({ silent: true });
      }
    }

    async function runDriveBackup(opts) {
      const silent = opts && opts.silent !== undefined ? opts.silent : false;
      if (!session || !canUseDriveBackup(session.user) || ui.isBackingUp) return;
      if (typeof navigator !== "undefined" && !navigator.onLine) {
        if (!silent) showToast("Tidak bisa mencadangkan ke Google Drive saat offline.", "error");
        return;
      }

      ui.isBackingUp = true;
      if (ui.activeTab === "profil") render();

      const res = await callGas("backupNow", {});
      ui.isBackingUp = false;

      if (res && res.ok && res.backupInfo) {
        backupCfg.lastDriveBackupAt = res.backupInfo.backedUpAt || new Date().toISOString();
        backupCfg.lastBackupFileName = res.backupInfo.fileName || "backup_labkom.json";
        backupCfg.lastBackupSizeBytes = res.backupInfo.sizeBytes || getLocalCacheSizeBytes();
        saveBackupCfg();
        if (!silent) {
          showToast("Cadangan tersimpan di Google Drive (" + backupCfg.lastBackupFileName + ")", "success");
        }
      } else {
        if (!silent) showToast((res && res.error) || "Gagal membuat cadangan di Google Drive.", "error");
      }

      if (ui.activeTab === "profil") render();
    }

    async function runRestoreFromDrive() {

    function esc(str) {
      return String(str === null || str === undefined ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDate(iso, withTime) {
      if (!iso) return "-";
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return "-";
        const opts = withTime
          ? { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }
          : { day: "numeric", month: "short", year: "numeric" };
        return d.toLocaleDateString("id-ID", opts);
      } catch (_e) {
        return "-";
      }
    }

    function formatKB(bytes) {
      const b = Number(bytes || 0);
      if (b < 1024) return b + " B";
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
      return (b / (1024 * 1024)).toFixed(2) + " MB";
    }

    function validateUploadFile(file) {
      if (!file) return "Pilih file terlebih dahulu.";
      if (file.size > MAX_FILE_SIZE) {
        return "Ukuran file melebihi batas 5 MB (" + (file.size / (1024 * 1024)).toFixed(2) + " MB).";
      }
      const lower = (file.name || "").toLowerCase();
      const allowed = ALLOWED_EXT.some((ext) => lower.endsWith(ext));
      if (!allowed) {
        return "Format file tidak diizinkan. Gunakan: " + ALLOWED_EXT.join(", ");
      }
      return null;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Gagal membaca file dari perangkat."));
        reader.readAsDataURL(file);
      });
    }

    function resizeThumbnailToJpeg(file, maxW, quality) {
      const targetMaxW = maxW || 640;
      const targetQ = quality || 0.72;
      return new Promise((resolve, reject) => {
        if (file.size > MAX_FILE_SIZE) {
          reject(new Error("Ukuran gambar terlalu besar (maksimal 5 MB)."));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("File bukan gambar yang valid."));
          img.onload = () => {
            const scale = Math.min(1, targetMaxW / img.width);
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", targetQ));
          };
          img.src = String(reader.result || "");
        };
        reader.readAsDataURL(file);
      });
    }

    function openDriveDownload(fileUrl, fileId) {
      const url = fileUrl || (fileId ? "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(fileId) : "");
      if (!url) {
        showToast("File sedang diproses di Google Drive. Coba tekan refresh beberapa detik lagi.", "info");
        return;
      }
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function copyTextSafe(text) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (_e) {
        // Abaikan jika gagal copy
      }
    }

    function triggerDownloadBlob(blob, filename) {
      try {
        if (typeof window.saveAs === "function") {
          window.saveAs(blob, filename);
          return;
        }
      } catch (_e) {
        // Fallback anchor download
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    // ========================================================================
    // 8. GRADE MATRIX & CLIENT-SIDE EXPORT ENGINE (.xlsx, .docx, .pdf)
    // ========================================================================
    function buildGradeMatrix(classId) {
      const cls = db.classes.find((c) => c.id === classId);
      const studentIds = cls && Array.isArray(cls.studentIds) ? cls.studentIds : [];
      const students = db.users
        .filter((u) => studentIds.includes(u.id))
        .sort((a, b) => String(a.username || "").localeCompare(String(b.username || "")));

      const assignments = db.assignments
        .filter((a) => a.classId === classId)
        .sort((a, b) => new Date(a.releaseAt || 0).getTime() - new Date(b.releaseAt || 0).getTime());

      const classGrades = db.grades.filter((g) => g.classId === classId);
      const scoreMap = {};
      classGrades.forEach((g) => {
        if (!scoreMap[g.studentId]) scoreMap[g.studentId] = {};
        scoreMap[g.studentId][g.assignmentId] = Number(g.score);
      });

      const rows = students.map((st, idx) => {
        const scores = {};
        const nums = [];
        assignments.forEach((asg) => {
          const val = scoreMap[st.id] ? scoreMap[st.id][asg.id] : undefined;
          if (val !== undefined && !isNaN(val)) {
            scores[asg.id] = val;
            nums.push(val);
          } else {
            scores[asg.id] = null;
          }
        });
        const avg = nums.length > 0 ? nums.reduce((acc, v) => acc + v, 0) / nums.length : null;
        return {
          no: idx + 1,
          nim: st.username,
          fullName: st.fullName,
          scores,
          average: avg
        };
      });

      return {
        className: cls ? cls.name : "Kelas",
        courseName: cls ? (cls.courseName || "") : "",
        assignments,
        rows
      };
    }

          showToast("Library Word sedang dimuat. Coba sebentar lagi.", "error");
          return;
        }
        const { Document, Packer, Paragraph, Table, TableCell, TableRow, TextRun, WidthType, AlignmentType } = window.docx;

          "NIM / ID",
          "Nama Praktikan",
          ...matrix.assignments.map((a) => a.title),
          "Rata-rata"
        ];
        const headerRow = new TableRow({
          tableHeader: true,

            (h) =>
              new TableCell({
                shading: { fill: "0F172A" },
                children: [
                  new Paragraph({
                    alignment: AlignmentType.CENTER,
                    children: [new TextRun({ text: String(h), bold: true, color: "FFFFFF", size: 18 })]
                  })
                ]
              })
          )
        });

        const dataRows = matrix.rows.map((r) => {
          const vals = [
            String(r.no),
            String(r.nim),
            String(r.fullName),
            ...matrix.assignments.map((a) => (r.scores[a.id] !== null ? String(r.scores[a.id]) : "-")),
            r.average !== null ? r.average.toFixed(1) : "-"
          ];
          return new TableRow({
            children: vals.map(
              (val, idx) =>
                new TableCell({
                  children: [
                    new Paragraph({
                      alignment: idx === 2 ? AlignmentType.LEFT : AlignmentType.CENTER,
                      children: [new TextRun({ text: val, size: 18 })]
                    })
                  ]
                })
            )
          });
        });

        const doc = new Document({
          sections: [
            {

                  alignment: AlignmentType.CENTER,

                      size: 20,
                      color: "475569"

                }),
                new Table({
                  width: { size: 100, type: WidthType.PERCENTAGE },
                  rows: [headerRow, ...dataRows]
                })
              ]
            }
          ]
        });

        const blob = await Packer.toBlob(doc);

    function bindLoginEvents() {
      const form = document.getElementById("auth-form");
      const errBox = document.getElementById("auth-error");

      const showAuthError = (msg) => {
        errBox.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i><span>${esc(msg)}</span>`;
        errBox.classList.remove("hidden");
        if (window.lucide) lucide.createIcons();
      };

      document.querySelectorAll("[data-auth-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.loginMode = btn.getAttribute("data-auth-mode");
          render();
        });
      });

      const togglePassBtn = document.getElementById("btn-toggle-pass");
      if (togglePassBtn) {
        togglePassBtn.addEventListener("click", () => {
          ui.showPassword = !ui.showPassword;
          const inp = document.getElementById("inp-password");
          if (inp) inp.type = ui.showPassword ? "text" : "password";
          togglePassBtn.innerHTML = `<i data-lucide="${ui.showPassword ? "eye-off" : "eye"}" class="w-4 h-4"></i>`;
          if (window.lucide) lucide.createIcons();
        });
      }

      document.querySelectorAll("[data-autofill]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const uname = btn.getAttribute("data-autofill");
          const uInp = document.getElementById("inp-username");
          const pInp = document.getElementById("inp-password");
          if (uInp) uInp.value = uname;
          if (pInp) pInp.value = "123456";
          showToast('Form diisi dengan akun "' + uname + '". Ketuk Login untuk masuk.', "info");
        });
      });

      const forgotBtn = document.getElementById("btn-forgot-pass");
      if (forgotBtn) {
        forgotBtn.addEventListener("click", () => {
          openModal(
            "Bantuan Lupa Password",
            `<div class="space-y-3 text-xs text-slate-600 leading-relaxed">
              <p>Demi keamanan data praktikum, reset password hanya dapat dilakukan oleh <strong>Admin Laboratorium Komputer</strong>.</p>
              <p>Silakan hubungi Koordinator Labkom atau Asisten kelas Anda dengan menyertakan <strong>NIM/ID</strong> dan <strong>Nama Lengkap</strong>.</p>
              <button type="button" data-close-modal class="w-full py-2.5 bg-slate-900 text-white rounded-xl font-semibold">Mengerti</button>
            </div>`
          );
        });
      }

      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (ui.isSubmittingAuth) return; // Anti klik ganda
          errBox.classList.add("hidden");

          const cleanUser = document.getElementById("inp-username").value.trim().toLowerCase().replace(/\s+/g, "");
          const password = document.getElementById("inp-password").value;
          const fullNameEl = document.getElementById("inp-fullname");
          const fullName = ui.loginMode === "register" && fullNameEl ? fullNameEl.value.trim() : "";

          if (cleanUser.length < 3) {
            showAuthError("ID/Username (NIM) minimal 3 karakter tanpa spasi.");
            return;
          }
          if (password.length < 6) {
            showAuthError("Password minimal harus terdiri dari 6 karakter.");
            return;
          }
          if (ui.loginMode === "register" && fullName.length < 2) {
            showAuthError("Nama lengkap wajib diisi.");
            return;
          }

          ui.isSubmittingAuth = true;
          const btn = document.getElementById("btn-auth-submit");
          btn.disabled = true;
          btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Memproses...</span>`;
          if (window.lucide) lucide.createIcons();

          const action = ui.loginMode === "register" ? "register" : "login";
          const payload =
            action === "register"
              ? { username: cleanUser, fullName, password }
              : { username: cleanUser, password };

          const res = await callGas(action, payload);
          ui.isSubmittingAuth = false;

          if (!res || !res.ok) {
            btn.disabled = false;
            btn.innerHTML = `<span>${ui.loginMode === "register" ? "Daftar Akun Praktikan" : "Login"}</span>`;
            if (res && res.isTimeout) {
              showAuthError("Server merespons terlalu lama (timeout 15 detik). Periksa koneksi internet Anda lalu coba lagi.");
            } else if (res && res.isNetworkError) {
              showAuthError("Jaringan internet sedang terputus atau tidak stabil. Periksa Wi-Fi/data seluler Anda.");
            } else {
              showAuthError((res && res.error) || "ID/Username atau Password salah. Periksa kembali penulisan NIM/ID Anda.");
            }
            return;
          }

          syncQueue = [];
          saveSyncQueue();
          saveSession({ token: res.token, user: res.user });
          if (res.state) saveStateFromServer(res.state, res.serverTime || new Date().toISOString(), res.version);
          lastSyncTimestamp = Date.now();

          ui.activeTab = "artikel";
          ui.articleDetailId = null;
          ui.loginMode = "login";
          ui.selectedKelasId = "";
          ui.selectedNilaiClassId = "";
          ui.isOffline = false;

          showToast("Selamat datang, " + res.user.fullName + "!", "success");
          render();
          checkScheduledDriveBackup();
        });
      }
    }

    function renderArticleCover(thumb, title, heightClass) {

      }
      const themeMap = {
        "theme:blue": "from-blue-600 to-indigo-700",
        "theme:emerald": "from-emerald-600 to-teal-700",
        "theme:indigo": "from-indigo-600 to-violet-700",
        "theme:slate": "from-slate-800 to-slate-900"
      };
      const grad = themeMap[thumb] || "from-blue-600 to-indigo-700";
      return `
        <div class="w-full ${hCls} bg-gradient-to-br ${grad} p-4 flex flex-col justify-between text-white">
          <div class="inline-flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider bg-white/15 w-fit px-2.5 py-1 rounded-full">

    // --- MENU ARTIKEL (LIST) ---
    function renderArtikelListView(user) {

            String(a.title || "").toLowerCase().includes(q) ||
            String(a.excerpt || "").toLowerCase().includes(q) ||
            String(a.authorName || "").toLowerCase().includes(q)
          );
        })
        .sort((a, b) => {
          const tA = new Date(a.createdAt || 0).getTime();
          const tB = new Date(b.createdAt || 0).getTime();
          return ui.articleSort === "desc" ? tB - tA : tA - tB;

                      <article class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">

                                ? `<button type="button" data-del-article="${esc(art.id)}" class="text-rose-500 hover:bg-rose-50 p-1 rounded-lg" aria-label="Hapus artikel">

                          <p class="text-xs text-slate-600 mt-1 line-clamp-2 leading-relaxed">${esc(art.excerpt)}</p>

                <i data-lucide="heart" class="w-4 h-4 ${isLiked ? "fill-rose-600" : ""}"></i>
                <span>${likes.length}</span>
              </button>
              <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-600">
                <i data-lucide="message-circle" class="w-4 h-4"></i>
                <span>${comments.length}</span>
              </div>
              <button type="button" id="btn-share-article" class="ml-auto flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-50 border border-blue-200 text-xs font-bold text-blue-600 hover:bg-blue-100 transition">
                <i data-lucide="share-2" class="w-4 h-4"></i>
                <span>Bagikan</span>
              </button>
            </div>
          </div>
        </article>

        <!-- Komentar (Wajib menampilkan Nama, Status/Role, dan Kelas) -->
        <section class="mt-4 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
          <h3 class="font-bold text-xs text-slate-900 mb-3">Komentar (${comments.length})</h3>
          <div class="space-y-2.5 mb-4">
            ${
              comments.length === 0
                ? `<p class="text-xs text-slate-400 text-center py-3">Belum ada komentar. Jadilah yang pertama berkomentar!</p>`
                : comments
                    .map(
                      (c) => `
                        <div class="p-3 rounded-xl bg-slate-50 border border-slate-100">
                          <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                            <span class="font-bold text-slate-900">${esc(c.authorName || "Pengguna")}</span>
                            <span class="px-1.5 py-0.5 rounded-md font-bold text-[10px] ${
                              c.role === "admin"
                                ? "bg-indigo-100 text-indigo-700"
                                : c.role === "asisten"
                                ? "bg-blue-100 text-blue-700"
                                : "bg-emerald-100 text-emerald-700"
                            }">${esc(getRoleLabel(c.role, c.isAsisten))}</span>
                            <span class="text-slate-500 text-[10px]">• ${esc(c.classLabel || "-")}</span>
                          </div>
                          <p class="text-xs text-slate-700 mt-1.5 leading-relaxed">${esc(c.content)}</p>
                        </div>
                      `
                    )
                    .join("")
            }
          </div>

          <form id="form-comment" class="flex gap-2">
            <input id="inp-comment" type="text" required placeholder="Tulis komentar..." class="flex-1 px-3 py-2.5 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" />
            <button type="submit" class="px-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl flex items-center justify-center" aria-label="Kirim komentar">
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </form>
        </section>
      `;
    }

    // --- MENU PENGUMUMAN ---
    function renderPengumumanView(user) {
      const tab = ui.announcementTab;
      const myStudentClassIds = getEnrolledClasses(user.id).map((c) => c.id);
      const myTaughtClassIds = getTaughtClasses(user.id).map((c) => c.id);

      const list = db.announcements
        .filter((ann) => {
          if (ann.scope !== tab) return false;
          if (tab === "global" || isAdmin(user)) return true;
          return myStudentClassIds.includes(ann.classId) || myTaughtClassIds.includes(ann.classId);
        })
        .sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());

      return `
        <!-- Switcher Global / Asisten -->
        <div class="grid grid-cols-2 bg-slate-200/80 p-1 rounded-xl mb-4">
          <button type="button" data-ann-tab="global" class="py-2 text-xs font-bold rounded-lg transition ${
            tab === "global" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"
          }">Global</button>
          <button type="button" data-ann-tab="asisten" class="py-2 text-xs font-bold rounded-lg transition ${
            tab === "asisten" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"
          }">Asisten</button>
        </div>

        ${
          list.length === 0
            ? `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center">
                <i data-lucide="megaphone" class="w-8 h-8 text-slate-300 mx-auto mb-2"></i>
                <p class="text-xs font-semibold text-slate-600">Belum ada pengumuman di tab ${tab === "global" ? "Global" : "Asisten"}.</p>
               </div>`
            : `<div class="space-y-3">
                ${list
                  .map((ann) => {
                    const cls = ann.classId ? db.classes.find((c) => c.id === ann.classId) : null;
                    const canDel =
                      (ann.scope === "global" && isAdmin(user)) ||
                      (ann.scope === "asisten" && ann.authorId === user.id);

                    return `
                      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                        <div class="flex items-start justify-between gap-2">
                          <div class="flex items-center gap-2 min-w-0">
                            <div class="w-8 h-8 rounded-xl ${
                              ann.scope === "global" ? "bg-indigo-50 text-indigo-600" : "bg-blue-50 text-blue-600"
                            } flex items-center justify-center shrink-0">
                              <i data-lucide="megaphone" class="w-4 h-4"></i>
                            </div>
                            <div class="min-w-0">
                              <h3 class="font-bold text-sm text-slate-900 leading-snug">${esc(ann.title)}</h3>
                              <div class="text-[10px] text-slate-500 mt-0.5">
                                ${esc(ann.authorName || "Labkom")} • ${cls ? "Kelas " + esc(cls.name) : "Pengumuman Global"}
                              </div>
                            </div>
                          </div>
                          ${
                            canDel
                              ? `<button type="button" data-del-ann="${esc(ann.id)}" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg shrink-0" aria-label="Hapus pengumuman">
                                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                 </button>`
                              : ""
                          }
                        </div>
                        <p class="text-xs text-slate-600 mt-2.5 whitespace-pre-line leading-relaxed">${esc(ann.content)}</p>
                        <div class="mt-3 pt-2 border-t border-slate-100 text-[10px] text-slate-400">
                          ${formatDate(ann.createdAt, true)}
                        </div>
                      </div>
                    `;
                  })
                  .join("")}
               </div>`
        }
      `;
    }

    // --- MENU TUGAS (GOOGLE CLASSROOM STYLE) ---
    function renderTugasView(user) {
      const now = Date.now();
      const myStudentClassIds = getEnrolledClasses(user.id).map((c) => c.id);
      const myTaughtClassIds = getTaughtClasses(user.id).map((c) => c.id);

      const visibleAsgs = db.assignments
        .filter((asg) => {
          if (isAdmin(user)) return true;
          if (canTeach(user) && myTaughtClassIds.includes(asg.classId)) return true;
          return myStudentClassIds.includes(asg.classId) && new Date(asg.releaseAt || 0).getTime() <= now;
        })
        .sort((a, b) => new Date(b.releaseAt || 0).getTime() - new Date(a.releaseAt || 0).getTime());

      if (visibleAsgs.length === 0) {
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center">
            <i data-lucide="clipboard-list" class="w-8 h-8 text-slate-300 mx-auto mb-2"></i>
            <p class="text-xs font-semibold text-slate-600">Belum ada tugas yang dirilis untuk kelas Anda.</p>
          </div>
        `;
      }

      return `
        <div class="space-y-3.5">
          ${visibleAsgs
            .map((asg) => {
              const cls = db.classes.find((c) => c.id === asg.classId);
              const isFuture = new Date(asg.releaseAt || 0).getTime() > now;
              const mySub =
                user.role === "praktikan"
                  ? db.submissions.find((s) => s.assignmentId === asg.id && s.studentId === user.id)
                  : null;
              const totalSubs = db.submissions.filter((s) => s.assignmentId === asg.id).length;

              return `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                  <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
                      <i data-lucide="clipboard-list" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="flex flex-wrap items-center justify-between gap-1.5">
                        <div class="flex flex-wrap items-center gap-1.5">
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700">${esc(cls ? cls.name : "-")}</span>
                          ${
                            isFuture
                              ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 flex items-center gap-1">
                                  <i data-lucide="calendar-clock" class="w-3 h-3"></i> Terjadwal
                                 </span>`
                              : ""
                          }
                          ${
                            user.role === "praktikan"
                              ? mySub
                                ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 flex items-center gap-1">
                                    <i data-lucide="check-circle-2" class="w-3 h-3"></i> Sudah Dikumpulkan
                                   </span>`
                                : `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 flex items-center gap-1">
                                    <i data-lucide="clock" class="w-3 h-3"></i> Belum Dikumpulkan
                                   </span>`
                              : `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700">${totalSubs} Terkumpul</span>`
                          }
                        </div>
                        ${
                          isAdmin(user)
                            ? `<button type="button" data-del-assignment="${esc(asg.id)}" class="p-1 text-rose-500 hover:bg-rose-50 rounded-lg shrink-0" aria-label="Hapus tugas">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                               </button>`
                            : ""
                        }
                      </div>

                      <h3 class="font-bold text-sm text-slate-900 mt-1.5">${esc(asg.title)}</h3>
                      <p class="text-xs text-slate-600 mt-1 whitespace-pre-line leading-relaxed">${esc(asg.description)}</p>

                      <div class="mt-2.5 text-[11px] text-slate-500 space-y-0.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <div class="flex items-center gap-1.5">
                          <i data-lucide="calendar" class="w-3 h-3 text-slate-400"></i>
                          <span>Rilis: <strong>${formatDate(asg.releaseAt, true)}</strong></span>
                        </div>
                        ${
                          asg.dueAt
                            ? `<div class="flex items-center gap-1.5 text-rose-600">
                                <i data-lucide="alarm-clock" class="w-3 h-3"></i>
                                <span>Tenggat: <strong>${formatDate(asg.dueAt, true)}</strong></span>
                               </div>`
                            : ""
                        }
                      </div>

                      <div class="mt-3 flex flex-wrap gap-2">
                        ${
                          asg.fileUrl || asg.fileId
                            ? `<button type="button" data-dl-material="${esc(asg.id)}" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold">
                                <i data-lucide="download" class="w-3.5 h-3.5"></i> Download Soal
                               </button>`
                            : ""
                        }
                        ${
                          user.role === "praktikan"
                            ? `<label class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold cursor-pointer">
                                <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                                <span>${mySub ? "Ganti File Tugas" : "Upload Tugas"}</span>
                                <input type="file" data-upload-sub="${esc(asg.id)}" accept="${ALLOWED_EXT.join(",")}" class="hidden" />
                               </label>`
                            : ""
                        }
                      </div>

                      ${
                        mySub
                          ? `<div class="mt-2.5 p-2 rounded-lg bg-emerald-50 border border-emerald-100 text-[11px] text-emerald-800 flex items-center justify-between gap-2">
                              <span class="truncate"><strong>Terkirim:</strong> ${esc(mySub.fileName)} (${formatKB(mySub.fileSize)})</span>
                              ${
                                mySub.fileUrl || mySub.fileId
                                  ? `<button type="button" data-dl-sub="${esc(mySub.id)}" class="text-emerald-700 font-bold underline shrink-0">Unduh</button>`
                                  : `<span class="text-[10px] text-emerald-600 font-semibold shrink-0">Tersimpan</span>`
                              }
                             </div>`
                          : ""
                      }
                    </div>
                  </div>
                </div>
              `;
            })
            .join("")}
        </div>`;
    }

    // --- MENU KELAS (ASISTEN & DUAL-ROLE ADMIN) ---
    function renderKelasView(user) {
      const taught = getTaughtClasses(user.id);
      if (taught.length === 0) {
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center">
            <i data-lucide="users" class="w-8 h-8 text-slate-300 mx-auto mb-2"></i>
            <p class="text-xs font-semibold text-slate-600">Anda belum ditugaskan mengampu kelas mana pun.</p>
          </div>
        `;
      }

      if (!ui.selectedKelasId || !taught.some((c) => c.id === ui.selectedKelasId)) {
        ui.selectedKelasId = taught[0].id;
      }

      const activeClass = taught.find((c) => c.id === ui.selectedKelasId);
      const studentIds = activeClass && Array.isArray(activeClass.studentIds) ? activeClass.studentIds : [];
      const students = db.users
        .filter((u) => studentIds.includes(u.id))
        .sort((a, b) => String(a.username || "").localeCompare(String(b.username || "")));

      const classAsgIds = db.assignments.filter((a) => a.classId === ui.selectedKelasId).map((a) => a.id);

      return `
        <div class="mb-3">
          <label class="block text-[11px] font-bold text-slate-500 mb-1">Pilih Kelas Diampu</label>
          <select id="sel-kelas-asisten" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
            ${taught
              .map(
                (c) => `<option value="${esc(c.id)}" ${c.id === ui.selectedKelasId ? "selected" : ""}>${esc(c.name)} — ${esc(c.courseName || "")}</option>`
              )
              .join("")}
          </select>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-500 mb-2.5 px-1">
          <span>Jumlah Praktikan: <strong class="text-slate-900">${students.length}</strong></span>
          <span>Ketuk nama untuk menilai</span>
        </div>

        ${
          students.length === 0
            ? `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-500">
                Belum ada praktikan di kelas ini. Ketuk <strong>+ Praktikan</strong> di pojok kanan atas.
               </div>`
            : `<div class="space-y-2.5">
                ${students
                  .map((st) => {
                    const subCount = db.submissions.filter(
                      (s) => s.studentId === st.id && classAsgIds.includes(s.assignmentId)
                    ).length;
                    const gradedCount = db.grades.filter(
                      (g) => g.studentId === st.id && g.classId === ui.selectedKelasId
                    ).length;

                    return `
                      <div class="bg-white rounded-2xl border border-slate-200 px-3.5 py-3 flex items-center justify-between gap-2 shadow-sm">
                        <button type="button" data-open-student="${esc(st.id)}" class="flex-1 text-left flex items-center justify-between gap-2 min-w-0">
                          <div class="flex items-center gap-3 min-w-0">
                            <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-700 font-bold text-xs flex items-center justify-center shrink-0">
                              ${esc((st.fullName || "P").charAt(0).toUpperCase())}
                            </div>
                            <div class="min-w-0">
                              <div class="font-bold text-xs text-slate-900 truncate">${esc(st.fullName)}</div>
                              <div class="text-[10px] text-slate-500 font-mono">NIM: ${esc(st.username)} • ${subCount} tugas (${gradedCount} dinilai)</div>
                            </div>
                          </div>
                          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 shrink-0"></i>
                        </button>
                        <button type="button" data-remove-student="${esc(st.id)}" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl shrink-0" aria-label="Keluarkan praktikan">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </div>
                    `;
                  })
                  .join("")}
               </div>`
        }
      `;
    }

    // --- MENU NILAI (REKAP REAL-TIME + EXPORT .xlsx / .docx / .pdf) ---
    function renderNilaiView(user) {
      const availableClasses = isAdmin(user) ? db.classes : getTaughtClasses(user.id);
      const showDualBtn = isDualRole(user) && getTaughtClasses(user.id).length > 0;

      if (availableClasses.length === 0) {
        return `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-500">Belum ada kelas untuk ditampilkan.</div>`;
      }

      if (!ui.selectedNilaiClassId || !availableClasses.some((c) => c.id === ui.selectedNilaiClassId)) {
        ui.selectedNilaiClassId = availableClasses[0].id;
      }

      const matrix = buildGradeMatrix(ui.selectedNilaiClassId);

      return `
        ${
          showDualBtn
            ? `<button type="button" id="btn-dualrole-kelas" class="mb-3 w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold flex items-center justify-center gap-2 shadow-sm transition">
                <i data-lucide="users" class="w-4 h-4"></i>
                <span>Mode Asisten: Kelola Praktikan & Input Nilai Kelas Saya</span>
               </button>`
            : ""
        }

        <div class="mb-3">
          <label class="block text-[11px] font-bold text-slate-500 mb-1">Filter Kelas</label>
          <select id="sel-kelas-nilai" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
            ${availableClasses
              .map(
                (c) => `<option value="${esc(c.id)}" ${c.id === ui.selectedNilaiClassId ? "selected" : ""}>${esc(c.name)} — ${esc(c.courseName || "")}</option>`
              )
              .join("")}
          </select>
        </div>

        <!-- 3 Tombol Export Client-Side -->
        <div class="grid grid-cols-3 gap-2 mb-4">
          <button type="button" id="btn-export-xlsx" class="py-2.5 px-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center justify-center gap-1 shadow-sm">
            <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> Excel
          </button>
          <button type="button" id="btn-export-docx" class="py-2.5 px-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center justify-center gap-1 shadow-sm">
            <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Word
          </button>
          <button type="button" id="btn-export-pdf" class="py-2.5 px-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold flex items-center justify-center gap-1 shadow-sm">
            <i data-lucide="file-down" class="w-3.5 h-3.5"></i> PDF
          </button>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="px-3.5 py-2.5 bg-slate-50 border-b border-slate-200 text-[11px] text-slate-600 flex items-center justify-between">
            <span>Kelas: <strong class="text-slate-900">${esc(matrix.className)}</strong></span>
            <span>Praktikan: <strong class="text-slate-900">${matrix.rows.length}</strong></span>
          </div>

          ${
            matrix.rows.length === 0
              ? `<div class="p-8 text-center text-xs text-slate-500">Belum ada praktikan terdaftar di kelas ini.</div>`
              : `<div class="overflow-x-auto app-scroll">
                  <table class="w-full text-[11px] text-left">
                    <thead class="bg-slate-900 text-white">
                      <tr>
                        <th class="px-2.5 py-2.5">No</th>
                        <th class="px-2.5 py-2.5">NIM</th>
                        <th class="px-2.5 py-2.5">Nama Praktikan</th>
                        ${matrix.assignments
                          .map((a) => `<th class="px-2.5 py-2.5 whitespace-nowrap text-center">${esc(a.title)}</th>`)
                          .join("")}
                        <th class="px-2.5 py-2.5 text-center">Rata²</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${matrix.rows
                        .map(
                          (r) => `
                            <tr class="hover:bg-slate-50">
                              <td class="px-2.5 py-2.5 text-slate-500">${r.no}</td>
                              <td class="px-2.5 py-2.5 font-mono text-slate-700">${esc(r.nim)}</td>
                              <td class="px-2.5 py-2.5 font-semibold text-slate-900 whitespace-nowrap">${esc(r.fullName)}</td>
                              ${matrix.assignments
                                .map(
                                  (a) => `<td class="px-2.5 py-2.5 text-center font-medium">${r.scores[a.id] !== null ? r.scores[a.id] : "-"}</td>`
                                )
                                .join("")}
                              <td class="px-2.5 py-2.5 text-center font-bold text-blue-700">${r.average !== null ? r.average.toFixed(1) : "-"}</td>
                            </tr>
                          `
                        )
                        .join("")}
                    </tbody>
                  </table>
                 </div>`
          }
        </div>
      `;
    }

    // --- MENU ASISTEN (KHUSUS ADMIN) ---
    function renderAsistenView() {
      const staff = db.users
        .filter((u) => u.role === "admin" || u.role === "asisten")
        .sort((a, b) => {
          if (a.role !== b.role) return a.role === "admin" ? -1 : 1;
          return String(a.fullName || "").localeCompare(String(b.fullName || ""));
        });

      return `
        <!-- Kartu Kelola Daftar Kelas (Khusus Admin) -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm mb-4">
          <div class="flex items-center justify-between gap-2 mb-3">
            <div>
              <h3 class="font-bold text-sm text-slate-900">Daftar Kelas Praktikum</h3>
              <p class="text-[11px] text-slate-500">Total ${db.classes.length} kelas aktif</p>
            </div>
            <button type="button" id="btn-add-class" class="flex items-center gap-1 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-xl">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Kelas
            </button>
          </div>

                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <div class="flex items-center flex-wrap gap-1.5">
                        <h3 class="font-bold text-sm text-slate-900 truncate">${esc(p.fullName)}</h3>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${

                      </div>
                      <div class="text-[11px] text-slate-500 font-mono mt-0.5">ID: ${esc(p.username)}</div>

                  ${
                    p.role === "admin"
                      ? `<button type="button" data-toggle-dual="${esc(p.id)}" class="mt-3 w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl border text-xs font-semibold transition ${
                          p.isAsisten

                            <i data-lucide="shield" class="w-3.5 h-3.5"></i>
                            Dual-Role (Merangkap Asisten)
                          </span>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
                            p.isAsisten ? "bg-indigo-600 text-white" : "bg-slate-300 text-slate-700"
                          }">${p.isAsisten ? "AKTIF" : "NONAKTIF"}</span>
                         </button>`
                      : ""
                  }

                  ${
                    canAssign
                      ? `<div class="mt-3 pt-3 border-t border-slate-100">
                          <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-2">Kelas yang Diampu</div>
                          <div class="flex flex-wrap gap-1.5">
                            ${db.classes
                              .map((c) => {
                                const assigned = Array.isArray(c.assistantIds) && c.assistantIds.includes(p.id);
                                return `
                                  <button type="button" data-toggle-class="${esc(p.id)}::${esc(c.id)}" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border transition ${

                              .join("")}

                  }

            .join("")}

              <p class="text-[11px] text-emerald-100 mt-0.5">

            </div>
          </div>

          <div class="p-4 space-y-4">

              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-500">Lokal (Perangkat)</span>
                <span class="font-semibold text-slate-800">${backupCfg.lastLocalSavedAt ? formatDate(backupCfg.lastLocalSavedAt, true) : "Baru saja"}</span>

                  ? `<div class="flex items-center justify-between gap-2">
                      <span class="text-slate-500">Google Drive</span>
                      <span class="font-semibold text-slate-800">${backupCfg.lastDriveBackupAt ? formatDate(backupCfg.lastDriveBackupAt, true) : "Belum pernah"}</span>

                   <button type="button" id="btn-backup-now" ${ui.isBackingUp ? "disabled" : ""} class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-65 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-md shadow-emerald-600/20 transition">
                     <i data-lucide="${ui.isBackingUp ? "loader-2" : "cloud-upload"}" class="w-4 h-4 ${ui.isBackingUp ? "animate-spin" : ""}"></i>
                     <span>${ui.isBackingUp ? "Mencadangkan ke Drive..." : "Cadangkan Sekarang"}</span>

                   <!-- Jadwal Cadangan Otomatis (Default: Manual agar hemat & cepat) -->
                   <div>

            <!-- Restore (Khusus Admin) + Ekspor & Impor JSON Lokal -->
            <div class="pt-3 border-t border-slate-100 space-y-2">
              ${

                      <i data-lucide="cloud-download" class="w-4 h-4"></i>
                      <span>Pulihkan Cadangan Terakhir</span>
                     </button>`

              }
              <div class="grid grid-cols-2 gap-2">
                <button type="button" id="btn-export-local-json" class="py-2.5 px-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                  <i data-lucide="download" class="w-3.5 h-3.5 text-blue-600"></i>
                  <span>Ekspor JSON</span>
                </button>
                <label class="py-2.5 px-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold flex items-center justify-center gap-1.5 transition cursor-pointer">
                  <i data-lucide="upload" class="w-3.5 h-3.5 text-emerald-600"></i>
                  <span>Impor JSON</span>
